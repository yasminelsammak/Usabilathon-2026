.material-icons{font-family:'Material Icons';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';-webkit-font-smoothing:antialiased;}

:root {
  --colorPrimary:#2A827B; --colorPrimaryBg:#F2FAF8; --colorPrimaryBorder:#62ABA3;
  --colorPrimaryHover:#136B65; --colorPrimaryActive:#054946;
  --colorText:#000; --colorTextSecondary:#5A6872; --colorTextTertiary:#9BA8B0; --colorTextWhite:#fff;
  --colorBgBase:#F4F5F7; --colorBgCard:#fff; --colorBgElevated:#F9FAFB; --colorBgChip:#F9FAFB;
  --colorBorder:#D9E2E8; --colorBorderSecondary:#E8E8E8; --colorSeparator:#D9D9D9; --colorLink:#1B8CB1;
  --colorError:#FF4D4F; --colorErrorBg:#FFF6F6;
  --colorWarning:#F79A3E; --colorWarningBg:#FFFAF4; --colorWarningText:#6D2F03; --colorWarningBorder:#F5D9B8; --colorWarningBorderStrong:#F0D6B0;
  --colorInfo:#30A9CD; --colorInfoBg:#F0FCFF; --colorInfoBorder:#C5E7F0; --colorInfoText:#1B6F8C; --colorInfoBorderSoft:#D7EEF5;
  --colorEmergency:#3F3D91; --colorEmergencyHover:#34327A;
  --fontFamily:'Figtree',-apple-system,BlinkMacSystemFont,sans-serif;
  --fontSize:14px; --fontSizeSM:12px; --fontSizeLG:16px; --fontSizeXL:20px; --fontWeightStrong:600;
  --borderRadiusXS:4px; --borderRadiusS:6px; --borderRadiusM:8px; --borderRadiusL:16px;
  --boxShadow:0 1px 2px rgba(0,0,0,.03),0 1px 6px -1px rgba(0,0,0,.02),0 2px 4px rgba(0,0,0,.02);
  --boxShadowSecondary:0 6px 16px rgba(0,0,0,.08),0 3px 6px -4px rgba(0,0,0,.12),0 9px 28px 8px rgba(0,0,0,.05);
  --gradientPrimary:linear-gradient(145deg,#3A9389 0%,#2A827B 55%,#1E6F69 100%);
  --gradientWarning:linear-gradient(145deg,#F8B65F,#F79A3E 55%,#E07F1E);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fontFamily);font-size:var(--fontSize);color:var(--colorText);background:var(--colorBgBase);-webkit-font-smoothing:antialiased;min-height:100vh}

/* app shell — real WorkFlex left navigation + content column (matches the BT landing) */
.app{display:grid;grid-template-columns:1fr;min-height:100vh}
.appnav{display:none}
.appnav .brand{display:flex;align-items:center;gap:9px;padding:6px 8px 20px}
.appnav .brand .logo{width:24px;height:24px;flex-shrink:0}
.appnav .brand .bnm{font-size:var(--fontSizeLG);font-weight:700;color:var(--colorPrimary)}
.appnav .brand .ham{margin-left:auto;color:var(--colorTextSecondary);cursor:pointer;display:flex}
.appnav nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--borderRadiusM);color:var(--colorTextSecondary);text-decoration:none;font-weight:500;cursor:pointer}
.nav-item .material-icons{font-size:19px}
.nav-item:hover{background:var(--colorBgElevated)}
.nav-item.active{background:var(--colorPrimaryBg);color:var(--colorPrimaryActive);font-weight:600}
.nav-item.active .material-icons{color:var(--colorPrimary)}
.nav-item.emergency{color:var(--colorError)}
.nav-item.emergency .material-icons{color:var(--colorError)}
.nav-item.emergency:hover{background:var(--colorErrorBg,#FFF6F6)}
.appnav .nav-bottom{margin-top:auto;padding-top:14px}
.appnav .user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--borderRadiusM);cursor:pointer}
.appnav .user:hover{background:var(--colorBgElevated)}
.appnav .user .ava{width:34px;height:34px;flex-shrink:0;border-radius:50%;background:var(--colorPrimaryBg);color:var(--colorPrimary);border:1px solid var(--colorPrimaryBorder);display:flex;align-items:center;justify-content:center;font-size:var(--fontSizeSM);font-weight:600}
.appnav .user .unm{flex:1;font-size:var(--fontSizeSM);font-weight:600;line-height:1.25}
.appnav .user .material-icons{color:var(--colorTextTertiary);font-size:18px}
.appnav .foot{display:flex;align-items:center;gap:7px;padding:14px 8px 4px;color:var(--colorPrimary);font-weight:700;font-size:var(--fontSize)}
.appnav .foot .logo{width:18px;height:18px}
.content{display:flex;flex-direction:column;min-width:0}
/* header right side — profile + language pills (company-settings style) */
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.topbar-right .form-link{margin-left:0}
.hp-user,.hp-lang{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--colorBorder);background:var(--colorBgCard);border-radius:100px;padding:5px 12px 5px 6px;cursor:pointer;font-family:var(--fontFamily);font-size:var(--fontSize);color:var(--colorText)}
.hp-user:hover,.hp-lang:hover{background:var(--colorBgElevated)}
.hp-ava{width:30px;height:30px;flex-shrink:0;border-radius:50%;background:var(--colorPrimaryBg);border:1px solid var(--colorPrimaryBorder);color:var(--colorPrimary);display:flex;align-items:center;justify-content:center;font-size:var(--fontSizeSM);font-weight:600}
.hp-name{font-weight:600;color:var(--colorText)}
.hp-user>.material-icons,.hp-lang>.material-icons{font-size:18px;color:var(--colorTextSecondary)}
.hp-lang{padding:8px 12px}
.hp-flag{font-size:16px}
.hp-wrap{position:relative}
.hp-menu{position:absolute;top:calc(100% + 8px);right:0;min-width:296px;background:var(--colorBgCard);border:1px solid var(--colorBorder);border-radius:var(--borderRadiusM);box-shadow:var(--boxShadowSecondary);padding:6px;display:none;z-index:60}
.hp-menu.open{display:block}
.hp-menu-head{display:flex;align-items:center;gap:12px;padding:12px 12px 10px}
.hp-menu-head .hp-ava{width:40px;height:40px;font-size:var(--fontSize)}
.hp-mh-name{font-weight:600;font-size:var(--fontSizeLG)}
.hp-mh-email{font-size:var(--fontSizeSM);color:var(--colorTextSecondary)}
.hp-div{height:1px;background:var(--colorBorderSecondary);margin:5px 12px}
.hp-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--borderRadiusS);color:var(--colorText);text-decoration:none;font-size:var(--fontSize);cursor:pointer}
.hp-item:hover{background:var(--colorBgElevated)}
.hp-item>.material-icons:first-child{font-size:20px;color:var(--colorTextSecondary)}
.hp-item .hp-ext{margin-left:auto;font-size:16px;color:var(--colorTextTertiary)}
/* document toggle cards (icons + explanation) */
.doc-list{display:flex;flex-direction:column;gap:10px;text-align:left;max-width:640px;margin:0 auto}
.doc-opt{display:flex;align-items:center;gap:11px;width:100%;padding:10px 14px;border:1px solid var(--colorBorder);border-radius:var(--borderRadiusL);background:var(--colorBgCard);cursor:pointer;font-family:var(--fontFamily);text-align:left}
.doc-opt:hover{border-color:var(--colorPrimaryBorder)}
.doc-opt.on{border-color:var(--colorPrimary);background:var(--colorPrimaryBg)}
.doc-ic{width:30px;height:30px;flex-shrink:0;border-radius:var(--borderRadiusM);background:var(--colorPrimaryBg);border:1px solid var(--colorPrimaryBorder);display:flex;align-items:center;justify-content:center}
.doc-ic .material-icons{font-size:17px}
.doc-ic .material-icons{font-size:20px;color:var(--colorPrimary)}
.doc-b{flex:1;min-width:0}
.doc-t{font-size:var(--fontSize);font-weight:600;display:flex;align-items:center;gap:8px}
.doc-tag{font-size:11px;font-weight:600;padding:1px 8px;border-radius:100px;background:var(--colorBgElevated);color:var(--colorTextSecondary);border:1px solid var(--colorBorderSecondary)}
.doc-tag.regen{background:var(--colorPrimaryBg);color:var(--colorPrimary);border-color:var(--colorPrimaryBorder)}
.doc-d{font-size:var(--fontSizeSM);color:var(--colorTextSecondary);margin-top:3px;line-height:1.4}
.doc-check{flex-shrink:0;margin-top:1px;width:22px;height:22px;border-radius:50%;border:2px solid var(--colorBorder);display:flex;align-items:center;justify-content:center;transition:.15s}
.doc-check .material-icons{font-size:22px;color:var(--colorPrimary);opacity:0;transition:.15s}
.doc-opt.on .doc-check{border-color:transparent}
.doc-opt.on .doc-check .material-icons{opacity:1}
.doc-opt.locked{cursor:default;background:var(--colorBgElevated);border-color:var(--colorBorderSecondary);opacity:.72}
.doc-opt.locked:hover{border-color:var(--colorBorderSecondary)}
.doc-opt.locked .doc-ic{opacity:.7}
.doc-lockic{font-size:20px;color:var(--colorTextTertiary);flex-shrink:0;margin-top:2px}
.doc-tag.lock{background:var(--colorBgChip);color:var(--colorTextTertiary);border:1px solid var(--colorBorderSecondary)}
.doc-lockhint{display:flex;align-items:center;gap:7px;max-width:560px;margin:12px auto 0;font-size:var(--fontSizeSM);color:var(--colorTextSecondary);line-height:1.4}
.doc-lockhint .material-icons{font-size:16px;color:var(--colorTextTertiary);flex-shrink:0}
.doc-lockhint a{color:var(--colorLink)}
.done-docs{width:100%;max-width:680px;margin:24px auto 0;display:flex;flex-direction:column;gap:10px;text-align:left}
.done-docs-h{display:flex;align-items:center;gap:7px;font-size:var(--fontSizeSM);font-weight:600;color:var(--colorPrimaryActive);margin-bottom:2px}
.done-docs-h .material-icons{font-size:16px;color:var(--colorPrimary)}
.done-doc{display:flex;align-items:center;gap:13px;padding:13px 15px;background:var(--colorBgCard);border:1px solid var(--colorBorder);border-radius:var(--borderRadiusL);box-shadow:var(--boxShadow)}
.done-doc-ic{width:38px;height:38px;flex-shrink:0;border-radius:var(--borderRadiusM);background:var(--colorPrimaryBg);border:1px solid var(--colorPrimaryBorder);display:flex;align-items:center;justify-content:center}
.done-doc-ic .material-icons{font-size:20px;color:var(--colorPrimary)}
.done-doc-b{flex:1;min-width:0;text-align:left}
.done-doc-t{font-size:var(--fontSize);font-weight:600}
.done-doc-s{display:flex;align-items:center;gap:4px;font-size:var(--fontSizeSM);color:var(--colorPrimaryHover);margin-top:1px}
.done-doc-s .material-icons{font-size:14px;color:var(--colorPrimary)}
.done-doc-s .spin{animation:spin 1s linear infinite}
.done-docs-note{display:flex;align-items:flex-start;gap:8px;margin-top:6px;padding:11px 14px;background:var(--colorPrimaryBg);border:1px solid var(--colorPrimaryBorder);border-radius:var(--borderRadiusM);font-size:var(--fontSizeSM);color:var(--colorText);line-height:1.5}
.done-docs-note .material-icons{font-size:16px;color:var(--colorPrimary);flex-shrink:0;margin-top:1px}
.done-docs-note a{color:var(--colorLink);font-weight:600;cursor:pointer;text-decoration:underline;white-space:nowrap}
/* (2) Form-style review before submit */
.rev-docs{background:var(--colorBgCard);border:1px solid var(--colorBorder);border-radius:var(--borderRadiusL);box-shadow:var(--boxShadow);padding:16px 20px;margin-bottom:16px}
.rev-docs-h{display:flex;align-items:center;gap:8px;font-size:var(--fontSizeLG);font-weight:700;margin-bottom:12px}
.rev-docs-h .material-icons{font-size:19px;color:var(--colorPrimary)}
.rev-count{font-size:11px;font-weight:700;color:var(--colorPrimary);background:var(--colorPrimaryBg);border:1px solid var(--colorPrimaryBorder);border-radius:100px;padding:0 8px}
.rev-doc{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--colorBorderSecondary)}
.rev-doc:first-of-type{border-top:none}
.rev-doc-ic{font-size:20px;color:var(--colorPrimary)}
.rev-doc-chk{font-size:20px;color:var(--colorPrimary);flex-shrink:0}
.rev-doc-b{flex:1;display:flex;flex-direction:column}
.rev-doc-b b{font-size:var(--fontSize);font-weight:600}
.rev-doc-b span{font-size:var(--fontSizeSM);color:var(--colorTextSecondary)}
.rev-toggle{width:36px;height:20px;border-radius:100px;background:var(--colorBorder);position:relative;flex-shrink:0}
.rev-toggle.on{background:var(--colorPrimary)}
.rev-toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.rev-toggle.on::after{transform:translateX(16px)}
.rev-docs-note{display:flex;align-items:center;gap:7px;margin-top:10px;padding-top:10px;border-top:1px solid var(--colorBorderSecondary);font-size:var(--fontSizeSM);color:var(--colorTextSecondary)}
.rev-docs-note .material-icons{font-size:15px;color:var(--colorTextTertiary)}
.rev-sec{background:var(--colorBgCard);border:1px solid var(--colorBorder);border-radius:var(--borderRadiusL);box-shadow:var(--boxShadow);padding:6px 20px 8px;margin-bottom:14px}
.rev-sec-h{display:flex;align-items:center;gap:10px;padding:14px 0 12px;border-bottom:1px solid var(--colorBorderSecondary)}
.rev-sec-t{display:flex;align-items:center;gap:8px;font-size:var(--fontSizeLG);font-weight:700}
.rev-sec-t .material-icons{font-size:18px;color:var(--colorPrimary)}
.rev-sec-miss{font-size:11px;font-weight:700;color:var(--colorWarningText);background:var(--colorWarningBg);border:1px solid var(--colorWarning);border-radius:100px;padding:1px 8px}
.rev-edit{margin-left:auto;color:var(--colorLink);font-weight:600;font-size:var(--fontSizeSM);cursor:pointer}
.rev-edit:hover{text-decoration:underline}
.rev-rows{display:flex;flex-direction:column}
.rev-row{display:flex;align-items:baseline;justify-content:space-between;gap:20px;padding:10px 0;border-top:1px solid var(--colorBorderSecondary);cursor:pointer;transition:background .1s}
.rev-row:first-child{border-top:none}
.rev-row:hover{background:var(--colorBgElevated)}
.rev-q{flex:1;font-size:var(--fontSize);color:var(--colorTextSecondary);line-height:1.4}
.rev-a{flex-shrink:0;max-width:48%;text-align:right;font-size:var(--fontSize);font-weight:600;color:var(--colorText);line-height:1.4}
.rev-row.na .rev-a{color:var(--colorTextTertiary);font-weight:500;font-style:italic}
.pc-same{display:flex;align-items:center;gap:8px;width:100%;max-width:540px;margin:0 auto 16px;font-size:var(--fontSize);color:var(--colorTextSecondary);cursor:pointer}
.pc-same input{width:16px;height:16px;accent-color:var(--colorPrimary)}
.pc-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:540px;margin:0 auto;text-align:left}
.pc-row{display:flex;align-items:center;gap:14px}
.pc-lbl{flex-shrink:0;width:72px;font-size:var(--fontSize);font-weight:600;color:var(--colorTextSecondary)}
.pc-inp{flex:1;min-width:0;height:44px;border:1.5px solid var(--colorBorder);border-radius:var(--borderRadiusM);padding:0 14px;font-family:var(--fontFamily);font-size:var(--fontSize);color:var(--colorText);background:var(--colorBgCard)}
.pc-inp:focus{outline:none;border-color:var(--colorPrimary)}
.autosave{display:inline-flex;align-items:center;gap:6px;font-size:var(--fontSizeSM);font-weight:500;color:var(--colorPrimary)}
.autosave .material-icons{font-size:16px}
/* drafts inbox card */
.draft-card{display:flex;align-items:center;gap:16px;width:100%;max-width:600px;margin:0 auto;padding:20px 24px;border:1.5px solid var(--colorBorder);border-radius:var(--borderRadiusL);background:var(--colorBgCard);cursor:pointer;font-family:var(--fontFamily);text-align:left}
.draft-card:hover{border-color:var(--colorPrimaryBorder);background:var(--colorPrimaryBg)}
.draft-ic{width:40px;height:40px;flex-shrink:0;border-radius:var(--borderRadiusM);background:var(--colorPrimaryBg);border:1px solid var(--colorPrimaryBorder);display:flex;align-items:center;justify-content:center}
.draft-ic .material-icons{font-size:21px;color:var(--colorPrimary)}
.draft-b{flex:1;min-width:0}
.draft-t{font-size:var(--fontSize);font-weight:600}
.draft-m{font-size:var(--fontSizeSM);color:var(--colorTextSecondary);margin-top:6px;line-height:1.45}
.draft-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.draft-filled{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--colorPrimaryHover)}
.draft-filled .material-icons{font-size:14px;color:var(--colorPrimary)}
.draft-progress{height:5px;border-radius:100px;background:var(--colorBorderSecondary);margin-top:10px;overflow:hidden}
.draft-progress-fill{height:100%;border-radius:100px;background:var(--colorPrimary)}
.draft-badge{flex-shrink:0;font-size:11px;font-weight:600;padding:2px 9px;border-radius:100px;background:var(--colorWarningBg);color:var(--colorWarningText);border:1px solid var(--colorWarningBorder)}
.draft-badge.repeat{background:var(--colorPrimaryBg);color:var(--colorPrimary);border-color:var(--colorPrimaryBorder)}
.draft-ic.repeat{background:var(--colorPrimaryBg)}
.draft-sep{max-width:600px;margin:14px auto;text-align:center;font-size:var(--fontSizeSM);color:var(--colorTextTertiary)}
.draft-go{color:var(--colorTextTertiary);font-size:20px;flex-shrink:0}
/* locked (ask HR) */
.hero-icon.locked{background:var(--colorWarningBg);box-shadow:none}
.hero-icon.locked .material-icons{color:var(--colorWarning);font-size:30px}
.locked-card{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--colorBgCard);border:1px solid var(--colorBorder);border-radius:var(--borderRadiusL);padding:18px;margin:18px 0}
.locked-card .material-icons{font-size:22px;color:var(--colorPrimary)}
.locked-card .lc-t{font-size:var(--fontSize);font-weight:600}
.locked-card .lc-d{font-size:var(--fontSizeSM);color:var(--colorTextSecondary);margin-top:2px;line-height:1.4}
.um-gear{width:36px;height:36px;border:none;background:none;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--colorTextSecondary)}
.um-gear:hover{background:var(--colorBgElevated)}
.um-gear .material-icons{font-size:20px}
.um-user{display:inline-flex;align-items:center;gap:8px;border:none;background:none;cursor:pointer;font-family:var(--fontFamily);padding:4px 8px 4px 4px;border-radius:100px}
.um-user:hover{background:var(--colorBgElevated)}
.um-ava{width:30px;height:30px;flex-shrink:0;border-radius:50%;background:var(--colorPrimaryBg);border:1px solid var(--colorPrimaryBorder);color:var(--colorPrimary);display:flex;align-items:center;justify-content:center;font-size:var(--fontSizeSM);font-weight:600}
.um-name{font-size:var(--fontSize);font-weight:600;color:var(--colorText)}
.um-user .material-icons{font-size:18px;color:var(--colorTextSecondary)}
/* emergency call — bottom of the panel, purple */
.emergency-btn{display:flex;align-items:center;gap:10px;width:100%;margin-bottom:10px;padding:11px 14px;border:none;border-radius:var(--borderRadiusM);background:var(--colorEmergency);color:#fff;font-family:var(--fontFamily);font-size:var(--fontSize);font-weight:600;cursor:pointer}
.emergency-btn:hover{background:var(--colorEmergencyHover)}
.emergency-btn .material-icons{font-size:19px}
@media(max-width:900px){.app{grid-template-columns:1fr}.appnav{display:none}}
.topbar{display:flex;align-items:center;gap:14px;height:64px;padding:0 24px;background:var(--colorBgCard);border-bottom:1px solid var(--colorBorder);position:sticky;top:0;z-index:10}
.topbar .back{width:38px;height:38px;flex-shrink:0;border:1px solid var(--colorBorder);border-radius:var(--borderRadiusM);background:var(--colorBgCard);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--colorText)}
.topbar .back:hover{background:var(--colorBgElevated)}
.topbar .title{font-size:var(--fontSizeLG);font-weight:600}
.hdr-docs{display:inline-flex;align-items:center;gap:6px;font-size:var(--fontSizeSM);font-weight:500;color:var(--colorTextSecondary)}
.hdr-docs[hidden]{display:none}
.hdr-docs .material-icons{font-size:15px;color:var(--colorTextTertiary)}
.topbar .ai-pill{display:inline-flex;align-items:center;gap:5px;background:var(--gradientPrimary);color:#fff;font-size:var(--fontSizeSM);font-weight:600;padding:3px 10px 3px 8px;border-radius:100px}
.topbar .autosave{display:inline-flex;align-items:center;gap:5px;font-size:var(--fontSizeSM);color:var(--colorTextTertiary);font-weight:500}
.topbar .autosave[hidden]{display:none}
.topbar .autosave .material-icons{font-size:16px;color:var(--colorPrimary)}
.topbar .ai-pill .material-icons{font-size:14px}
.topbar .form-link{margin-left:auto;color:var(--colorLink);font-weight:600;text-decoration:none}
.topbar .form-link:hover{text-decoration:underline}

.shell{display:flex;align-items:flex-start}
.main{flex:1;min-width:0;padding:52px 32px 24px;display:flex;flex-direction:column;align-items:center}
.main>#view{width:100%}
.main>#flowGate{width:100%}
#view{width:100%;min-width:0}
.rightpanel{width:340px;flex-shrink:0;display:flex;flex-direction:column;border-left:1px solid var(--colorBorder);background:var(--colorBgCard);min-height:calc(100vh - 64px);padding:30px 26px;position:sticky;top:64px}
.rp-progress-head{display:flex;align-items:center;gap:6px;font-size:var(--fontSizeSM);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--colorTextTertiary);margin-bottom:12px}
.rp-progress-head .material-icons{font-size:15px;color:var(--colorPrimary)}
.rp-bar{height:4px;background:var(--colorBorderSecondary);border-radius:100px;overflow:hidden;margin-bottom:24px}
.rp-bar-fill{height:100%;background:var(--colorPrimary);transition:width .3s}
.rp-stepper{display:flex;flex-direction:column;margin-bottom:26px}
.rp-step{display:flex;gap:12px;position:relative;padding-bottom:22px}
.rp-step:last-child{padding-bottom:0}
.rp-step .rp-dot{width:14px;height:14px;flex-shrink:0;margin-top:2px;border-radius:50%;border:2px solid var(--colorBorder);background:var(--colorBgCard);box-sizing:border-box;position:relative;z-index:1}
/* connector runs from this dot's centre down to the next dot's centre */
.rp-step:not(:last-child)::before{content:'';position:absolute;left:6px;top:9px;height:100%;width:2px;background:var(--colorBorder)}
.rp-step.active .rp-dot{border-color:var(--colorPrimary);background:var(--colorPrimary);box-shadow:0 0 0 4px var(--colorPrimaryBg)}
.rp-step.rp-done .rp-dot{border-color:var(--colorPrimary);background:var(--colorPrimary)}
.rp-step.rp-done:not(:last-child)::before{background:var(--colorPrimary)}
.rp-step-label{font-weight:600;font-size:var(--fontSize)}
.rp-step:not(.active):not(.done) .rp-step-label{color:var(--colorTextSecondary)}
.rp-step-meta{font-size:var(--fontSizeSM);color:var(--colorTextTertiary);margin-top:1px}
.rp-sum-title{font-size:var(--fontSizeSM);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--colorTextTertiary);margin-bottom:4px}
.rp-row{padding:11px 0;border-bottom:1px solid var(--colorBorderSecondary)}
.rp-row:last-child{border-bottom:none}
.rp-l{font-size:var(--fontSizeSM);color:var(--colorTextTertiary);margin-bottom:3px}
.rp-v{font-size:var(--fontSize);color:var(--colorText);font-weight:500}
.rp-v.empty{color:var(--colorTextTertiary);font-weight:400}
.rp-tag{font-size:11px;font-weight:600;color:var(--colorPrimary);background:var(--colorPrimaryBg);border:1px solid var(--colorPrimaryBorder);border-radius:100px;padding:0 7px;margin-left:4px}
/* Progress rail shown while filling the questions */
.rp-prog-h{font-size:var(--fontSizeSM);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--colorTextTertiary);margin-bottom:10px}
.rp-prog-bar{height:8px;border-radius:100px;background:var(--colorBorderSecondary);overflow:hidden}
.rp-prog-fill{height:100%;background:var(--gradientPrimary);border-radius:100px;transition:width .35s ease}
/* (7) Line progress bar with a visible percentage */
.rp-prog-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.rp-pct{font-size:var(--fontSizeXL);font-weight:700;color:var(--colorPrimary)}
.rp-line{height:8px;border-radius:100px;background:var(--colorBorderSecondary);overflow:hidden}
.rp-line-fill{height:100%;background:var(--gradientPrimary);border-radius:100px;transition:width .35s ease;min-width:6px}
/* (3) Expandable "still to fill" sections */
.rp-acc-wrap{display:flex;flex-direction:column;margin-top:8px}
.rp-acc{border-bottom:1px solid var(--colorBorderSecondary)}
.rp-acc>summary{display:block;padding:11px 2px;cursor:pointer;list-style:none}
.rp-acc>summary::-webkit-details-marker{display:none}
.rp-acc>summary::marker{content:''}
.rp-sum{display:flex;align-items:center;gap:9px;font-size:var(--fontSize);font-weight:600;color:var(--colorText)}
.rp-acc .rp-chev{margin-left:auto;font-size:19px;color:var(--colorTextTertiary);transition:transform .18s}
.rp-acc[open] .rp-chev{transform:rotate(180deg)}
.rp-acc-items{padding:2px 2px 14px 2px;display:flex;flex-direction:column;gap:8px}
/* Align accordion headers + items flush-left with the section titles (the group icon was pushing them ~29px right) */

.rp-acc-item{font-size:var(--fontSizeSM);color:var(--colorTextSecondary);line-height:1.4;position:relative;padding-left:12px}
