/* ---- detection reasoning (assignment always, but derive the factors) ---- */
function analyzeAssignment(text){
  const t=' '+text.toLowerCase().replace(/-/g,' ')+' ';
  const NUMS={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12};
  let tn=t.replace(/\b(one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve)\b/g,m=>NUMS[m]);
  let durLabel='Not given',durSrc='needs the dates',durKnown=false;
  const yrs=tn.match(/(\d+)\s*year/),mos=tn.match(/(\d+)\s*month/);
  if(/permanent|indefinit|relocat/.test(t)){durLabel='Open-ended / relocation';durSrc='from your description';durKnown=true;}
  else if(yrs){durLabel=`${yrs[1]} year${yrs[1]>1?'s':''}`;durSrc='from the dates';durKnown=true;}
  else if(mos){durLabel=`${mos[1]} months`;durSrc='from the dates';durKnown=true;}
  const returns=/relocat|permanent|indefinit/.test(t)?{v:'No return planned',s:'from your description',k:'data'}:{v:'Extended posting',s:'implied by the dates',k:'inferred'};
  const factors=[
    {icon:'schedule',label:'Duration',value:durLabel,src:durSrc,kind:durKnown?'data':'assumed'},
    {icon:'u_turn_left',label:'Intent to return',value:returns.v,src:returns.s,kind:returns.k},
    {icon:'payments',label:'Who pays',value:'Company',src:'inferred from the posting',kind:'inferred'},
    {icon:'apartment',label:'Nature',value:'Longer-term posting abroad',src:'secondment / relocation',kind:'inferred'},
  ];
  const known=factors.filter(f=>f.kind!=='assumed').length;
  return {conf:Math.min(97,64+known*8),factors};
}

/* ---- pre-fill host/start/end from the first description ---- */
function prefill(){
  const raw=(state.rawText||'').trim();
  const t=' '+raw.toLowerCase().replace(/-/g,' ')+' ';
  const pre={};
  for(const c of COUNTRIES){
    const city=(c.cities||[]).find(ci=>t.includes(' '+ci.toLowerCase()));
    if(city){pre.host=`${city}, ${c.name}`;break;}
    if(c.aliases.some(a=>t.includes(' '+a))){pre.host=c.name;break;}
  }
  if(!pre.host){const m=raw.match(/\b(?:to|in|based in|office in|relocating to)\s+([A-ZÀ-Ý][a-zà-ÿ]+)/);if(m)pre.host=m[1];}
  const sm=raw.match(/\b(?:starting|starts|start|from|beginning|as of|on)\s+((?:\d{1,2}\s+)?(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*(?:\s+\d{4})?)/i);
  if(sm)pre.start=sm[1].trim().replace(/\b\w/g,m=>m.toUpperCase());
  else{const mo=raw.match(/\b(\d{1,2}\s+)?(january|february|march|april|may|june|july|august|september|october|november|december)\b/i);if(mo)pre.start=mo[0].trim();}
  const dm=t.replace(/\b(one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve)\b/g,m=>({one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12})[m]).match(/\b(\d+)\s*(year|month|week)s?\b/);
  if(dm)pre.end=`About ${dm[1]} ${dm[2]}${/s$/.test(dm[2])?'':'s'} after the start`;
  // Place of work — auto-filled from the entity address; presence names the entity (asked, pre-named).
  if(pre.host){const country=pre.host.split(', ').pop(); pre._destCountry=country; const e=COMPANY_ENTITIES[country]; if(e){pre._entity=e.entity;pre._entityCity=e.city;pre._entityAddr=e.address;pre._entityCountry=country;
    // If we have a presence in the host country and only the country was given, name the destination
    // by the entity's city (e.g. "Germany" → "Munich") — we match the assignment to that entity.
    if(!/,/.test(pre.host))pre.host=`${e.city}, ${country}`;}}
  // (5/6) Existing visa is checked against the *assignee's own profile* once they're picked
  //       (see the travelerName handler) — not globally here.
  // Assignee name — auto-detected from the description ("Sara, …" or "for Sara Müller").
  const nmA=raw.match(/^\s*([A-ZÀ-Ý][a-zà-ÿ]+(?:\s+[A-ZÀ-Ý][a-zà-ÿ]+)?)\s*(?:,|—|-|\bis\b|\bwill\b)/);
  const nmB=raw.match(/\bfor\s+([A-ZÀ-Ý][a-zà-ÿ]+(?:\s+[A-ZÀ-Ý][a-zà-ÿ]+)?)\b/);
  // Also "…sending/relocating/assigning/posting <Name>…" (e.g. "We're sending Anna Schmidt to …").
  const nmC=raw.match(/\b(?:send(?:ing)?|relocat\w*|assign(?:ing)?|post(?:ing)?|transferr?ing|moving)\s+([A-ZÀ-Ý][a-zà-ÿ]+(?:\s+[A-ZÀ-Ý][a-zà-ÿ]+)?)\b/);
  // Skip leading number/filler words ("Six-month…") — prefer a clear "for <Name>" if the lead isn't a real name.
  const BADNAME=/^(one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|the|our|my|a|an|me|i|about|around)$/i;
  const nm=(nmA&&!BADNAME.test(nmA[1])?nmA[1]:null)||(nmB&&nmB[1])||(nmC&&nmC[1])||null;
  if(nm){pre._assigneeName=nm;pre.travelerName=nm;
    // (3) The description named the assignee → if they're on the team, use them (skip the "who" question)
    //     and pull their profile: role (→ MD/C-level) and any valid visa for the host.
    const mt=matchEmployee(nm);
    if(mt.matched){pre.travelerName=mt.name;
      const role=EMPLOYEE_ROLES[mt.name];if(role){pre._homeRole=role;pre.seniorRole=isSeniorRole(role)?'Yes':'No';}
      const pv=(EMPLOYEE_VISAS[mt.name]||[]).find(x=>x.country===pre._destCountry);
      if(pv){const disp=`${pv.type} · valid to ${pv.valid}`;pre.visas='Yes';pre.visaType=pv.type;pre.visaValidity=pv.valid;pre.visaCountry=pre._destCountry;pre._storedVisa=disp;pre._visa=disp;}
    }
  }
  // ── Richer gap-fill: pull the assignment facts the description actually mentions ──
  // Purpose
  if(/intra.?group|secondment|transfer within|internal (transfer|move|assignment|relocation)|within (the|our) group|group (transfer|move|company)|to our (own )?[a-z]+ (office|branch|entity|subsidiary)|our (munich|amsterdam|new york|[a-z]+) office/.test(t))pre.purpose='Intra-group transfer';
  else if(/client|third.?party|services delivery|for a client|customer project|lead a project/.test(t))pre.purpose='Client / third-party project (services delivery)';
  else if(/agency|labour leasing|labor leasing/.test(t))pre.purpose='Temporary agency / labour leasing arrangement';
  // Payroll — always ASKED (right after the MD/C-level question), never assumed from the text,
  // so the client explicitly confirms home vs host. We only note a hint from the wording.
  // (3) Payroll stated in the description → parse it (don't re-ask). Only asked when not mentioned.
  if(/split payroll|payroll split|shadow payroll/.test(t))pre.payroll='Split';
  else if(/host payroll|local payroll|paid locally|local contract/.test(t))pre.payroll='Host';
  else if(/home payroll|paid from home|kept on home|home contract|stays on home|home payroll/.test(t))pre.payroll='Home';
  // Salary + currency
  const sal=raw.match(/(?:salary|base|paid|earn\w*|comp|makes?)[^0-9]{0,12}(€|\$|£)?\s?(\d{2,3}[,.\s]?\d{3})/i)||raw.match(/(€|\$|£)\s?(\d{2,3}[,.\s]?\d{3})/);
  const salK=raw.match(/(€|\$|£)?\s?(\d{2,3})\s*k\b/i);   // "90k", "€90 k"
  if(sal){pre.homeSalary=Number(sal[2].replace(/[.,\s]/g,'')).toLocaleString('en-US');const csym=sal[1];pre.currency=csym==='$'?'USD':csym==='£'?'GBP':'EUR';}
  else if(salK){pre.homeSalary=Number(salK[2]+'000').toLocaleString('en-US');const c2=salK[1];if(c2)pre.currency=c2==='$'?'USD':c2==='£'?'GBP':'EUR';}
  if(!pre.currency){if(/\beur\b|€|euros?/i.test(raw))pre.currency='EUR';else if(/\busd\b|\$|dollars?/i.test(raw))pre.currency='USD';else if(/\bgbp\b|£|pounds?/i.test(raw))pre.currency='GBP';}
  // Fixed workplace
  if(/office|on[- ]?site|fixed (place|location|workplace)|at our .* (office|site)/.test(t))pre.workLocation='Yes';
  else if(/remote|work from home|from anywhere|no fixed/.test(t))pre.workLocation='No';
  // "…our office in <Place>" → it's our own fixed workplace: implies a registered legal entity there,
  // and it's the work address (so we don't re-ask presence or the address).
  {const off=raw.match(/\bour\s+office\s+in\s+([A-ZÀ-Ý][a-zà-ÿ]+)/i);if(off){pre.workLocation='Yes';if(!pre.workAddress)pre.workAddress=`Our ${off[1]} office`;if(!pre.presence)pre.presence='We have a registered legal entity (subsidiary/affiliate)';}}
  // Senior role
  if(/managing director|\bmd\b|c[- ]?level|\bceo\b|\bcfo\b|\bcto\b|chief /.test(t))pre.seniorRole='Yes';
  // Client-facing work (services delivery)
  if(/deliver(ing)? services|work for a client|client project|third.?party/.test(t))pre.clientWork='Yes — for host';
  // Contract negotiation
  if(/sign(ing)? contracts|negotiat(e|ing) contracts/.test(t))pre.contracts='Yes';
  // Job title — "she'll be Project Lead", "as the Regional Manager", "role of X".
  const jm=raw.match(/\b(?:be|as|role of|title of|position of|the)\s+((?:[A-Z][a-z]+\s+){0,2}(?:Lead|Manager|Director|Engineer|Head|Officer|Specialist|Analyst|Consultant|Controller|Coordinator))/);
  if(jm)pre.jobTitle=jm[1].trim();
  // Permanent home kept in the home country → the "ties" tick-list is pre-answered.
  if(/keep\w*\s+(?:her|his|their)?\s*(?:permanent\s+)?home|maintain\w*\s+(?:her|his|their)?\s*(?:permanent\s+)?home|home stays|permanent home in/.test(t))pre.permanentHome='Yes';
  // Home country — from the description if stated, else from the assignee's profile, else the company home base.
  {const hm=raw.match(/\bhome\s+in\s+([A-Z][a-zA-Z]+)/);if(hm)pre._homeCountry=hm[1];}
  if(!pre._homeCountry)pre._homeCountry=EMPLOYEE_HOME[pre.travelerName]||COMPANY_HOME;
  // Assignee profile fields (city, country of residence, nationality, sending entity, job title) come straight
  // from the WorkFlex profile — pre-filled here so the AI never has to ask them.
  const _nm=pre.travelerName;const _homeEnt=COMPANY_ENTITIES[pre._homeCountry];
  pre.residenceCountry=pre._homeCountry;
  pre.residenceCity=EMPLOYEE_CITY[_nm]||(_homeEnt&&_homeEnt.city)||pre._homeCountry;
  pre.nationality=EMPLOYEE_NATIONALITY[_nm]||NATIONALITY_BY_COUNTRY[pre._homeCountry]||'';
  pre.homeEntity=(_homeEnt&&_homeEnt.entity)||'Acme GmbH';
  if(!pre.jobTitle)pre.jobTitle=EMPLOYEE_ROLES[_nm]||pre._homeRole||'';
  // Prior host-country stays / personal ties explicitly ruled out → pre-fill (stated, not assumed).
  if(/no (prior )?stays?\b|no stays? in .{0,30}last 12|hasn'?t (been|stayed) .{0,30}last 12|no (previous |recent )?visits/.test(t))pre._stays='No stays in the last 12 months';
  if(/no personal ties|no ties to|without personal ties/.test(t))pre.personalTies='No';
  // Contractual setup / tax handling stated in the description → pre-fill.
  // Contractual setup — different types per side ("... at home and ... at host") or the same for both.
  var _chm=t.match(/(active contract|assignment letter|local contract|no contract)\s+at\s+home/);
  var _cht=t.match(/(active contract|assignment letter|local contract|no contract)\s+at\s+host/);
  if(_chm||_cht){const cap=s=>s?s.replace(/\b\w/g,c=>c.toUpperCase()):'';pre.contractHome=cap(_chm&&_chm[1]);pre.contractHost=cap(_cht&&_cht[1]);pre._contractual=`home: ${pre.contractHome||'—'} · host: ${pre.contractHost||'—'}`;}
  else if(/active contract.{0,20}(both|home (and|&) host)|home (and|&) host.{0,20}active contract/.test(t)){pre._contractual='Active contract — home & host';pre.contractHome='Active contract';pre.contractHost='Active contract';}
  if(/compan(y|ies)\s+(covers?|bears?|pays?).{0,25}tax|tax.{0,25}(borne|covered|paid)\s+by\s+(the\s+)?compan/.test(t))pre.taxCoverage='Company';
  // Contract negotiation / signing stated → pre-fill.
  if(/(won'?t|will not|does\s?n'?t|doesn'?t|no)\s+(negotiat\w*\s+(or|and)\s+)?sign\w*[^.]{0,15}contract|no contract signing|not sign\w*[^.]{0,15}contract/.test(t))pre.contracts='No';
  else if(/sign\w*[^.]{0,25}(host|host entity)[^.]{0,10}contract|contract[^.]{0,15}host entity/.test(t))pre.contracts='Yes, for the host entity';
  else if(/sign\w*[^.]{0,25}home[^.]{0,10}contract/.test(t))pre.contracts='Yes, for the home entity';
  // Turnover ≥ 25% in the home country stated → pre-fill.
  if(/(over|more than|at least|above|exceeds?|generates?\s+(more than\s+)?)\s*25\s*%|25\s*%\s*(or more|\+)|(≥|>=)\s*25/.test(t))pre.turnover='Yes';
  else if(/(under|less than|below)\s*25\s*%/.test(t))pre.turnover='No';
  // MD / C-level seniority stated → pre-fill.
  if(/not\s+(a\s+)?(managing director|md\b|c-?level|c level|chief|ceo|cfo|cto)/.test(t))pre.seniorRole='No';
  else if(/\b(is|as|holds?|will be)\s+(a\s+|the\s+)?(managing director|md\b|c-?level|chief|ceo|cfo|cto)/.test(t))pre.seniorRole='Yes';
  // (10) Work address — use the matched entity address; else parse "at <address>" from the text.
  if(!pre.workAddress){var _wa=raw.match(/working\s+(?:from|at)\b[^.]*?\bat\s+([A-Za-zÄÖÜäöüß][^.,;]{4,60})/i)||raw.match(/\bat\s+([A-ZÄÖÜ][A-Za-zÄÖÜäöüß.\- ]*\d[^.,;]{0,40})/);if(_wa){pre.workAddress=_wa[1].trim();pre.workLocation='Yes';}}
  var _tc=t.match(/tax class[:\s]*([0-9ivx]+)/i);if(_tc)pre.taxClass='Class '+_tc[1].toUpperCase();
  // Marital / family
  // Marital situation is captured by the combined _marital question — note a hint from the text.
  // (3) Marital status stated → set it. Whether the spouse accompanies is assumed (yes for a posting)
  //     and flagged for confirmation rather than asked as a separate question.
  if(/married|spouse|wife|husband/.test(t))pre._marital='Married — spouse accompanying';
  else if(/\bsingle\b|unmarried/.test(t))pre._marital='Single';
  const NUMW2={one:1,two:2,three:3,four:4,a:1,'a couple of':2,couple:2,'a few':3,few:3};
  let ct=t.replace(/\b(one|two|three|four)\b/g,m=>NUMW2[m]);
  const kids=ct.match(/\b(\d+)\s+(?:[\w-]+\s+){0,3}(kid|child|children|son|daughter)/);
  if(kids){pre.childrenBio=kids[1];
    // Children explicitly named in the description → mark them parsed (skip the follow-up detail question).
    if(/accompan|coming along|relocat|both\b|com(?:e|ing)/.test(t))pre.childrenAccompany=kids[1];
    pre._children=`${kids[1]} child${kids[1]==='1'?'':'ren'}${/school.?age/.test(t)?' · school-age':''}${pre.childrenAccompany?' · accompanying':''}`;
  }
  else if(/couple of (kids|children)/.test(t))pre.childrenBio='2';
  else if(/a few (kids|children)/.test(t))pre.childrenBio='3';
  else if(/no (kids|children)|without children|no family/.test(t))pre.childrenBio='None';
  // If the text also gives ages/nationalities, fully parse the children (skip the follow-up question).
  if(pre.childrenBio&&pre.childrenBio!=='None'){const cm=raw.match(/\d+\s*(?:(?:biological|adopted|dependent|young|small|minor)\s+){0,2}(?:kids?|children).*?(?=\.|;| and (?:keep|she|he|they)| who |$)/i);const p=parseChildren(cm?cm[0]:raw);if(p.ages||p.citizenship)pre._children=p.display;}
  // ── Only auto-fill what the description (or our records) actually supports. Everything else
  //    is ASKED, so the chat covers the same questions as the full intake form. ──
  const inferred=[];
  const assume=(k,v)=>{if(pre[k]==null){pre[k]=v;inferred.push(k);}};
  // Client work + main beneficiary follow directly from the assignment type stated in the text.
  if(/intra.?group|secondment/.test(t)){assume('clientWork','No');assume('beneficiary','Home entity');}
  else if(/client|third.?party/.test(t)){assume('clientWork','Yes — for host');assume('beneficiary','A client');}
  // Sub-purpose — only when the wording actually names it (otherwise we ask).
  if(/^Intra-group/.test(pre.purpose||'')){
    const subMap=[[/market expansion/,'Market Expansion'],[/market entry/,'Market Entry'],[/business development/,'Business Development'],[/governance|oversight/,'Group Governance / Strategic Oversight'],[/role coverage|critical role|cover.*role/,'Temporary (Critical) Role Coverage'],[/knowledge transfer/,'Knowledge Transfer'],[/training|upskill|\bskill/,'Training / Skill Acquisition'],[/project (management|delivery)/,'Project Management / Project Delivery'],[/client relationship/,'Client Relationship Management'],[/leadership|management development/,'Leadership / Management Development']];
    const hit=subMap.find(([re])=>re.test(t));
    if(hit)assume('intraGroupPurpose',hit[1]);
  }
  // (4) We KNOW the entity's registered branch → match the place of work from it (Google-verified).
  //     Never ask for the address when we already have it.
  if(pre._entityAddr){assume('workLocation','Yes');assume('workAddress',pre._entityAddr);}
  // (5) Clever defaults for the low-signal compliance questions — assumed (flagged "confirm"), not asked.
  if(pre._entity){
    assume('presence','We have a registered legal entity — '+pre._entity);  // we know the branch
    assume('purpose','Intra-group transfer');   // entity found + EE heading there ⇒ assume intra-company transfer (spec)
  }
  assume('turnover','Yes');                 // most home companies clear the 25% turnover test
  assume('sameRole','No');
  if(pre._entity)assume('sponsorVisas','Yes');   // a registered entity can usually sponsor permits
  if(/^Intra-group/.test(pre.purpose||''))assume('activeTasks','Yes');
  // Signature authorization is only realistically relevant for senior / sales-level roles (spec) — for
  // anyone who isn't senior we assume "No" and don't ask; the question only surfaces when seniorRole = Yes.
  // Signature authorization is relevant for SALES or higher-management roles (PDF) — so we only assume
  // "No" (and skip the question) when the assignee is neither senior nor in a sales/commercial role.
  const salesRole=/sales|account manager|business development|commercial|revenue/i.test(pre._homeRole||'');
  if(pre.seniorRole!=='Yes'&&!salesRole)assume('contracts','No');
  // Derive married/spouse from the combined _marital we parsed, and flag the assumed / profile-sourced
  // fields so they show a "confirm" tag in the review.
  if(pre._marital){if(/married/i.test(pre._marital)){pre.married='Yes';pre.spouseAccompany=/accompanying/i.test(pre._marital)?'Yes':'No';}else{pre.married='No';pre.lifePartner='No';}inferred.push('_marital');}
  if(pre.permanentHome)inferred.push('permanentHome');
  if(pre.seniorRole&&pre._homeRole)inferred.push('seniorRole');
  if(pre._visa)inferred.push('_visa');
  pre._inferred=inferred;
  return pre;
}
// Re-seed answers from a fresh parse WITHOUT discarding a policy the user already attached
// (and the benefit draft it extracted) — those persist through "Read & fill".
function seedFromPrefill(){
  const keep={};
  if(state.answers){Object.keys(state.answers).forEach(k=>{if(k==='_policyFile'||/^_(bendraft|benfill|benfile)_/.test(k))keep[k]=state.answers[k];});}
  return {...state.prefilled,...keep};
}
// Human labels for the fields the AI can pull straight from a description (for the fill-review).
const FILL_LABELS={_assigneeName:'Assignee',host:'Destination',start:'Start date',end:'Duration',purpose:'Purpose',payroll:'Payroll',homeSalary:'Home salary',currency:'Currency',workLocation:'Fixed workplace',seniorRole:'Senior role',clientWork:'Client work',contracts:'Signs contracts',married:'Married',childrenBio:'Children',visas:'Existing visa'};
// How many real questions remain unanswered given a prefilled map.
function remainingCount(p){return ASSIGN_QUESTIONS.filter(q=>!(q.key in p)&&!(q.onlyEmployee&&state.whoFor==='me')&&(!q.when||q.when(p))).length;}
// (3) Is a question's required service selected? compliance → task/compliance questions.
// Coverage = "parse first, ask the rest": every question is covered regardless of the selected
// deliverables — the AI pre-fills what it can (shown as "confirm" in the rail) and asks the rest.
function svcSelected(svc){return true;}
// After the AI parses a description, ask only this specific set (in this order); benefits stays in full.
// Previous trips (_stays) is gated by its own `when` — only shown for short assignments (else "already have it").
function _aiFollowup(){return !!(state.aiFill&&state.rawText);}
// Only these are ASKED after setup. City / country of residence / nationality / sending entity / job title all
// come from the assignee's profile (pre-filled in prefill). Previous trips (_stays) IS asked, right before benefits.
const FOLLOWUP_KEYS=['presence','_stays','allowances'];
const FOLLOWUP_ASK=['presence'];
// The AI parses some of these (e.g. presence) — clear them so they're actively asked, not silently pre-filled.
function scopeFollowup(){if(_aiFollowup()){FOLLOWUP_ASK.forEach(k=>{if(state.prefilled)delete state.prefilled[k];if(state.answers)delete state.answers[k];});}}
function askList(){const p=state.prefilled||{};
  const applies=q=>!(q.onlyEmployee&&state.whoFor==='me')&&(!q.svc||svcSelected(q.svc))&&(!q.when||q.when(state.answers));
  if(_aiFollowup())return FOLLOWUP_KEYS.map(k=>ASSIGN_QUESTIONS.find(q=>q.key===k)).filter(q=>q&&!(q.key in p)&&applies(q));
  return ASSIGN_QUESTIONS.filter(q=>!(q.key in p)&&applies(q));}

    <div class="hero-icon">${SPARKLE}</div>
    <h1>Who's this assignment for?</h1>
    <p class="sub">I'll tailor the setup to whoever's being assigned — yourself or someone on your team.</p>
    <div class="who-cards">
      <button class="who-card" data-who="me"><span class="ic"><span class="material-icons">person</span></span><div><div class="t">For me</div><div class="d">I'm the one being assigned. AI will use my profile and history.</div></div></button>
      <button class="who-card" data-who="employee"><span class="ic"><span class="material-icons">groups</span></span><div><div class="t">For an employee</div><div class="d">I'm setting this up on behalf of someone on my team.</div></div></button>

function renderDescribe(){
  const ai=!!state.aiFill;
  // Start empty — the placeholder + "Use as a starting point" + the past-assignment chips populate it.
  const prepared=state.rawText || '';
  viewEl.innerHTML=`<div class="hero" style="max-width:820px">
    <div class="hero-icon">${AVA_HERO}</div>
    <h1>Describe your assignment</h1>
    <p class="sub">${ai
      ? 'Tell me as much as you can — <strong>who, where, when, how long, the setup, pay, family</strong> — or just <strong>start from the example</strong> below and change the details. The more you give me, the more I fill in, and the fewer questions are left.'
      : 'Planning something? Just tell me <strong>where, when, and roughly how long</strong> — I\'ll work out the trip type and guide you from there.'}</p>
    <div class="compose-card describe"><div id="descText" class="desc-input" contenteditable="true" role="textbox" aria-multiline="true" data-ph="${ai?'e.g. Six-month intra-group secondment for Sara to our Munich office from 1 June, kept on home payroll, base salary €90,000, married with 2 children':'e.g. Munich, starting 1 June, about six months'}">${prepared.replace(/</g,'&lt;')}</div>
      <div class="describe-actions" style="justify-content:space-between;gap:10px">
        <div class="desc-left">
          ${ai?`<button class="btn tertiary desc-example" id="descExample"><span class="material-icons" style="font-size:16px">auto_awesome</span> Start from an example</button>`:''}
          <div id="descEditHint"></div>
        </div>
        <button class="btn primary" id="descBtn"><span class="material-icons" style="font-size:15px">auto_awesome</span> ${ai?'Read &amp; fill':'Start'}</button></div></div>
    <div class="compose-foot"><span class="hint">WorkFlex AI can make mistakes — you confirm everything</span></div>
    <div class="examples"><span class="lbl hist"><span class="material-icons">history</span> Reuse a recent assignment — same structure, just change the details</span>${HISTORY.slice(0,3).map(h=>`<button class="ex-chip hist" data-text="${h.text.replace(/"/g,'&quot;')}"><span class="ex-ava">${h.ini}</span><span class="ex-body"><span class="ex-who">${h.who}</span><span class="ex-meta">${h.route} · ${h.meta}</span></span><span class="material-icons ex-go">north_east</span></button>`).join('')}</div>
  </div>`;
  const ta=document.getElementById('descText');
  const editHint=document.getElementById('descEditHint');
  const caretToEnd=()=>{ta.focus();const r=document.createRange();r.selectNodeContents(ta);r.collapse(false);const s=window.getSelection();s.removeAllRanges();s.addRange(r);};
  caretToEnd();
  const go=()=>{const v=(ta.innerText||'').trim();if(!v)return;state.rawText=v;state.detected=analyzeAssignment(v);state.view='parsing';render();runParse();};
  // (4) Dim the "Read & fill" button while the box is empty.
  const descBtn=document.getElementById('descBtn');
  const syncBtn=()=>{const empty=!(ta.innerText||'').trim();descBtn.disabled=empty;};
  ta.addEventListener('input',syncBtn);syncBtn();
  ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go();}});
  descBtn.addEventListener('click',go);
  viewEl.querySelectorAll('.ex-chip').forEach(c=>c.addEventListener('click',()=>{ta.textContent=c.dataset.text;go();}));
  // (3/5) Drops a rich, ready-to-edit example in the box — the more it says, the more we pre-fill, so
  //       fewer questions are left. Values you'd change are highlighted. Wired to both the prominent
  //       "Start from an example" button and the "Use as a starting point" one in the annotated example.
  const fillExample=()=>{
    const t=s=>`<mark class="tok">${s}</mark>`;
    // A concise, natural example — the highlighted values are the parts users typically change.
    ta.innerHTML=`We're sending ${t('Anna Schmidt')} to our office in ${t('Spain')} for ${t('2 years')} starting ${t('September 1, 2026')}, with a base salary of ${t('€95,000')}. She'll be accompanied by her ${t('husband')} and ${t('two school-age children')}.`;
    if(editHint)editHint.innerHTML=`<div class="desc-edit-hint"><span class="material-icons">edit</span><span class="deh-txt">The <span class="tok-swatch"></span> highlighted parts are what you'll usually change — tap any to edit.</span></div>`;
    const exBtn=document.getElementById('descExample');if(exBtn)exBtn.style.display='none';
    caretToEnd();syncBtn();
  };
  const exBtn=document.getElementById('descExample');if(exBtn)exBtn.addEventListener('click',fillExample);
  // Land with the example already in the box — no need to click "Start from an example".
  if(ai&&!(ta.innerText||'').trim())fillExample();
}

function renderQuestions(){
  const list=askList();
  const idx=state.qIdx;
  const total=list.length;
  const done=idx>=total;
  // In review/edit mode we stay in the chat (all answered) so the user can revise, then re-submit.
  // (7) When the chat is done, land on the completed review chat (not the form summary) — the
  // user reviews/continues here; "Looks right — review & submit" then opens the summary.
  if(done&&!state.qTyping&&!state.chatReview){state.chatReview=true;state.chatExtra=state.chatExtra||[];render();window.scrollTo(0,document.body.scrollHeight);return;}
  const self=state.whoFor==='me';
  const dest=state.answers._destCountry||'the host country';
  const titleOf=x=>String(typeof x.title==='function'?x.title(state.answers):x.title).replace(/the host country/gi,dest);
  const ctxText=self?'you':(state.answers.travelerName||'an employee');
  const pct=Math.round((done?total:idx+1)/total*100);
  const answered=Math.min(idx,total);

  // ── Conversation history: each answered question as an AI+me bubble pair ──
  let thread='';
  const preCount=Object.keys(state.prefilled||{}).filter(k=>ASSIGN_QUESTIONS.some(qq=>qq.key===k)).length;
  if((state.aiFill||state.resumed)&&preCount){
    const noteTxt=state.resumed
      ?`Welcome back! I've kept the <strong>${preCount}</strong> answers you'd already given — just <strong>${total}</strong> left. Let's finish up.`
      :`Got it — I pulled <strong>${preCount}</strong> answers straight from your description, so there are only <strong>${total}</strong> left. Let's fill those in.`;
    thread+=`<div class="chat-msg ai"><span class="chat-ava">${AVA}</span><div class="chat-bubble ai">${noteTxt}</div></div>`;
    // (5) Matched the assignee from the description → confirm it (don't re-ask); offer to change.
    if(state.answers.travelerName&&matchEmployee(state.answers.travelerName).matched){const nm=matchEmployee(state.answers.travelerName).name;const role=state.answers._homeRole;
      thread+=`<div class="chat-msg ai"><span class="chat-ava">${AVA}</span><div class="chat-bubble ai"><span class="match-ok"><span class="material-icons">how_to_reg</span> I matched the assignee to <strong>${nm}</strong>${role?` · ${role}`:''}.</span> <a class="chat-change" data-changekey="travelerName">Not them? Change</a></div></div>`;}
  }
  if(state.chatReview){thread+=`<div class="chat-msg ai"><span class="chat-ava">${AVA}</span><div class="chat-bubble ai">${state.submitted?`All set — your documents are generating on the right. Want to change something? Just tap<span class="material-icons" style="font-size:15px;vertical-align:-3px">edit</span> on any answer or keep chatting, and I'll regenerate them.`:`That's everything — every question's answered. Does it all look <strong>final</strong>? Confirm below and I'll generate your documents. You can still tap <span class="material-icons" style="font-size:15px;vertical-align:-3px">edit</span> on any answer or keep chatting to change anything.`}</div></div>`;}
  for(let j=0;j<answered;j++){
    const qq=list[j];const a=state.answers[qq.key];
    thread+=`<div class="chat-msg ai hist"><span class="chat-ava sm">${SPARKLE_S}</span><div class="chat-bubble ai hist">${titleOf(qq)}</div></div>`;
    thread+=`<div class="chat-msg me hist"><div class="chat-bubble me hist">${(a==null||a==='')?'—':String(a).replace(/</g,'&lt;')}${state.chatReview?`<button class="hist-edit" data-edit="${j}" title="Edit"><span class="material-icons">edit</span></button>`:''}</div><span class="chat-ava u sm">YE</span></div>`;
    // Confirm whether the assignee name matched an existing teammate or will be a new invite.
    if(qq.key==='travelerName'&&a){const m=matchEmployee(a);const role=EMPLOYEE_ROLES[m.name];thread+=`<div class="chat-msg ai hist"><span class="chat-ava sm">${SPARKLE_S}</span><div class="chat-bubble ai hist">${m.matched?`<span class="match-ok"><span class="material-icons">check_circle</span> Matched <strong>${m.name}</strong>${role?` · ${role}`:''} from your team.</span>`:state.answers._invited?`<span class="match-new"><span class="material-icons">person_add</span> <strong>${a}</strong> invited to WorkFlex${state.answers._invitedEmail?` (${state.answers._invitedEmail})`:''}.</span>`:`<span class="match-new"><span class="material-icons">person_search</span> <strong>${a}</strong> isn't on your team yet.</span>`}</div></div>`;}
    // Visa parsing — show every visa/permit the AI pulled out of the free-text answer.
    if(qq.key==='_visa'&&a){const vl=parseVisaList(a,state.answers._destCountry);thread+=`<div class="chat-msg ai hist"><span class="chat-ava sm">${SPARKLE_S}</span><div class="chat-bubble ai hist">${vl.has?`<span class="match-ok"><span class="material-icons">badge</span> Parsed ${vl.list.length} permit${vl.list.length>1?'s':''}: ${vl.list.map(x=>`<strong>${x.type}</strong>${x.expiry?` · valid to ${x.expiry.trim()}`:''}`).join(' &nbsp;·&nbsp; ')}.</span>`:`<span class="match-new"><span class="material-icons">info</span> No visa on file for ${state.answers._destCountry||'the host country'} — we'll handle the permit.</span>`}</div></div>`;}
    // Children parsing — biological / adopted split + how many are accompanying.
    if(qq.key==='_children'&&a){const p=parseChildren(a);thread+=`<div class="chat-msg ai hist"><span class="chat-ava sm">${SPARKLE_S}</span><div class="chat-bubble ai hist">${p.total?`<span class="match-ok"><span class="material-icons">family_restroom</span> Parsed: <strong>${p.total} child${p.total!==1?'ren':''}</strong>${p.bio&&p.adopted?` · ${p.bio} biological, ${p.adopted} adopted`:p.adopted?` · adopted`:''}${p.ages?` · ages ${p.ages}`:''}${p.accompany!=null?` · <strong>${p.accompany}</strong> accompanying`:''}.</span>`:`<span class="match-new"><span class="material-icons">info</span> No children under 25.</span>`}</div></div>`;}
    // Stays parsing — each prior host-country stay, with location + type.
    if(qq.key==='_stays'&&a){const st=parseStays(a);thread+=`<div class="chat-msg ai hist"><span class="chat-ava sm">${SPARKLE_S}</span><div class="chat-bubble ai hist">${st.list.length?`<span class="match-ok"><span class="material-icons">flight_takeoff</span> Logged <strong>${st.list.length}</strong> stay${st.list.length>1?'s':''}: ${st.list.map(s=>`${s.loc||'Stay'}${s.dates?` (${s.dates})`:''} · ${s.type}`).join(' &nbsp;·&nbsp; ')}. <em>Add more anytime below.</em></span>`:`<span class="match-new"><span class="material-icons">info</span> No prior stays logged.</span>`}</div></div>`;}
    // (3) Answer flagged "not sure" → reassure it's parked for confirmation, not guessed.
    if(a==='Not sure — to confirm'){thread+=`<div class="chat-msg ai hist"><span class="chat-ava sm">${SPARKLE_S}</span><div class="chat-bubble ai hist"><span class="match-new"><span class="material-icons">bookmark_added</span> No problem — I've left this open and flagged it to confirm later.</span></div></div>`;}
  }
  // Follow-up conversation typed in review mode (free-form "add or change anything").
  if(state.chatReview&&(state.chatExtra||[]).length){state.chatExtra.forEach(mm=>{thread+=mm.role==='me'
    ?`<div class="chat-msg me hist"><div class="chat-bubble me hist">${String(mm.text).replace(/</g,'&lt;')}</div><span class="chat-ava u sm">YE</span></div>`
    :`<div class="chat-msg ai hist"><span class="chat-ava sm">${SPARKLE_S}</span><div class="chat-bubble ai hist">${mm.text}</div></div>`;});}
  const q=done?null:list[idx];
  // Tall answer types (benefits/toggles list, per-child) need the full page height — the fixed-height
  // pinned-composer layout clips them. Fall back to normal page scroll for those questions.
  // 'benefits' (allowances) no longer needs the full-page layout now that it's just chips + chat + the
  // chosen rows — the chat layout keeps it compact and avoids the empty gap beside the tall right panel.
  const tallAnswer=q&&['toggles','perchild'].includes(q.type)&&!q.chatOnly&&!q.compact;
  document.body.classList.toggle('chat-mode', !tallAnswer);
  if(state.qTyping){
    thread+=`<div class="chat-msg ai"><span class="chat-ava">${AVA}</span><div class="chat-bubble ai typing"><span></span><span></span><span></span></div></div>`;
  }else if(q){
    const qHint=q.hint?(typeof q.hint==='function'?q.hint(state.answers):q.hint):'';
    thread+=`<div class="chat-msg ai current"><span class="chat-ava">${AVA}</span><div class="chat-bubble ai current">${titleOf(q)}${qHint?`<div class="chat-hint">${String(qHint).replace(/the host country/gi,dest)}</div>`:''}</div></div>`;
  }

  // ── Answer dock (only when a live question is showing) ──
  let ans='';
  if(q&&!state.qTyping){
    const opts=typeof q.options==='function'?q.options(state.answers):(q.options||[]);
    // For option-based questions, let the user explain in their own words if nothing fits.
    const explainBox=`<div class="aq-explain"><div class="aq-explain-or">None of these fit? Tell me what you have</div><div class="compose-card big"><textarea id="qExplain" rows="1" placeholder="Describe your situation…"></textarea><button class="send-circ" id="qExplainSend" aria-label="Send"><span class="material-icons">arrow_upward</span></button></div></div>`;
    // Back link for the chat-style steps (text / choice / yes-no) — placed at the bottom (below the
    // suggestions / free-text input), matching the list & benefits steps. Auto-hidden on step 1.
    const backLink=`<div class="qc-backrow"><button type="button" class="qc-back" id="qBack"><span class="material-icons">arrow_back</span> Back</button></div>`;
    if(q.type==='text'){
      const ph=(typeof q.placeholder==='function'?q.placeholder(state.answers):q.placeholder)||'Type your answer…';
      const sg=(()=>{const s=typeof q.suggest==='function'?q.suggest(state.answers):q.suggest;return s&&s.length?`<div class="aq-suggest">${s.map(x=>{const val=typeof x==='object'?x.value:x;const lbl=typeof x==='object'?x.label:x;return `<button class="aq-sugg" data-s="${String(val).replace(/"/g,'&quot;')}">${lbl}</button>`;}).join('')}</div>`:'';})();
      // (7) Dummy starter text in the box the user can send as-is or type over — "I don't know" on
      //     free-text steps (not where an answer is essential, and never on children).
      const dummy=['host','travelerName','inviteEmail','_children'].includes(q.key)?'':"I don't know";
      const preVal=state.answers[q.key]!=null?String(state.answers[q.key]):dummy;
      ans=`${sg}
        <div class="compose-card big"><textarea id="qInput" rows="1" placeholder="${String(ph).replace(/"/g,'&quot;')}">${preVal.replace(/</g,'&lt;')}</textarea>
        <button class="send-circ" id="qSend" aria-label="Send"><span class="material-icons">arrow_upward</span></button></div>
        ${q.withCurrency?`<div class="q-cur">${q.withCurrency.map((o,i)=>`<button type="button" class="q-cur-chip${i===0?' on':''}" data-cur="${o}">${o}</button>`).join('')}</div>`:''}
        ${q.autocomplete?`<div class="ac-list" id="acList"></div>`:''}${backLink}`;
    }else if(q.type==='yesno'){
      ans=`<div class="cc-chips"><button class="chip" data-val="Yes">Yes</button><button class="chip" data-val="No">No</button>${q.key==='inviteConfirm'?'':'<button class="chip subtle" data-val="Not sure">Not sure</button>'}</div>${explainBox}${backLink}`;
    }else if(q.type==='toggles'){
      const manyOpts=opts.length>8;
      const togChat=q.chatPlaceholder?`<div class="qc-chat"><div class="compose-card big"><textarea id="qTogChat" rows="1" placeholder="${String(q.chatPlaceholder).replace(/"/g,'&quot;')}"></textarea><button class="send-circ" id="qTogChatSend" aria-label="Send"><span class="material-icons">arrow_upward</span></button></div></div>`:'';
      ans=q.chatOnly
        ? `${togChat}<div class="q-foot"><button class="btn tertiary" id="qBack"><span class="material-icons" style="font-size:16px">arrow_back</span> Back</button></div>`

        ${manyOpts?`<input type="text" id="qTogSearch" class="tog-search" placeholder="Search ${opts.length} options…">`:''}
        <div class="tog-picked"><span class="material-icons" style="font-size:16px">check_circle</span><span id="qTogPicked"><b>0</b> selected</span> — pick any that apply, it's optional.</div>
        <div class="aq-tags" id="qTogList">${opts.map(o=>`<button type="button" class="aq-tag" data-t="${o.replace(/"/g,'&quot;')}" data-lbl="${o.toLowerCase().replace(/"/g,'&quot;')}"><span class="material-icons aq-tag-ck">add</span>${o}</button>`).join('')}</div>
        <div class="q-foot"><button class="btn tertiary" id="qBack"><span class="material-icons" style="font-size:16px">arrow_back</span> Back</button><button class="btn primary" id="qTogNext">Send →</button></div>`;
    }else if(q.type==='benefits'){
      // Toggle rows — grouped into collapsible sections when the question defines groups (keeps all
      // options visible but organised); otherwise a single flat list (e.g. family support).
      // notoggle (e.g. family support): no on/off switch — each item's fields are always shown; fill to include.
      const row=o=>`<div class="ben-item${q.notoggle?' on':''}" data-b="${o.replace(/"/g,'&quot;')}" data-lbl="${o.toLowerCase().replace(/"/g,'&quot;')}">
          <div class="ben-item-top"><span class="ben-item-label">${o}</span>${q.notoggle?'':`<label class="ben-switch"><input type="checkbox" class="ben-tog"><span class="ben-slider"></span></label>`}</div>
          <div class="ben-item-fields"${q.notoggle?'':' hidden'}></div></div>`;
      // After a policy/chat fill, open only the sections that actually matched — "see the most likely" first.
      const _bd=state.answers['_bendraft_'+q.key]||{};const _filled=!!state.answers['_benfill_'+q.key];
      // Allowances: no full browse list — only the ones actually chosen (via the most-likely chips or
      // parsed from chat) render, so their amounts can be set. Anything else is just typed in the chat.
      const _selOn=(q.groups&&q.likely)?opts.filter(o=>_bd[o]&&_bd[o]._on):[];
      const inner=(q.groups&&q.likely)
        ? (_selOn.length?`<div class="ben-list ben-selected">${_selOn.map(row).join('')}</div>`:'')
        : `<div class="ben-list ben-selected">${opts.map(row).join('')}</div>`;
      const benFill=state.answers['_benfill_'+q.key];
      const benNote=benFill?`<div class="rl-note ok"><span class="material-icons">auto_awesome</span><span>${benFill}</span></div>`:'';
      const benChat=q.chatPlaceholder?`<div class="qc-chat">${q.chatOnly?'<div class="qc-sugg"><button type="button" class="aq-sugg" id="qBenNone"><span class="material-icons">block</span> None</button></div>':''}${benNote}<div class="compose-card big"><textarea id="qBenChat" rows="1" placeholder="${String(q.chatPlaceholder).replace(/"/g,'&quot;')}"></textarea>${q.chatFill?'':'<button class="send-circ" id="qBenChatSend" aria-label="Send"><span class="material-icons">arrow_upward</span></button>'}</div></div>`:'';

        ? `${benChat}<div class="q-foot"><button class="btn tertiary" id="qBack"><span class="material-icons" style="font-size:16px">arrow_back</span> Back</button></div>`
        : `${q.likely?(()=>{const lk=typeof q.likely==='function'?q.likely(state.answers):q.likely;const bd=state.answers['_bendraft_'+q.key]||{};return `<div class="ben-likely"><div class="ben-likely-h"><span class="material-icons">bolt</span> Most likely for this assignment <span class="ben-likely-sub">— tap to add</span></div><div class="ben-likely-chips">${lk.map(b=>{const on=bd[b]&&bd[b]._on;return `<button type="button" class="likely-chip${on?' on':''}" data-likely="${b.replace(/"/g,'&quot;')}"><span class="material-icons">${on?'check':'add'}</span> ${b}</button>`;}).join('')}</div></div>`;})():''}
        ${q.likely?`<div id="qBenList">${inner}</div>`:''}
        ${benChat?`<div class="qc-or"><span>${q.chatFill?'or type your own':'or fill in the details'}</span></div>`+benChat:''}
        ${q.likely?'':`<div class="tog-picked"><span class="material-icons" style="font-size:16px">${q.notoggle?'info':'check_circle'}</span>${q.notoggle?'<span>Fill in what applies — leave an item blank to skip it.</span>':`<span id="qBenCount"><b>0</b> selected</span> — ${q.groups?'open a section and flip on what applies.':'flip on what applies, then set the amounts.'}`}</div>`}
        ${q.likely?'':`<div id="qBenList">${inner}</div>`}
        <div class="q-foot"><button class="btn tertiary" id="qBack"><span class="material-icons" style="font-size:16px">arrow_back</span> Back</button><button class="btn primary" id="qBenNext">Send →</button></div>`;
    }else if(q.type==='salary'){
      // Amount · currency · gross/net · period — matches the form's "Home base salary".
      const CURS=q.withCurrency||['EUR','USD','GBP','CHF'];
      const cur0=state.answers.currency||CURS[0];
      ans=`<div class="ben-row" style="box-shadow:none;border-color:var(--colorPrimaryBorder)"><div class="ben-fields">
          <input class="ben-amt" id="qSalAmt" placeholder="e.g. 90,000" inputmode="decimal" style="width:150px" value="${(state.answers.homeSalary||'').replace(/"/g,'&quot;')}">
          <select class="ben-cur" id="qSalCur">${CURS.map(c=>`<option${c===cur0?' selected':''}>${c}</option>`).join('')}</select>
          <div class="ben-seg" id="qSalGn">${['Gross','Net'].map((v,k)=>`<button type="button" data-v="${v}" class="${k===0?'on':''}">${v}</button>`).join('')}</div>
          <div class="ben-seg" id="qSalPer">${['Monthly','Yearly'].map((v,k)=>`<button type="button" data-v="${v}" class="${k===1?'on':''}">${v}</button>`).join('')}</div>
        </div></div>
        <div class="q-foot"><button class="btn tertiary" id="qBack"><span class="material-icons" style="font-size:16px">arrow_back</span> Back</button><button class="btn primary" id="qSalNext">Send →</button></div>`;
    }else if(q.type==='perchild'){
      const n=childN(state.answers.childrenBio)+childN(state.answers.childrenAdopted);
      const same=!!state.answers._sameCitizen;
      const rows=same
        ?`<div class="pc-row"><span class="pc-lbl">All ${n}</span><input class="pc-inp" data-i="all" placeholder="${q.placeholder||'e.g. German'}"></div>`
        :Array.from({length:n},(_,i)=>`<div class="pc-row"><span class="pc-lbl">Child ${i+1}</span><input class="pc-inp" data-i="${i}" placeholder="${q.placeholder||'e.g. German'}"></div>`).join('');
      ans=`<label class="pc-same"><input type="checkbox" id="pcSame" ${same?'checked':''}><span>All children hold the same citizenship</span></label>
        <div class="pc-list">${rows}</div>
        <div class="q-foot"><button class="btn tertiary" id="qBack"><span class="material-icons" style="font-size:16px">arrow_back</span> Back</button><button class="btn primary" id="qPcNext">Send →</button></div>`;
    }else if(q.type==='repeatlist'){
      // Structured, repeatable rows (visas / prior stays) — with optional upload-and-extract.
      const dkey='_rl_'+q.key;
      let rlRows=state.answers[dkey];
      if(!rlRows){
        if(q.key==='_visa'&&Array.isArray(state.answers._visaList)&&state.answers._visaList.length)
          rlRows=state.answers._visaList.map(x=>({country:state.answers._destCountry||'',type:x.type||'',validity:(x.expiry||'').trim(),holder:'Assignee'}));
        else if(q.key==='_stays'&&Array.isArray(state.answers._staysList)&&state.answers._staysList.length)
          rlRows=state.answers._staysList.map(s=>({location:s.loc||'',staytype:s.type||'Work-related',start:'',end:''}));
        if(!rlRows||!rlRows.length)rlRows=[{}];
        state.answers[dkey]=rlRows;
      }
      const flds=typeof q.fields==='function'?q.fields(state.answers):q.fields;
      const note=q.docNote?q.docNote(state.answers):(q.historyNote?q.historyNote(state.answers):null);
      // Uploaded-file chip (attach-and-extract, like Claude's file attach).
      const upf=state.answers['_rlfile_'+q.key];
      const uploadChip=upf?`<div class="rl-attach ${upf.status}"><span class="material-icons rl-attach-ic">${upf.status==='extracting'?'autorenew':'description'}</span><span class="rl-attach-name">${upf.name}</span><span class="rl-attach-status">${upf.status==='extracting'?'Extracting…':'Extracted'}</span>${upf.status==='done'?'<button type="button" class="rl-attach-x" id="qRlFileX" aria-label="Remove"><span class="material-icons">close</span></button>':''}</div>`:'';
      const fieldHtml=(f,ri)=>{const val=(rlRows[ri]&&rlRows[ri][f.k]!=null)?String(rlRows[ri][f.k]):'';
        const ctrl=f.type==='select'
          ?`<select data-ri="${ri}" data-k="${f.k}"><option value="">Choose…</option>${(f.options||[]).map(o=>`<option${o===val?' selected':''}>${o}</option>`).join('')}</select>`
          :`<input type="${f.type==='date'?'date':'text'}" data-ri="${ri}" data-k="${f.k}" placeholder="${(f.placeholder||'').replace(/"/g,'&quot;')}" value="${val.replace(/"/g,'&quot;')}">`;
        return `<div class="rl-field${f.full?' full':''}"><label>${f.label}</label>${ctrl}</div>`;};
      const rowHtml=(r,ri)=>`<div class="rl-item${r&&r._extracted?' extracted':''}" data-ri="${ri}">
          <div class="rl-item-h"><span class="rl-item-n">${q.itemLabel||'Item'} ${ri+1}${r&&r._extracted?'<span class="rl-badge">extracted</span>':''}</span>${rlRows.length>1?`<button class="rl-remove" data-rm="${ri}" aria-label="Remove"><span class="material-icons">close</span></button>`:''}</div>
          <div class="rl-fields">${flds.map(f=>fieldHtml(f,ri)).join('')}</div></div>`;
      const rlNote=note?`<div class="rl-note ${note.kind}"><span class="material-icons">${note.kind==='ok'?'verified':note.kind==='hist'?'travel_explore':'folder_off'}</span><span>${note.text}</span></div>`:'';
      // Upload lives INSIDE the chat input as a paperclip (attach & extract, like Claude).
      const attachBtn=q.upload?`<button type="button" class="compose-attach" id="qRlUpload" title="Upload ${q.upload==='visa'?'visa / permit':'document'} — we'll extract the details"><span class="material-icons">attach_file</span></button><input type="file" id="qRlFile" accept=".pdf,.png,.jpg,.jpeg,image/*" hidden>`:'';
      const uploadHint=q.upload?`<div class="qc-uphint"><span class="material-icons">attach_file</span> Type the details above, or <button type="button" class="qc-uplink" id="qRlUpload2">attach the ${q.upload==='visa'?'permit':'document'}</button> and we'll extract them.</div>`:'';
      const rlChatBox=q.chatPlaceholder?`<div class="qc-chat">${q.emptyLabel?`<div class="qc-sugg"><button type="button" class="aq-sugg" id="qRlNone"><span class="material-icons">block</span> ${q.emptyLabel}</button></div>`:''}<div class="compose-card big">${attachBtn}<textarea id="qRlChat" rows="1" placeholder="${String(q.chatPlaceholder).replace(/"/g,'&quot;')}"></textarea><button class="send-circ" id="qRlChatSend" aria-label="Send"><span class="material-icons">arrow_upward</span></button></div>${uploadChip}${uploadHint}</div>`:'';
      ans=q.chatOnly
        ? `${rlNote}${rlChatBox}<div class="q-foot"><button class="btn tertiary" id="qBack"><span class="material-icons" style="font-size:16px">arrow_back</span> Back</button></div>`
        : `${rlNote}
        ${rlChatBox?rlChatBox+'<div class="qc-or"><span>or fill in the details</span></div>':''}
        <div class="rl-list" id="qRlList">${rlRows.map(rowHtml).join('')}</div>
        <button type="button" class="rl-add" id="qRlAdd"><span class="material-icons">add</span> ${q.addLabel||'Add another'}</button>
        <div class="q-foot"><button class="btn tertiary" id="qBack"><span class="material-icons" style="font-size:16px">arrow_back</span> Back</button><button class="btn primary" id="qRlNext">Send →</button></div>`;
    }else{
      ans=`<div class="cc-chips">${opts.map(o=>`<button class="chip${/^not sure$/i.test(o)?' subtle':''}" data-val="${o.replace(/"/g,'&quot;')}">${o}</button>`).join('')}${opts.some(o=>/^not sure$/i.test(o))?'':'<button class="chip subtle" data-val="Not sure">Not sure</button>'}</div>${explainBox}${backLink}`;
    }
  }

  const reviewDock=state.chatReview?`<div class="chat-dock">
    ${state.submitted?`<div class="cr-generating"><span class="material-icons rp-doc-spin">autorenew</span> Generating your documents — see them on the right.</div>`:''}
    <div class="compose-card big"><textarea id="crInput" rows="1" placeholder="Add or change anything — e.g. “salary is 100k”…"></textarea><button class="send-circ" id="crSend" aria-label="Send"><span class="material-icons">arrow_upward</span></button></div>
    ${state.submitted?'':`<button class="btn primary lg" id="chatReviewSubmit" style="width:100%;justify-content:center;margin-top:10px"><span class="material-icons" style="font-size:17px;vertical-align:-3px">check_circle</span> Everything's final — generate the documents</button>`}</div>`:'';
  viewEl.innerHTML=`<div class="chat-wrap">
    <div class="chat-thread" id="chatThread">${thread}</div>
    ${reviewDock||(ans?`<div class="chat-dock">${ans}</div>`:'')}
    <div class="chat-formswitch"><a id="chatFormSwitch" title="Your answers so far carry over"><span class="material-icons">edit_note</span> Switch to the form</a></div>
  </div>`;
  window.scrollTo(0,document.body.scrollHeight);

  // Put "Prefer a form?" on the same line as the Back button, whatever question type it is.
  const _back=viewEl.querySelector('#qBack'),_fsw=viewEl.querySelector('.chat-formswitch');
  if(_back&&_fsw){_back.after(_fsw);_fsw.classList.add('inline');}
  const fs=document.getElementById('chatFormSwitch');
  if(fs)fs.addEventListener('click',()=>{
    try{
      sessionStorage.setItem('wf_assignment_answers', JSON.stringify(state.answers||{}));
      // Snapshot the chat so we can resume the conversation on the exact step if the user switches back.
      sessionStorage.setItem('wf_assignment_chatstate', JSON.stringify({prefilled:state.prefilled||{},services:state.services||[],aiFill:!!state.aiFill,whoFor:state.whoFor,rawText:state.rawText||'',chatReview:!!state.chatReview}));
    }catch(e){}
    __pvNav();
  });
  // Review/edit mode: tap a past answer to change it, or submit again.
  viewEl.querySelectorAll('.hist-edit').forEach(b=>b.addEventListener('click',()=>{
    const j=parseInt(b.dataset.edit,10);
    state.chatReview=false;state.chatEditReturn=true;state.qIdx=j;state.qTyping=false;render();window.scrollTo(0,document.body.scrollHeight);
  }));
  // (5) "Not them? Change" on a matched/parsed answer → un-fill it so it's asked once, now.
  viewEl.querySelectorAll('.chat-change[data-changekey]').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.changekey;if(state.prefilled)delete state.prefilled[k];delete state.answers[k];
    if(k==='travelerName'){state.answers._needsInvite=false;delete state.answers._homeRole;delete state.answers.seniorRole;if(state.prefilled)delete state.prefilled.seniorRole;}
    const i=askList().findIndex(q=>q.key===k);state.qIdx=Math.max(0,i);state.qTyping=false;render();window.scrollTo(0,document.body.scrollHeight);
  }));
  const crs=document.getElementById('chatReviewSubmit');
  if(crs)crs.addEventListener('click',()=>{
    // Stay in the chat — confirm kicks off document generation, shown in the right panel with a spinner.
    // Generation runs in the background — we don't flip to "ready" here.
    state.submitted=true;state.draft=false;
    state.chatExtra=state.chatExtra||[];
    state.chatExtra.push({role:'ai',text:`Perfect — everything's confirmed. I'm generating your documents now — you'll see them building on the right.`});
    render();window.scrollTo(0,document.body.scrollHeight);
  });
  // Keep chatting in review mode → apply free-form changes, acknowledge, stay in the thread.
  const crIn=document.getElementById('crInput');
  if(crIn){crIn.focus();const crSend=()=>{const v=crIn.value.trim();if(!v)return;state.chatExtra=state.chatExtra||[];state.chatExtra.push({role:'me',text:v});const ack=applyChatEdit(v);state.chatExtra.push({role:'ai',text:ack});render();window.scrollTo(0,document.body.scrollHeight);};
    crIn.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();crSend();}});document.getElementById('crSend').addEventListener('click',crSend);}
  if(!q||state.qTyping)return;

  // Advance to the next question that still needs an answer. Using the KEY (not idx+1) so that when an
  // answer removes its own question from the list (e.g. duration sets `end`, currency, _children), the
  // next question isn't accidentally skipped.
  const advance=()=>{const nl=askList();const ni=nl.findIndex(qq=>state.answers[qq.key]==null||state.answers[qq.key]==='');state.qIdx=ni<0?nl.length:ni;};
  const submit=v=>{
    state.answers[q.key]=v;
    // (3) "Don't know / not sure / missing" → accept it gracefully: flag for later, never guess or
    //     mis-parse. Skips the structured parsers below and moves on.
    if(/^\s*(i\s+)?(don'?t\s*know|not\s*sure|unsure|no\s+idea|idk|dunno|tbd|to\s+be\s+confirmed|no\s+clue|missing|skip(?:\s+this)?)\b/i.test(String(v).trim())){
      state.answers[q.key]='Not sure — to confirm';(state.answers._unsure=state.answers._unsure||[]);if(!state.answers._unsure.includes(q.key))state.answers._unsure.push(q.key);
      if(state.editReturn){state.editReturn=false;state.view='summary';render();window.scrollTo(0,0);return;}
      if(state.chatEditReturn){state.chatEditReturn=false;state.chatReview=true;state.qIdx=askList().length;render();window.scrollTo(0,document.body.scrollHeight);return;}
      advance();state.qTyping=true;render();setTimeout(()=>{state.qTyping=false;render();},650);return;
    }
    // Host country answered directly → derive the country used elsewhere (presence, sanctions…).
    if(q.key==='host'){state.answers._destCountry=(String(v).split(',').pop()||v).trim();}
    // (9) Duration → treat as the assignment end.
    if(q.key==='duration'){state.answers.end=v;}
    // (4) Visa held → the country is the host (auto), so we never ask "which country".
    if(q.key==='visas'&&v==='Yes'&&!state.answers.visaCountry){state.answers.visaCountry=state.answers._destCountry;}
    // (1) Assignee not on the team → flag for an in-chat invite (email asked as the next questions).
    if(q.key==='travelerName'){const mt=matchEmployee(v);state.answers._needsInvite=!mt.matched;
      const role=EMPLOYEE_ROLES[mt.name];if(role){state.answers._homeRole=role;if(isSeniorRole(role)&&!(('seniorRole')in(state.prefilled||{}))){state.answers.seniorRole='Yes';state.prefilled=state.prefilled||{};state.prefilled.seniorRole='Yes';(state.prefilled._inferred=state.prefilled._inferred||[]).push('seniorRole');}}
      // (5/6) Match their profile → if they already hold a valid visa for the host, fill it in (to confirm).
      const host=state.answers._destCountry;const pv=(EMPLOYEE_VISAS[mt.name]||[]).find(x=>x.country===host);
      state.prefilled=state.prefilled||{};
      if(pv){const disp=`${pv.type} · valid to ${pv.valid}`;state.answers.visas='Yes';state.answers.visaType=pv.type;state.answers.visaValidity=pv.valid;state.answers.visaCountry=host;state.answers._storedVisa=disp;state.answers._visa=disp;
        state.prefilled._visa=disp;(state.prefilled._inferred=state.prefilled._inferred||[]).push('_visa');}
    }
    if(q.key==='inviteEmail'){state.answers._invitedEmail=v;state.answers._invited=true;}
    // Combined visa answer → one or several structured visas (assignee + accompanying family).
    if(q.key==='_visa'){const vl=parseVisaList(v,state.answers._destCountry);state.answers.visas=vl.has?'Yes':'No';if(vl.has){state.answers.visaType=vl.list[0].type;state.answers.visaValidity=vl.list[0].expiry;state.answers.visaCountry=state.answers._destCountry;state.answers._visaList=vl.list;}state.answers._visa=vl.display;}
    // Contractual setup — "Active contract — home & host" fills both; "home: X · host: Y" splits.
    if(q.key==='_contractual'){const s=String(v);const bm=s.match(/home\s*[:\-]?\s*([^·|,;]+?)\s*(?:·|\||,|;)\s*host\s*[:\-]?\s*([^·|,;]+)/i);
      if(bm){state.answers.contractHome=bm[1].trim();state.answers.contractHost=bm[2].trim();}
      else if(/\bboth\b|home\s*&\s*host|home and host/i.test(s)){const ty=s.replace(/[—\-]*\s*(both|home\s*&\s*host|home and host).*/i,'').trim();state.answers.contractHome=ty;state.answers.contractHost=ty;}
      else{state.answers.contractHome=s.trim();}
      state.answers._contractual=s;}
    // Combined marital/partner answer → structured fields.
    if(q.key==='_marital'){const m=v.toLowerCase();
      if(/married/.test(m)){state.answers.married='Yes';state.answers.spouseAccompany=/accompanying/.test(m)?'Yes':'No';state.answers.lifePartner='No';}
      else if(/life partner/.test(m)){state.answers.married='No';state.answers.lifePartner='Yes';state.answers.partnerAccompany=/accompanying/.test(m)?'Yes':'No';}
      else{state.answers.married='No';state.answers.lifePartner='No';}}
    // (2) One open "role" answer → parse the job title, activities, client work, contracts, seniority.
    if(q.key==='_role'){const r=String(v);const rl=r.toLowerCase();
      const jm=r.match(/((?:[A-Z][a-z]+\s+){0,2}(?:Lead|Manager|Director|Engineer|Head|Officer|Specialist|Analyst|Consultant|Controller|Coordinator|President))/);
      state.answers.jobTitle=jm?jm[1].trim():r.split(/[—,.;]/)[0].trim().slice(0,50);

    // Chat-input option — type the answer in your own words.
    const rlChat=document.getElementById('qRlChat');
    if(rlChat){rlChat.focus();const send=()=>{const v=rlChat.value.trim();if(v)submit(v);};rlChat.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});const rc=document.getElementById('qRlChatSend');if(rc)rc.addEventListener('click',send);}
  }
  const sk=document.getElementById('qSkip');if(sk)sk.addEventListener('click',()=>submit('—'));
  viewEl.querySelectorAll('.aq-choice, .chip[data-val]').forEach(b=>b.addEventListener('click',()=>submit(b.dataset.val)));
  // Free-text fallback when none of the options fit.
  const ex=document.getElementById('qExplain');
  if(ex){const exSend=()=>{const v=ex.value.trim();if(v)submit(v);};ex.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();exSend();}});const eb=document.getElementById('qExplainSend');if(eb)eb.addEventListener('click',exSend);}
}

function renderSummary(){
  const svcNames=state.services.map(id=>id==='explore'?'Explore mode':(AS_SERVICES.find(s=>s.id===id)||{}).title).filter(Boolean);
  // How many applicable fields are still open (unanswered or explicitly skipped).
  const self=state.whoFor==='me';
  const applicable=ASSIGN_QUESTIONS.filter(q=>!(q.onlyEmployee&&self)&&(!q.svc||svcSelected(q.svc))&&(!q.when||q.when(state.answers)));
  // (6) Only truly-required, unanswered fields count as "missing" — optional/skipped ones don't.
  const missing=applicable.filter(q=>!q.optional&&(state.answers[q.key]==null||state.answers[q.key]==='—'));
  const answered=applicable.filter(q=>state.answers[q.key]!=null&&state.answers[q.key]!=='—');
  const qLabel=q=>String(typeof q.title==='function'?q.title(state.answers):q.title).replace(/the host country/gi,state.answers._destCountry||'the host country');
  const missingCount=missing.length;
  // Smarter "what's missing": summarise by section (e.g. "3 in Assignment details · 2 in Assignee details").
  const missGroups={};missing.forEach(q=>{missGroups[q.group]=(missGroups[q.group]||0)+1;});
  const missBySection=Object.entries(missGroups).map(([g,n])=>`<span class="sum-miss-chip"><b>${n}</b> in ${g}</span>`).join('');
  const missingBanner=missingCount
    ? `<div class="sum-status miss"><span class="material-icons">pending_actions</span><div><strong>${missingCount} field${missingCount>1?'s':''} left</strong> — submit now and add ${missingCount>1?'them':'it'} later, or fill them below. <div class="sum-miss-sections">${missBySection}</div></div></div>`
    : `<div class="sum-status ok"><span class="material-icons">check_circle</span><div><strong>All fields complete</strong> — ready to submit.</div></div>`;
  // (2) Form-style review — every applicable question grouped by section, with its value or
  //     "Not provided", plus a Documents-status panel. Mirrors the classic form summary.
  const GICON={'Assignment details':'work','Assignee details':'person','Assignee':'person','Compensation & benefits':'payments'};
  const valOf=q=>{let v=state.answers[q.key];if(v==null||v===''||v==='—')return null;if(q.key==='presence'&&state.answers._entity)v=`${v} · ${state.answers._entity}`;return String(v);};
  const groupsOrder=[];const byGroup={};
  applicable.forEach(q=>{if(!byGroup[q.group]){byGroup[q.group]=[];groupsOrder.push(q.group);}byGroup[q.group].push(q);});
  const docs=state.services.filter(id=>['balance','cost','compliance','todo'].includes(id)).map(id=>AS_SERVICES.find(s=>s.id===id)).filter(Boolean);
  const docPanel=docs.length?`<div class="rev-docs">
    <div class="rev-docs-h"><span class="material-icons">description</span> Documents status <span class="rev-count">${docs.length}</span></div>
    ${docs.map(d=>`<div class="rev-doc"><span class="material-icons rev-doc-ic">${d.mi}</span><div class="rev-doc-b"><b>${d.title}</b><span>Will be generated on submit</span></div><span class="material-icons rev-doc-chk">check_circle</span></div>`).join('')}
    <div class="rev-docs-note"><span class="material-icons">info</span> Submitting generates these documents from your latest answers.</div></div>`:'';
  const sections=groupsOrder.map(g=>{const qs=byGroup[g];const gm=qs.filter(q=>!q.optional&&valOf(q)==null).length;
    return `<div class="rev-sec">
      <div class="rev-sec-h"><span class="rev-sec-t"><span class="material-icons">${GICON[g]||'list_alt'}</span> ${g}</span>${gm?`<span class="rev-sec-miss">${gm} missing</span>`:''}<a class="rev-edit" data-editgrp="${g}">Edit</a></div>
      <div class="rev-rows">${qs.map(q=>{const v=valOf(q);const na=v==null;return `<div class="rev-row${na?' na':''}" data-key="${q.key}"><span class="rev-q">${qLabel(q)}</span><span class="rev-a">${na?'Not provided':String(v).replace(/</g,'&lt;')}</span></div>`;}).join('')}</div></div>`;}).join('');
  viewEl.innerHTML=`<div class="as-wrap" style="max-width:760px;padding-top:16px">
    <div class="as-topline"><button class="btn tertiary sm" id="editInChat"><span class="material-icons" style="font-size:16px">forum</span> Edit answers in chat</button><span class="autosave"><span class="material-icons">cloud_done</span> Draft saved automatically</span></div>
    <div class="as-head" style="margin-bottom:18px"><h1>Review before submitting</h1><p class="as-sub">Check every section carefully — ${missingCount?`<strong>${missingCount}</strong> field${missingCount!==1?'s are':' is'} still <em>Not provided</em>. `:''}Click any row or <strong>Edit</strong> to fill it in the chat. Everything's saved.</p></div>
    ${docPanel}
    ${sections}
    <div class="as-sum-note" style="margin-top:16px"><span class="material-icons">info</span> Credits are deducted only on submission. Saved automatically as a Draft.</div>
    <div class="as-form-actions" style="justify-content:space-between;margin-top:20px"><button class="btn tertiary" id="editInChat2"><span class="material-icons" style="font-size:15px">forum</span> Continue in chat</button><button class="btn primary lg" id="sumSubmit">Submit assignment</button></div></div>`;
  document.getElementById('sumSubmit').addEventListener('click',()=>{state.draft=false;state.view='done';render();});
  const openChat=()=>{state.chatReview=true;state.chatExtra=[];state.qIdx=askList().length;state.qTyping=false;state.view='questions';render();window.scrollTo(0,document.body.scrollHeight);};
  ['editInChat','editInChat2'].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener('click',openChat);});
  // Jump to a single question in the chat, then return to this summary once it's answered (#4).
  const jumpTo=k=>{
    if((state.prefilled||{})[k]!=null)delete state.prefilled[k];
    if(state.answers[k]==='—')delete state.answers[k];
    const i=askList().findIndex(q=>q.key===k);
    state.qIdx=i>=0?i:0;state.editReturn=true;state.qTyping=false;state.view='questions';render();
  };
  viewEl.querySelectorAll('.rev-row').forEach(r=>r.addEventListener('click',()=>jumpTo(r.dataset.key)));
  viewEl.querySelectorAll('.rev-edit').forEach(a=>a.addEventListener('click',e=>{e.stopPropagation();const qs=byGroup[a.dataset.editgrp]||[];const t=qs.find(q=>!q.optional&&valOf(q)==null)||qs[0];if(t)jumpTo(t.key);}));
}

    <h1>${state.draft?'Saved as a draft':isEnd?'End of assignment submitted':'Assignment submitted'}</h1>
    <p class="sub">${state.draft?'Your assignment is saved — pick it up any time from My requests.':isEnd?'Thanks — we\'ve logged the end of your assignment. Our team will handle repatriation, social security, and the closing steps.':`We've received the assignment${aiDocs.length?` — we're generating your <strong>${aiDocs.map(d=>d.title).join(' & ')}</strong> now`:''}. Our team will review and follow up with next steps.`}</p>
    ${reqId?`<div style="display:inline-block;margin:4px auto 0;padding:8px 16px;border-radius:var(--borderRadiusM);background:var(--colorPrimaryBg);border:1px solid var(--colorPrimaryBorder);color:var(--colorPrimaryHover);font-weight:600;letter-spacing:.5px">ID: ${reqId}</div>`:''}
    ${docsBlock}
    <div class="as-form-actions" style="margin-top:20px;width:100%;max-width:680px;margin-left:auto;margin-right:auto">
      ${(!state.draft&&!isEnd)?`<button class="btn primary lg" id="doneChat" style="width:100%;justify-content:center"><span class="material-icons" style="font-size:16px">forum</span> Continue in the chat</button>`:''}</div></div>`;

  const backToChat=()=>{state.view='questions';state.chatReview=true;state.chatExtra=state.chatExtra||[];state.qIdx=askList().length;render();window.scrollTo(0,document.body.scrollHeight);};

function rpRow(l,v,tag){return `<div class="rp-row"><div class="rp-l">${l}</div><div class="rp-v ${v==='—'?'empty':''}">${v}${tag&&v!=='—'?` <span class="rp-tag">${tag}</span>`:''}</div></div>`;}
function renderRightPanel(){
  const rp=document.getElementById('rightPanel');
  if(!rp)return;
  // The rail is only shown while filling in the questions — it carries the progress bar and
  // what's still missing. It's hidden on setup, describe, summary and done.
  if(state.view!=='questions'){rp.style.display='none';return;}
  rp.style.display='';
  const list=askList();
  const total=list.length;
  const idx=Math.min(state.qIdx,total);
  const remaining=list.slice(idx);
  const preCount=Object.keys(state.prefilled||{}).filter(k=>ASSIGN_QUESTIONS.some(q=>q.key===k)).length;
  const grand=total+preCount;                       // everything the assignment needs
  const doneN=idx+preCount;
  const pct=grand?Math.round(doneN/grand*100):0;
  const titleOf=q=>String(typeof q.title==='function'?q.title(state.answers):q.title).replace(/the host country/gi,state.answers._destCountry||'the host country').replace(/\?$/,'');
  // (3) Group the remaining questions by section → each is an expandable list of the actual questions.
  const groups={};remaining.forEach((q,i)=>{(groups[q.group]=groups[q.group]||[]).push(q);});
  const groupBlocks=Object.entries(groups).map(([g,qs],gi)=>`
    <details class="rp-acc"${gi===0?' open':''}>
      <summary><div class="rp-sum"><svg class="rp-grp-ic" viewBox="0 0 24 24" width="18" height="18" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.8"/></svg><span class="rp-grp-l">${g}</span><span class="rp-count">${qs.length}</span><span class="material-icons rp-chev">expand_more</span></div></summary>
      <div class="rp-acc-items">${qs.map(q=>`<div class="rp-acc-item">${titleOf(q)}</div>`).join('')}</div>
    </details>`).join('');
  // (2) "Parsed & matched" — everything the AI already pulled from the description, grouped by
  // section with its actual value, so the user can see at a glance what's filled (not lost in chat).
  const inferred=(state.prefilled||{})._inferred||[];
  const preQs=ASSIGN_QUESTIONS.filter(q=>state.prefilled&&(q.key in state.prefilled)&&state.answers[q.key]!=null&&state.answers[q.key]!==''&&(!q.svc||svcSelected(q.svc)));
  const shortV=v=>{v=String(v);return v.length>36?v.slice(0,34)+'…':v;};
  const pGroups={};preQs.forEach(q=>{(pGroups[q.group]=pGroups[q.group]||[]).push(q);});
  const parsedBlocks=Object.entries(pGroups).map(([g,qs],gi)=>`
    <details class="rp-acc"${gi===0?' open':''}>
      <summary><div class="rp-sum"><svg class="rp-grp-ic done" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="9" fill="currentColor"/><path d="M8.2 12.4l2.6 2.6 5-5.4" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="rp-grp-l">${g}</span><span class="rp-count">${qs.length}</span><span class="material-icons rp-chev">expand_more</span></div></summary>
      <div class="rp-acc-items">${qs.map(q=>{const inf=inferred.includes(q.key);const av=(q.key==='presence'&&state.answers._entity)?`${state.answers[q.key]} · ${state.answers._entity}`:state.answers[q.key];return `<div class="rp-parsed"><span class="rp-parsed-q">${titleOf(q)}</span><span class="rp-parsed-a${inf?' assumed':''}">${shortV(av)}${inf?'<span class="rp-confirm" title="The AI assumed this from your description rather than you stating it — review and confirm (or change) it before submitting.">confirm</span>':''}</span></div>`;}).join('')}</div>
    </details>`).join('');
  // (5) Visa & work address aren't asked for this move — visa is skipped for EU (freedom of movement)
  //     and the address is matched from the registered entity. Surface both so they're visibly covered.
  const _host=state.answers._destCountry||'';
  const auto=[];
  if(state.answers.workAddress)auto.push({t:'Work address',v:state.answers.workAddress+(state.answers._entity?` · ${state.answers._entity}`:''),note:'matched from your entity (Google-verified)'});
  if(svcSelected('compliance')){
    if(state.answers._storedVisa)auto.push({t:'Visa / work permit',v:state.answers._storedVisa,note:'on file'});
    else if(isEUHost(_host))auto.push({t:'Visa / work permit',v:'Not required',note:'EU freedom of movement'});
  }
  const autoChk='<svg class="rp-grp-ic done" viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="9" fill="currentColor"/><path d="M8.2 12.4l2.6 2.6 5-5.4" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const autoBlock=auto.map(a=>`<div class="rp-auto">${autoChk}<div class="rp-auto-b"><span class="rp-auto-t">${a.t}</span><span class="rp-auto-v">${shortV(a.v)} · <em>${a.note}</em></span></div></div>`).join('');
  // ── Assignment summary — the at-a-glance essentials (replaces the verbose parsed/matched list) ──
  const a=state.answers;
  const homeStr=a._homeCountry||'';
  const hostStr=a.host||a._destCountry||'';
  const durStr=a.duration||a.end||'';
  const assigneeStr=a.travelerName?`${a.travelerName}${a._homeRole?` · ${a._homeRole}`:''}`:'';
  const _acc=[];const _mar=a._marital||'';
  if(a.spouseAccompany==='Yes'||/spouse accompanying/i.test(_mar))_acc.push('Spouse');
  else if(/life partner.*accompanying/i.test(_mar))_acc.push('Partner');
  const _kids=parseInt(a.childrenAccompany||'',10);if(_kids>0)_acc.push(_kids+' child'+(_kids>1?'ren':''));
  const familyStr=_acc.length?_acc.join(' + '):(_mar?'None accompanying':'');
  const _salN=parseInt(String(a.homeSalary||'').replace(/[^0-9]/g,''),10);
  const salStr=a.homeSalary?`${a.currency||'EUR'} ${isNaN(_salN)?String(a.homeSalary):_salN.toLocaleString('en-US')}`:'';
  // Benefits/allowances the user picks or types in the chat — surfaced here as they're added.
  const _benList=[];const _bda=a._bendraft_allowances||{};Object.keys(_bda).forEach(k=>{if(_bda[k]&&_bda[k]._on)_benList.push(k==='Other allowance'&&_bda[k]._name?_bda[k]._name:k);});
  const benefitsStr=_benList.length?_benList.join(', '):'';
  // Each row shows whether the value is parsed (green check) or still missing (a small "missing" tag).
  const _sChk='<svg class="rp-asum-chk" viewBox="0 0 24 24" width="13" height="13"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M8 12.4l2.6 2.6 5.2-5.6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const sumRow=(k,v)=>{const has=v!=null&&v!=='';return `<div class="rp-asum-row"><span class="rp-asum-k">${k}${has?_sChk:'<span class="rp-asum-pill">missing</span>'}</span>${has?`<span class="rp-asum-v">${v}</span>`:`<span class="rp-asum-v na">Not captured yet</span>`}</div>`;};
  // ── Documents — only generated once the user confirms; a spinner shows while they're prepared ──
  const docIds=(state.services||[]).filter(id=>['balance','cost','compliance','todo'].includes(id));
  const _sub=!!state.submitted;const _waiting=Math.max(0,grand-doneN);
  const docsBlock=docIds.map(id=>{const s=AS_SERVICES.find(x=>x.id===id)||{title:id,mi:'description'};
    // Always a live "generating" look (animated spinner) — before confirm it shows what's parsed vs
    // still waiting; after confirm it's building the final doc in the background.
    const st=_sub?'Generating…':`Drafting · <b>${doneN}</b> parsed · <b>${_waiting}</b> to go`;
    return `<div class="rp-doc gen"><span class="rp-doc-ic"><span class="material-icons">${s.mi}</span></span><div class="rp-doc-b"><span class="rp-doc-t">${s.title}</span><span class="rp-doc-s">${st}</span></div><span class="material-icons rp-doc-spin">autorenew</span></div>`;}).join('');
  rp.innerHTML=`
    <div class="rp-progcard">
      <div class="rp-prog-top"><span class="rp-prog-h">Setup progress</span><span class="rp-pct">${pct}%</span></div>
      <div class="rp-line"><div class="rp-line-fill" style="width:${pct}%"></div></div>
      ${pct>=100
        ?`<div class="rp-prog-complete"><span class="material-icons">check_circle</span> All set — ready to generate</div>`
        :`<div class="rp-prog-stats"><span class="rp-stat"><span class="material-icons">check_circle</span> ${doneN} of ${grand} answered</span><span class="rp-stat muted">${_waiting} left</span></div>`}
    </div>
    ${docIds.length?`<div class="rp-sum-title" style="margin-top:22px">Documents <span class="rp-count">${docIds.length}</span></div>
    <div class="rp-docs">${docsBlock}</div>`:''}
    <div class="rp-sum-title" style="margin-top:22px">Assignment summary</div>
    <div class="rp-asum">${sumRow('Home',homeStr)}${sumRow('Host',hostStr)}${sumRow('Duration',durStr)}${sumRow('Assignee',assigneeStr)}${sumRow('Accompanying family',familyStr)}${sumRow('Home base salary',salStr)}${benefitsStr?sumRow('Benefits',benefitsStr):''}</div>
    <div class="rp-draft"><span class="material-icons">cloud_done</span> Auto-saved as draft</div>`;
}
// Generated-document preview — a draft assembled from the answers so far, viewable before submit.

  }else{
    const tasks=[['Confirm assignment dates & host entity','Now'],['Issue A1 certificate','Before departure'],['Register for host income tax','Week 1'],['Set up payroll ('+(a.payroll||'Home')+')','Week 1'],['File permanent-establishment assessment','Week 2'],['Arrange housing & relocation','Before start']];
    body=`<div class="doc-todos">${tasks.map((t,i)=>`<div class="doc-todo"><span class="dt-n">${i+1}</span><span class="dt-t">${t[0]}</span><span class="dt-when">${t[1]}</span></div>`).join('')}</div>`;
  }
  const ov=document.createElement('div');ov.className='doc-overlay';ov.id='docOverlay';

// Map a free-text "what changed?" request onto the actual answers, so we update them automatically.
function applyRepeatChanges(text){
  const t=(text||'').toLowerCase();const applied=[];
  const addAllow=[];
  if(/housing/.test(t))addAllow.push('Housing allowance');
  if(/utilit/.test(t))addAllow.push('Utility allowance');
  if(/home leave/.test(t))addAllow.push('Home leave');
  if(/cola|cost of living/.test(t))addAllow.push('COLA (Cost of Living Allowance)');
  if(/\bcar\b/.test(t))addAllow.push('Company car allowance at host');
  if(/\bbonus\b/.test(t))addAllow.push('Bonus');
  if(/pension/.test(t))addAllow.push('Pension addition');
  if(addAllow.length){
    const cur=(state.answers.allowances&&state.answers.allowances!=='None')?state.answers.allowances.split(', '):[];
    const merged=[...new Set([...cur,...addAllow])];
    state.answers.allowances=merged.join(', ');state.prefilled.allowances=state.answers.allowances;
    applied.push('Added '+addAllow.join(', ')+' to compensation');
  }
  const jt=text&&text.match(/title\s*(?:to|=|:|—|-)\s*([^,;.]{2,40})/i);
  if(jt){state.answers.jobTitle=jt[1].trim();state.prefilled.jobTitle=state.answers.jobTitle;applied.push('Job title → “'+jt[1].trim()+'”');}
  if(/split payroll|payroll.*split|split the payroll/.test(t)){state.answers.payroll='Split';state.prefilled.payroll='Split';applied.push('Payroll → Split');}
  if(/new address|different address|host address|change the address/.test(t)){delete state.prefilled.workAddress;delete state.answers.workAddress;applied.push('Cleared the host address so you can set a new one');}
  return applied;
}

  document.getElementById('confBack').addEventListener('click',()=>{__pvNav();});
}
// Demo-scenarios dropdown pill (in the header). Selecting an item applies the scenario, updates the
// pill label + active state, and closes the menu. (The .hp-wrap>button handler opens/closes the menu.)
document.querySelectorAll('.sc-mi').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.sc-mi').forEach(x=>x.classList.remove('active'));t.classList.add('active');
  const cur=document.getElementById('asScCur');if(cur)cur.textContent=t.dataset.label||t.textContent.trim();
  document.querySelectorAll('.hp-menu').forEach(m=>m.classList.remove('open'));
  applyAsScenario(t.dataset.as);
}));
(function boot(){
  // Deep-link a scenario, e.g. ?scenario=repatriation (used by the "Use AI instead" toggle on the end-assignment form).
  const sc=new URLSearchParams(location.search).get('scenario');
  if(sc&&['new','edit'].includes(sc)){
    document.querySelectorAll('.sc-mi').forEach(x=>{const on=x.dataset.as===sc;x.classList.toggle('active',on);if(on){const cur=document.getElementById('asScCur');if(cur)cur.textContent=x.dataset.label||x.textContent.trim();}});
    applyAsScenario(sc);return;
  }
  // Coming back from the form ("Use AI instead") → resume the chat where we left off (not from the start),
  // carrying every answer (including anything edited in the form) into the conversation.
  if(new URLSearchParams(location.search).get('from')==='form'){
    let ans=null,cs=null;
    try{ans=JSON.parse(sessionStorage.getItem('wf_assignment_answers')||'null');cs=JSON.parse(sessionStorage.getItem('wf_assignment_chatstate')||'null');}catch(e){}
    if(ans&&Object.keys(ans).length){
      state.whoFor=(cs&&cs.whoFor)||'employee';
      state.aiFill=cs?!!cs.aiFill:true;
      state.services=(cs&&cs.services&&cs.services.length)?cs.services:['balance','cost'];
      state.prefilled=(cs&&cs.prefilled&&Object.keys(cs.prefilled).length)?cs.prefilled:Object.assign({},ans);
      state.rawText=(cs&&cs.rawText)||'';
      state.answers=Object.assign({},ans);
      if(state.answers.host&&!state.answers._destCountry)state.answers._destCountry=(String(state.answers.host).split(',').pop()||state.answers.host).trim();
      state.resumed=true;
      // Land on the next still-unanswered question — continue on top of what's there.
      const nl=askList();const ni=nl.findIndex(q=>state.answers[q.key]==null||state.answers[q.key]==='');
      state.qIdx=ni<0?nl.length:ni;
      state.view='questions';render();
      try{sessionStorage.removeItem('wf_assignment_chatstate');}catch(e){}
      return;
    }
  }
  // If the trip detector already worked out this is an assignment, carry the description over
  // and skip straight to the services screen (the "new assignment" setup) — no re-describe, no confirmation step.
  let carried='',who='';
  try{carried=sessionStorage.getItem('wf_assignment_desc')||'';sessionStorage.removeItem('wf_assignment_desc');
      who=sessionStorage.getItem('wf_assignment_who')||'';sessionStorage.removeItem('wf_assignment_who');}catch(e){}
  state.whoFor='employee';   // assignments are always for an employee
  if(carried){
    // Came from V3 → skip describe, land straight on "Set up the assignment" with the
    // description analysed and gaps extracted. The assignee is still the first chat question.
    state.rawText=carried;
    state.detected=analyzeAssignment(carried);
    state.aiFill=true;
  }
  state.services=[];
  state.view='services';
  render();
})();
</script>
