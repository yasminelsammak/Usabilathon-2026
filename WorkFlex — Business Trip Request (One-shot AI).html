/* ============ QUESTION FLOW (free-form, one step per question) ============ */
const Q = {
  traveler: {
    when: () => state.whoFor === 'employee' && !state.traveler,
    title: () => `Who's the employee?`,
    hint: () => `Start typing a name — if there are multiple matches (like 3 Yasmins), I'll show their email + team so you pick the right one.`,
    placeholder: 'e.g. Yasmin, Sara Müller…',
    apply: (text) => {
      // Strict: if exactly one match, accept. If multiple matches, refuse (user must click).
      const t = text.toLowerCase().trim();
      const matches = EXISTING.filter(e => `${e.firstName} ${e.lastName} ${e.email}`.toLowerCase().includes(t));
      if (matches.length === 1) {
        state.traveler = { ...matches[0], isNew: false };
        return;
      }
      // Otherwise, treat as a new invite
      const [fn, ...rest] = text.trim().split(/\s+/);
      state.traveler = { firstName: fn, lastName: rest.join(' ') || '', email: `${fn.toLowerCase()}@acme.com`, isNew: true };
    },
  },
  destination: {
    when: () => !state.destination,
    title: () => state.whoFor === 'me' ? `Where are you traveling to?` : `Where is ${state.traveler?.firstName || 'the employee'} traveling to?`,
    hint: () => {
      if (state.scenario === 'domestic') return `Try typing <strong>Germany</strong> (Sara's home country) to see the domestic block — or pick a different country.`;
      if (state.scenario === 'unsupported') return `Try typing <strong>Brazil</strong>, <strong>Iran</strong>, or <strong>Indonesia</strong> — countries we don't support yet — to see the warning.`;
      return `Any city or country — type whatever you want, like "Brussels" or "England".`;
    },
    placeholder: 'e.g. Brussels, England, Tokyo…',
    apply: (text) => {
      const t = text.toLowerCase();
      // Known city first → match country + city in one go
      for (const c of COUNTRIES) {
        for (const city of c.cities || []) {
          if (t.includes(city.toLowerCase())) {
            state.destination = c;
            state.destinationCity = city;
            return;
          }
        }
      }
      // Known country alias → set country, leave city blank (will ask next)
      for (const c of COUNTRIES) {
        if (c.aliases.some(a => t.includes(a))) {
          state.destination = c;
          return;
        }
      }
      // Unknown — treat input as country name (custom), leave city blank to ask next
      const cleanText = text.trim().replace(/^(to|in|going to|trip to|travel to|visiting)\s+/i, '');
      const loc = cleanText.charAt(0).toUpperCase() + cleanText.slice(1);
      state.destination = { name: loc, flag: '🌍', cities: [], aliases: [loc.toLowerCase()], compliance: [], custom: true };
    },
  },
  destinationCity: {
    // Always ask for the city if we have a country but no city yet
    when: () => state.destination && !state.destinationCity,
    title: () => `Which city in ${state.destination.name} ${state.destination.flag}?`,
    hint: () => `Type any city in ${state.destination.name}.`,
    placeholder: 'e.g. London, Manchester, Edinburgh…',
    apply: (text) => {
      const cleanText = text.trim();
      const known = (state.destination.cities || []).find(c => cleanText.toLowerCase().includes(c.toLowerCase()));
      state.destinationCity = known || (cleanText.charAt(0).toUpperCase() + cleanText.slice(1));
    },
  },
  dates: {
    when: () => !state.dates,
    title: () => state.scenario === 'returning'
      ? `When's the new trip?`
      : `When's the trip?`,
    hint: () => state.scenario === 'returning'
      ? `Same traveler and destination as last time — just need the new dates.`
      : `Any format — "May 22 to 28", "next week", "first week of June"…`,
    placeholder: 'e.g. May 22 to 28',
    apply: (text) => {
      const re = /(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+(\d{1,2})\s*(?:-|–|—|to|until)\s*(\d{1,2})/i;
      const m = text.match(re);
      if (m) {
        const month = m[1].slice(0,3).toLowerCase();
        const start = parseInt(m[2],10), end = parseInt(m[3],10);
        const monthAbbr = { jan:'Jan', feb:'Feb', mar:'Mar', apr:'Apr', may:'May', jun:'Jun', jul:'Jul', aug:'Aug', sep:'Sep', oct:'Oct', nov:'Nov', dec:'Dec' }[month];
        state.dates = { nights: end - start, label: `${start} ${monthAbbr} → ${end} ${monthAbbr} 2026` };
      } else {
        state.dates = { nights: 7, label: text.trim().charAt(0).toUpperCase() + text.trim().slice(1) };
      }
    },
  },
  purpose: {
    when: () => !state.purpose,
    title: () => `What's the purpose of the trip?`,
    hint: () => `Anything — conference, client meeting, training… I'll match it to the closest type.`,
    placeholder: 'e.g. Trade show, customer pitch, team offsite…',
    apply: (text) => {
      const t = text.toLowerCase().trim();
      // Try alias match first
      for (const p of PURPOSES) {
        if (p.aliases.some(a => t.includes(a))) { state.purpose = p.label; return; }
      }
      // Token overlap fallback — best match wins
      let bestMatch = null;
      let bestScore = 0;
      for (const p of PURPOSES) {
        const labelTokens = (p.label.toLowerCase() + ' ' + p.aliases.join(' ')).split(/\W+/).filter(Boolean);
        const score = t.split(/\W+/).filter(Boolean).filter(tok => labelTokens.some(lt => lt.startsWith(tok) || tok.startsWith(lt))).length;
        if (score > bestScore) { bestScore = score; bestMatch = p; }
      }
      // If we got any overlap, use the matched purpose; otherwise accept text as-is
      state.purpose = bestScore > 0 ? bestMatch.label : (text.trim().charAt(0).toUpperCase() + text.trim().slice(1));
    },
  },
  // PWN — ask the actual details directly since the user expects them for PWN-required countries
  pwnAddress: {
    when: () => state.destination?.compliance?.includes('pwn') && !state.pwnAddress,
    title: () => `What's the working address in ${state.destination.name}?`,
    hint: () => `${state.destination.name} requires a Posted Worker Notification — I'll need the full address (street, number, zip, city) to file it.`,
    placeholder: 'e.g. Rue Royale 76, 1000 Brussels',
    apply: (text) => {
      state.pwnAddress = text.trim();
      state.pwn = 'yes'; // mark PWN as in-progress / completed for review card
    },
  },
  pwnCompany: {
    when: () => state.destination?.compliance?.includes('pwn') && state.pwnAddress && !state.pwnCompany,
    title: () => `What's the destination company name?`,
    hint: () => {
      const subj = state.whoFor === 'me' ? `you'll be` : `${state.traveler?.firstName || 'they\'ll'} will be`;
      return `The company ${subj} working at — leave blank if not at a client site.`;
    },
    placeholder: 'e.g. Acme Belgium SA',
    apply: (text) => { state.pwnCompany = text.trim() || '—'; },
  },
  pwnActivity: {
    when: () => state.destination?.compliance?.includes('pwn') && state.pwnCompany && !state.pwnActivity,
    title: () => `What's the field of activity?`,
    hint: () => `Sector — e.g. Construction, ICT, Petrochemical industry, Hotels & catering.`,
    placeholder: 'e.g. Petrochemical industry',
    apply: (text) => { state.pwnActivity = text.trim(); },
  },
  a1: {
    when: () => state.destination?.compliance?.includes('a1') && !state.a1,
    title: () => {
      const subj = state.whoFor === 'me' ? 'you' : (state.traveler?.firstName || 'they');
      const verb = state.whoFor === 'me' ? 'Do' : 'Does';
      return `${verb} ${subj} have an A1 certificate already?`;
    },
    hint: () => `Social-security coverage proof for EU travel. Yes or no.`,
    placeholder: 'Yes or no',
    apply: (text) => {
      const t = text.toLowerCase();
      state.a1 = /\b(yes|yep|have|already|existing|got|y)\b/.test(t) ? 'yes' : 'no';
    },
  },
  coc: {
    when: () => state.destination?.compliance?.includes('coc') && !state.coc,
    title: () => {
      const subj = state.whoFor === 'me' ? 'you' : (state.traveler?.firstName || 'they');
      const verb = state.whoFor === 'me' ? 'Do' : 'Does';
      return `${verb} ${subj} have a Certificate of Coverage for the US?`;
    },
    hint: () => `Yes or no.`,
    placeholder: 'Yes or no',
    apply: (text) => {
      const t = text.toLowerCase();
      state.coc = /\b(yes|yep|have|already|got|y)\b/.test(t) ? 'yes' : 'no';
    },
  },
};

// Pre-built flat index of all (city, country) pairs + country-only fallbacks for autocomplete
const DESTINATION_SUGGESTIONS = (() => {
  const list = [];
  COUNTRIES.forEach(c => {
    (c.cities || []).forEach(city => {
      list.push({
        searchKey: `${city} ${c.name}`.toLowerCase(),
        city, country: c,
        compliance: c.compliance || [],
      });
    });
  });
  return list;
})();

function complianceShort(compliance) {
  // A1 is auto-issued by WorkFlex for EU travel — never surfaced as a user-facing tag
  return compliance.filter(c => c !== 'a1').map(c => c.toUpperCase()).join(' · ');
}

function getAnswerDisplay(key) {
  if (key === 'traveler' && state.traveler) return `${state.traveler.firstName} ${state.traveler.lastName}`;
  if (key === 'destination' && state.destination) return `${state.destination.flag} ${state.destination.name}`;
  if (key === 'destinationCity' && state.destinationCity) return state.destinationCity;
  if (key === 'dates' && state.dates) return state.dates.label;
  if (key === 'purpose' && state.purpose) return state.purpose;
  if (key === 'pwnAddress' && state.pwnAddress) return state.pwnAddress;
  if (key === 'pwnCompany' && state.pwnCompany) return state.pwnCompany;
  if (key === 'pwnActivity' && state.pwnActivity) return state.pwnActivity;
  if (key === 'a1' && state.a1) return state.a1 === 'yes' ? 'Yes, already issued' : 'No, please issue one';
  if (key === 'coc' && state.coc) return state.coc === 'yes' ? 'Yes, already issued' : 'No, please issue one';
  return null;
}

function findNextQuestion() {
  // A1 is no longer asked — handled automatically based on destination
  for (const key of ['traveler','destination','destinationCity','dates','purpose','pwnAddress','pwnCompany','pwnActivity','coc']) {
    if (Q[key] && Q[key].when()) return { key, ...Q[key] };
  }
  return null;
}

async function askNext() {
  const next = findNextQuestion();
  if (!next) {
    pushAi(`Perfect — I have everything I need. Let me put your request together…`);
    await wait(900);
    state.view = 'review';
    render();
    return;
  }
  state.currentQuestion = next.key;
  pushAi(next.prompt());
}

function acceptAnswer(value, display) {
  pushUser(display || value);
  const q = Q[state.currentQuestion];
  if (!q) return;
  const ok = q.apply(value);
  if (!ok) {
    setTimeout(async () => {
      pushAi(`I didn't catch that — try again or pick one of the options above.`);
    }, 400);
    return;
  }
  renderSidebar();
  // Show typing then next question
  const typing = pushTyping();
  setTimeout(async () => {
    if (typing) typing.remove();
    askNext();
  }, 700);
}

async function handleAnswer() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';
  acceptAnswer(text, text);
}

        state.traveler = { ...emp, isNew: false };
        state.lastUpdatedField = 'traveler';
        closeModal();
        state.view = 'step';
        render();
      });
    });
  };

  const closeModal = () => {
    overlay.remove();
    document.removeEventListener('keydown', escHandler);
  };
  const escHandler = (e) => {
    if (e.key === 'Escape') { closeModal(); state.whoFor = null; render(); }
  };

  closeBtn.addEventListener('click', () => { closeModal(); state.whoFor = null; render(); });
  overlay.addEventListener('click', e => {
    if (e.target === overlay) { closeModal(); state.whoFor = null; render(); }
  });
  document.addEventListener('keydown', escHandler);

function generate() {
  const text = document.getElementById('composeText').value.trim();
  if (!text) return;
  state.rawText = text;
  const parsed = parse(text);
  Object.assign(state, parsed);
  // Always set whoFor if traveler picked
  if (!state.whoFor && state.traveler) state.whoFor = 'employee';
  state.view = 'parsing';
  render();
  runParseAnimation();
}

function runParseAnimation() {
  const steps = [
    { label: 'Reading your message', key: 'read' },
    { label: state.whoFor === 'me' ? 'Identifying you as the traveler' : 'Identifying the employee', key: 'who' },
    { label: 'Extracting destination & dates', key: 'trip' },
    { label: 'Running compliance checks', key: 'compliance' },
    { label: 'Building your request', key: 'build' },
  ];
  const stepsEl = document.querySelector('.parse-steps');
  let i = 0;
  function advance() {
    if (!stepsEl) return;
    if (i > 0) {
      stepsEl.children[i-1].classList.remove('active');
      stepsEl.children[i-1].classList.add('done');
    }
    if (i < steps.length) {
      stepsEl.children[i].classList.add('active');
      i++;
      setTimeout(advance, 600);
    } else {
      setTimeout(() => { state.view = 'review'; render(); }, 400);
    }
  }
  setTimeout(advance, 350);
}

function renderParsing() {
  const steps = [
    'Reading your message',
    state.whoFor === 'me' ? 'Identifying you as the traveler' : 'Identifying the employee',

function renderReview() {
  const travelerVal = state.whoFor === 'me'
    ? `${requestor.firstName} ${requestor.lastName} <span class="tag-mini grey">Self</span>`
    : (state.traveler
        ? `${state.traveler.firstName} ${state.traveler.lastName} ${state.traveler.isNew ? '<span class="tag-mini">New invite</span>' : ''}`
        : '<span class="tag-mini warn">Missing</span>');

  // Country-specific compliance rules
  const needsPwn = state.destination?.compliance?.includes('pwn');
  const needsA1 = state.destination?.compliance?.includes('a1');
  const needsCoc = state.destination?.compliance?.includes('coc');

  // Core fields always required (destination = country + city)
  const baseFilled = [
    state.whoFor,
    state.destination,
    state.destinationCity,
    state.dates,
    state.purpose
  ].filter(Boolean).length;
  const baseTotal = 5;
  // Compliance fields conditional on destination
  // A1 is auto-issued — no longer counted as a user-input requirement
  const complianceTotal = (needsPwn ? 1 : 0) + (needsCoc ? 1 : 0);
  const complianceFilled = (needsPwn && state.pwn ? 1 : 0) + (needsCoc && state.coc ? 1 : 0);

  const filled = baseFilled + complianceFilled;
  const total = baseTotal + complianceTotal;
  const missing = total - filled;
  const conf = missing === 0 ? 'High' : missing <= 2 ? 'Medium' : 'Low';

  const baseRows = `
    ${fieldRow({ icon: 'user', label: 'Traveler', val: travelerVal, key: 'traveler', missing: state.whoFor === 'employee' && !state.traveler })}
    ${fieldRow({
      icon: 'pin',
      label: 'Destination',
      val: state.destination
        ? (state.destinationCity
            ? `<span class="flag">${state.destination.flag}</span> ${state.destinationCity}, ${state.destination.name}`
            : `<span class="flag">${state.destination.flag}</span> ${state.destination.name} — city needed`)
        : 'Needs your input',
      key: 'destination',
      missing: !state.destination || !state.destinationCity
    })}
    ${fieldRow({ icon: 'cal', label: 'Dates', val: state.dates ? `${state.dates.label} · ${state.dates.nights} nights` : 'Needs your input', key: 'dates', missing: !state.dates })}
    ${fieldRow({ icon: 'briefcase', label: 'Purpose', val: state.purpose || 'Needs your input', key: 'purpose', missing: !state.purpose })}
  `;

  // A1 is no longer asked — handled silently for EU destinations
  const complianceRows = state.destination ? `
    ${needsPwn ? fieldRow({
      icon: 'shield',
      label: `PWN — required for ${state.destination.name}`,
      val: state.pwn === 'yes'
        ? `Working address captured${state.pwnCompany ? ` · ${state.pwnCompany}` : ''}${state.pwnActivity ? ` · ${state.pwnActivity}` : ''}`
        : state.pwn === 'no'
          ? 'Not at client site'
          : 'Working address &amp; company needed',
      key: 'pwn', missing: !state.pwn
    }) : ''}
    ${needsCoc ? fieldRow({
      icon: 'shield',
      label: 'CoC (Certificate of Coverage)',
      val: state.coc === 'yes' ? 'Existing certificate' : state.coc === 'no' ? 'WorkFlex will issue' : 'Has one or not?',
      key: 'coc', missing: !state.coc
    }) : ''}
  ` : '';

  const complianceNote = state.destination && complianceTotal > 0 ? `
    <div class="compliance-note">
      <span class="gicon">${ICONS.shield}</span>
      <div class="body">
        <strong>${state.destination.name} compliance${complianceTotal === 1 ? '' : 's'}:</strong>
        ${needsPwn ? `<span class="pill">PWN</span>` : ''}
        ${needsA1 ? `<span class="pill">A1</span>` : ''}
        ${needsCoc ? `<span class="pill">CoC</span>` : ''}
        <span class="d">${state.destination.name} requires ${[needsPwn && 'a Posted Worker Notification', needsA1 && 'an A1 certificate', needsCoc && 'a Certificate of Coverage'].filter(Boolean).join(' &amp; ')}.</span>
      </div>
    </div>
  ` : '';

  mainEl.innerHTML = `
    <div class="review">
      <div class="review-head">
        <div class="badge-row">${gicon('sparkle')} Generated from your description</div>
        <h2>Here's your trip — does this look right?</h2>
        <p>Edit anything inline. I'll only ask follow-up questions for fields I couldn't find.</p>
      </div>

      ${complianceNote}

      <div class="field-grid">
        ${baseRows}
        ${complianceRows}
      </div>

      <div class="confidence-banner">
        <span class="gicon">${ICONS[missing === 0 ? 'check' : 'warn']}</span>
        <div>
          <strong>AI confidence: ${conf}</strong>
          <span class="desc">${missing === 0 ? `Found all ${total} fields in your message. Nothing's missing — review and submit.` : `Found ${filled} of ${total} fields. ${missing} need${missing === 1 ? '' : 's'} your input before submitting.`}</span>
        </div>
      </div>

      <div class="review-actions">
        <button class="btn tertiary" id="restartCompose">← Start over</button>
        <div class="right">
          <button class="btn secondary">Save as draft</button>
          <button class="btn primary lg" id="submitBtn" ${missing > 0 ? 'disabled' : ''}>Submit request</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('submitBtn').addEventListener('click', () => {
    if (document.getElementById('submitBtn').disabled) return;
    state.view = 'submitted';
    render();
  });
  document.getElementById('restartCompose').addEventListener('click', restart);
  document.querySelectorAll('.edit-btn').forEach(b => {
    b.addEventListener('click', () => fakeEdit(b.dataset.key));
  });
}

function fakeEdit(key) {
  // Demo: fill in missing fields with sensible defaults
  if (key === 'destination') {
    if (!state.destination) state.destination = COUNTRIES[0];
    if (!state.destinationCity) state.destinationCity = state.destination.cities?.[0] || null;
  }
  if (key === 'dates' && !state.dates) state.dates = { start: '22/05/2026', end: '28/05/2026', nights: 6, label: '22 May → 28 May 2026' };
  if (key === 'purpose' && !state.purpose) state.purpose = PURPOSES[0].label;
  if (key === 'pwn' && !state.pwn) {
    state.pwn = 'yes';
    state.pwnAddress = 'Rue Royale 76, 1000 Brussels';
    state.pwnCompany = 'Acme Belgium SA';
    state.pwnActivity = 'Petrochemical industry';
  }
  if (key === 'a1' && !state.a1) state.a1 = 'no';
  if (key === 'coc' && !state.coc) state.coc = 'no';
  if (key === 'traveler' && !state.traveler && state.whoFor === 'employee') state.traveler = { ...EXISTING[0], isNew: false };
  render();
}

function renderSubmitted() {
  const id = 'WFX-' + Math.floor(Math.random()*9000+1000);
  const traveler = state.whoFor === 'me'
    ? `${requestor.firstName} ${requestor.lastName}`
    : `${state.traveler.firstName} ${state.traveler.lastName}`;
  mainEl.innerHTML = `
    <div class="success">
      <div class="check-orb">${ICONS.check}</div>
      <h2>Request submitted</h2>
      <p>${traveler}'s trip to ${state.destinationCity ? state.destinationCity + ', ' : ''}${state.destination.name} ${state.destination.flag} is on its way for review.</p>
      <div class="id">${id}</div>
      <p style="font-size: 12px; color: var(--colorTextTertiary);">Expected review time: 1 business day</p>
      <button class="btn primary lg" id="newOne" style="margin-top: 16px;">Plan another trip</button>
    </div>
  `;
  document.getElementById('newOne').addEventListener('click', restart);
}

function restart() {
  state = { view: 'who', mode: initialMode, whoFor: null, traveler: null, destination: null, destinationCity: null, dates: null, purpose: null, pwn: null, pwnAddress: null, pwnCompany: null, pwnActivity: null, a1: null, coc: null, rawText: '' };
  render();
}

document.getElementById('restartBtn').addEventListener('click', restart);

// Scenario tab clicks
document.querySelectorAll('.scenario-tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.scenario-tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    applyScenario(t.dataset.scenario);
  });
});

render();
</script>

</body>
</html>
