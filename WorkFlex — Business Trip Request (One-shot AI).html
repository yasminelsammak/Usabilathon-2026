<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WorkFlex — Business Trip Request (One-shot AI)</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
:root {
  /* ============ Foundation tokens (SdBS43a2H2Wkx2yBw6ZrZU) ============ */
  /* Primary */
  --colorPrimary: #2A827B;
  --colorPrimaryBg: #F2FAF8;
  --colorPrimaryBgHover: #E6F4F1;
  --colorPrimaryBorder: #62ABA3;
  --colorPrimaryHover: #136B65;
  --colorPrimaryActive: #054946;
  --colorPrimaryText: #2A827B;
  --colorPrimaryTextHover: #136B65;
  --colorPrimaryTextActive: #054946;
  /* Text */
  --colorText: #000000;
  --colorTextSecondary: #5A6872;
  --colorTextTertiary: #9BA8B0;
  --colorTextWhite: #FFFFFF;
  /* Background */
  --colorBgBase: #F4F5F7;
  --colorBgCard: #FFFFFF;
  --colorBgElevated: #F9FAFB;
  --colorBgElevatedSecond: #F4F5F7;
  --colorBgChip: #F9FAFB;
  /* Border */
  --colorBorder: #D9E2E8;
  --colorBorderSecondary: #E8E8E8;
  --colorSeparator: #D9D9D9;
  /* Semantic */
  --colorLink: #1B8CB1;
  --colorError: #FF4D4F;
  --colorErrorBg: #FFF6F6;
  --colorWarning: #F79A3E;
  --colorWarningBg: #FFFAF4;
  --colorWarningText: #6D2F03;
  --colorInfo: #30A9CD;
  --colorInfoBg: #F0FCFF;
  --colorInfoBorder: #C5E7F0;
  /* Components / Filter */
  --filterBgDefault: #FFFFFF;
  --filterBgFilled: #2C3439;
  /* Typography */
  --fontFamily: 'Figtree', -apple-system, BlinkMacSystemFont, sans-serif;
  --fontSize: 14px;
  --fontSizeSM: 12px;
  --fontSizeLG: 16px;
  --fontSizeXL: 20px;
  --fontWeightStrong: 600;
  /* Border radius */
  --borderRadiusXXS: 2px;
  --borderRadiusXS: 4px;
  --borderRadiusS: 6px;
  --borderRadiusM: 8px;
  --borderRadiusL: 16px;
  /* Elevation */
  --boxShadow: 0 1px 2px rgba(0,0,0,.03), 0 1px 6px -1px rgba(0,0,0,.02), 0 2px 4px rgba(0,0,0,.02);
  --boxShadowSecondary: 0 6px 16px rgba(0,0,0,.08), 0 3px 6px -4px rgba(0,0,0,.12), 0 9px 28px 8px rgba(0,0,0,.05);
  /* AI accent (page-level only, not in Foundation) */
  --gradientPrimary: linear-gradient(135deg, #62ABA3 0%, #2A827B 50%, #054946 100%);
  --gradientSoft: linear-gradient(135deg, #F2FAF8 0%, #FFFFFF 100%);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--fontFamily);
  font-size: var(--fontSize);
  color: var(--colorText);
  background: var(--colorBgBase);
  -webkit-font-smoothing: antialiased;
  line-height: 1.55;
  display: flex;
  height: 100vh;
  overflow: hidden;
}

.app-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.main-area {
  display: flex;
  flex: 1;
  min-height: 0;
}
.chat-column {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  overflow-y: auto;
}

/* ============================================================
   *Menu* — Components file 8QDSamuGxoBEMZy1q5l4Ot
   Component set id: 3730:4543 · Status=Expanded variant id 3730:6565
   240×854 · colorBgBase fill · nav item 232×40 · borderRadiusM · 0 16 0 24 padding
   Active: colorBorderSecondary fill · black text · weight 600
============================================================ */
.side-nav {
  width: 240px;
  flex-shrink: 0;
  background: var(--colorBgBase);
  display: flex;
  flex-direction: column;
  padding: 0 4px;
  overflow-y: auto;
}
.side-nav .logo-block { padding: 16px 12px; display: flex; align-items: center; gap: 8px; }
.side-nav .wordmark {
  font-size: var(--fontSizeLG);
  font-weight: 700;
  color: var(--colorPrimary);
  letter-spacing: -0.01em;
  flex: 1;
}
.side-nav .nav-group {
  display: flex; flex-direction: column; gap: 4px;
}
.side-nav .group-title {
  font-size: var(--fontSize);
  font-weight: 700;
  color: var(--colorText);
  height: 40px;
  padding: 0 16px 0 24px;
  display: flex;
  align-items: center;
  border-radius: var(--borderRadiusM);
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 16px 0 24px;
  height: 40px;
  border-radius: var(--borderRadiusM);
  font-size: var(--fontSize);
  font-weight: 400;
  color: var(--colorText);
  text-decoration: none;
  transition: all 0.12s;
}
.nav-item .ico {
  width: 18px; height: 18px;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--colorTextSecondary);
  flex-shrink: 0;
}
.nav-item .ico svg { width: 18px; height: 18px; }
.nav-item .label { flex: 1; }
.nav-item:hover { background: var(--colorBgElevated); }
.nav-item.active {
  background: var(--colorBorderSecondary);
  color: var(--colorText);
  font-weight: 600;
}
.nav-item.active .ico { color: var(--colorText); }
.nav-item .count-pill {
  font-size: var(--fontSizeSM);
  background: var(--colorBgCard);
  color: var(--colorTextSecondary);
  padding: 1px 7px;
  border-radius: 100px;
  font-weight: 600;
  min-width: 22px;
  text-align: center;
}
.nav-item.active .count-pill { background: var(--filterBgFilled); color: white; }
.side-nav .spacer { flex: 1; }
.side-nav .user-block {
  padding: 10px;
  border-top: 1px solid var(--colorBorderSecondary);
  display: flex; align-items: center; gap: 10px;
  margin-top: 8px;
}
.side-nav .user-block .ava {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--colorPrimaryBg);
  color: var(--colorPrimary);
  border: 1px solid var(--colorPrimaryBorder);
  display: flex; align-items: center; justify-content: center;
  font-size: var(--fontSizeSM); font-weight: 700;
}
.side-nav .user-block .name { font-size: var(--fontSize); font-weight: 600; }
.side-nav .user-block .role { font-size: var(--fontSizeSM); color: var(--colorTextSecondary); display: block; }

/* ============ LEFT SIDEBAR ============ */
.ai-sidebar {
  width: 280px;
  flex-shrink: 0;
  background: var(--colorBgElevated);
  border-right: 1px solid var(--colorBorderSecondary);
  padding: 24px 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.ai-sidebar::-webkit-scrollbar { width: 6px; }
.ai-sidebar::-webkit-scrollbar-thumb { background: var(--colorBorder); border-radius: 3px; }

.ai-sidebar .sh {
  font-size: var(--fontSizeSM);
  color: var(--colorTextSecondary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 600;
  margin-bottom: 12px;
}

/* Steps Item / Inline Step — Components file 8QDSamuGxoBEMZy1q5l4Ot · set 3351:2509
   Spec: 6px padding · 6px gap · 4px radius · dot 6×6 (Ellipse)
   States: Waiting (white dot + black 1px border) · Process / Finish (primary green dot)
   Label: 12px Bold (600) when done/active, 12px Regular (400) when waiting
   Secondary: 10px, colorTextSecondary */
.ai-stepper {
  display: flex;
  flex-direction: column;
}
.ai-step {
  display: flex;
  gap: 8px;
  position: relative;
  padding: 6px;
  border-radius: var(--borderRadiusXS);
}
.ai-step:not(:last-child)::after {
  content: '';
  position: absolute;
  left: 14px;
  top: 22px;
  bottom: -2px;
  width: 1px;
  background: var(--colorBorder);
  transition: background 0.2s;
}
.ai-step.done:not(:last-child)::after {
  background: var(--colorPrimary);
}
.ai-step .c {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--colorBgCard);
  border: 1px solid var(--colorText);
  flex-shrink: 0;
  transition: all 0.2s;
  z-index: 1;
  position: relative;
  margin: 6px;
}
.ai-step.active .c,
.ai-step.done .c {
  background: var(--colorPrimary);
  border-color: var(--colorPrimary);
}
.ai-step .body { padding-top: 0; flex: 1; }
.ai-step .label {
  font-size: var(--fontSizeSM);
  font-weight: 400;
  color: var(--colorText);
  line-height: 1.3;
}
.ai-step.active .label,
.ai-step.done .label {
  font-weight: 600;
}
.ai-step .meta {
  font-size: 10px;
  color: var(--colorTextSecondary);
  margin-top: 2px;
  line-height: 1.4;
}

.ai-sum-section {
  padding: 12px 0;
  border-bottom: 1px solid var(--colorBorderSecondary);
  position: relative;
}
/* Red pulse dot — marks the most recently updated field (right side) */
.ai-sum-section.pulsing::after {
  content: '';
  position: absolute;
  right: 4px; top: 16px;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--colorError);
  box-shadow: 0 0 0 4px rgba(255, 77, 79, 0.25);
  animation: dotPulse 1.4s ease-in-out infinite;
}
@keyframes dotPulse {
  0%, 100% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 4px rgba(255, 77, 79, 0.25); }
  50% { transform: scale(1.3); opacity: 0.85; box-shadow: 0 0 0 10px rgba(255, 77, 79, 0.1); }
}

/* Typewriter effect — text types in green, then fades to black */
.ai-sum-section .v.typing {
  color: var(--colorPrimary);
  font-weight: 600;
}
.ai-sum-section .v.typing::after {
  content: '|';
  margin-left: 2px;
  color: var(--colorPrimary);
  animation: blinkCursor 0.7s infinite;
  font-weight: 400;
}
@keyframes blinkCursor {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0; }
}
.ai-sum-section .v.typed {
  animation: typedToBlack 1.4s ease-out forwards;
  font-weight: 600;
}
@keyframes typedToBlack {
  0%, 25% { color: var(--colorPrimary); }
  100% { color: var(--colorText); }
}
.ai-sum-section:last-of-type { border-bottom: none; }
.ai-sum-section.editable {
  margin: 0 -8px;
  padding-left: 8px;
  padding-right: 8px;
  border-radius: var(--borderRadiusS);
  transition: background 0.12s;
}
.ai-sum-section.editable:hover {
  background: var(--colorPrimaryBg);
}
.ai-sum-section.editable:hover .v {
  color: var(--colorPrimary);
}
.ai-sum-section .l {
  font-size: var(--fontSizeSM);
  color: var(--colorTextSecondary);
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-weight: 600;
}
.ai-sum-section .v {
  font-size: var(--fontSize);
  color: var(--colorText);
  font-weight: 500;
  display: flex; align-items: center; gap: 6px;
  flex-wrap: wrap;
}
.ai-sum-section .v.empty { color: var(--colorTextTertiary); font-style: italic; font-weight: 400; }
.ai-sum-section .v .flag { font-size: 16px; }

/* *Tag* / Colorful — Components 8QDSamuGxoBEMZy1q5l4Ot · set 3363:6406
   Spec: 22px height · 8/4 padding · 4px radius · 12px font 400 · 4px gap */
.ai-tag {
  display: inline-flex; align-items: center; gap: 4px;
  height: 22px;
  padding: 0 8px;
  background: var(--colorPrimaryBg);
  color: var(--colorPrimary);
  border-radius: var(--borderRadiusXS);
  font-size: var(--fontSizeSM);
  font-weight: 400;
  line-height: 1;
}
/* Preset variants matching Figma Tag/Colorful */
.ai-tag.grey, .ai-tag.default {
  background: var(--colorBgChip);
  color: var(--colorTextSecondary);
}
.ai-tag.info { background: var(--colorInfoBg); color: var(--colorInfo); }
.ai-tag.success { background: var(--colorPrimaryBg); color: var(--colorPrimary); }
.ai-tag.warning { background: var(--colorWarningBg); color: var(--colorWarning); }
.ai-tag.error { background: var(--colorErrorBg); color: var(--colorError); }
.ai-tag.special { background: #F2F2FD; color: #3D3786; }

/* ============ TOPBAR ============ */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 24px;
  border-bottom: 1px solid var(--colorBorderSecondary);
  background: var(--colorBgCard);
  flex-shrink: 0;
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-back {
  width: 32px; height: 32px;
  border: 1px solid var(--colorBorder);
  border-radius: var(--borderRadiusS);
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer;
  background: var(--colorBgCard);
  color: var(--colorTextSecondary);
  text-decoration: none;
}
.topbar-back:hover { border-color: var(--colorPrimary); color: var(--colorPrimary); }
.brand { display: flex; align-items: center; gap: 8px; font-size: var(--fontSizeLG); font-weight: 600; }
.brand .badge {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--gradientPrimary); color: white;
  font-size: var(--fontSizeSM); padding: 2px 8px;
  border-radius: 100px; font-weight: 600;
}
.brand .badge svg { width: 10px; height: 10px; fill: currentColor; }

.topbar-right { display: flex; align-items: center; gap: 16px; }
.link-btn {
  color: var(--colorLink); font-size: var(--fontSize); font-weight: 500;
  cursor: pointer; background: none; border: none; padding: 0;
  font-family: var(--fontFamily);
}
.link-btn:hover { text-decoration: underline; }
.user-pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 4px 12px 4px 4px;
  border: 1px solid var(--colorBorder);
  border-radius: 100px;
  font-size: var(--fontSize);
  background: var(--colorBgCard);
}
/* *Avatar* — Components 8QDSamuGxoBEMZy1q5l4Ot · set 791:23876
   Spec: circular (border-radius 96px) · primary green tint bg · primary green text · 400 weight
   Sizes: Small ~24 · Default ~32 · Large 40 · Custom 64
   Font-size scales: 24→12, 32→14, 40→16, 64→24 */
.user-pill .ava {
  width: 24px; height: 24px; border-radius: 96px;
  background: var(--colorPrimaryBg);
  color: var(--colorPrimary);
  display: flex; align-items: center; justify-content: center;
  font-size: var(--fontSizeSM); font-weight: 400;
}

/* ============ MAIN ============ */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 48px 24px 80px;
  min-height: 0;
  width: 100%;
}

/* ============ HERO (compose) ============ */
.hero {
  width: 100%;
  max-width: 720px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  animation: rise 0.35s ease-out;
}
@keyframes rise {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.hero-icon {
  width: 64px; height: 64px;
  border-radius: 20px;
  background: var(--gradientPrimary);
  color: white;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 20px;
  box-shadow: var(--boxShadowSecondary);
  position: relative;
}
.hero-icon svg { width: 28px; height: 28px; fill: currentColor; }
.hero-icon::after {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 22px;
  background: var(--gradientPrimary);
  opacity: 0.15;
  z-index: -1;
  animation: pulse 2.4s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 0.15; transform: scale(1); }
  50% { opacity: 0.3; transform: scale(1.08); }
}

.hero h1 {
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.015em;
  margin-bottom: 8px;
  color: var(--colorText);
}
.hero p.sub {
  font-size: var(--fontSizeLG);
  color: var(--colorTextSecondary);
  margin-bottom: 28px;
  max-width: 540px;
}

/* Single/Bulk segmented toggle */
.mode-toggle {
  display: inline-flex;
  padding: 4px;
  background: var(--colorBgCard);
  border: 1px solid var(--colorBorder);
  border-radius: 100px;
  gap: 4px;
  margin-bottom: 28px;
  box-shadow: var(--boxShadow);
}
.mode-toggle button {
  height: 34px;
  padding: 0 18px;
  border: none;
  background: transparent;
  font-family: var(--fontFamily);
  font-size: var(--fontSize);
  font-weight: 500;
  color: var(--colorTextSecondary);
  cursor: pointer;
  border-radius: 100px;
  display: inline-flex; align-items: center; gap: 8px;
  transition: all 0.15s;
}
.mode-toggle button.active {
  background: var(--colorPrimary);
  color: white;
}
.mode-toggle button:hover:not(.active) { color: var(--colorText); }
.mode-toggle button svg { width: 14px; height: 14px; fill: currentColor; }

/* Bulk upload card — matches WorkFlex bulk upload modal */
.bulk-card {
  width: 100%;
  max-width: 640px;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 16px;
  background: var(--colorBgCard);
  border: 1px solid var(--colorBorder);
  border-radius: var(--borderRadiusL);
  padding: 28px;
}
.bulk-info-banner {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--colorInfoBg);
  border: 1px solid var(--colorInfoBorder);
  border-radius: var(--borderRadiusM);
  padding: 12px 14px;
  font-size: var(--fontSize);
  color: var(--colorText);
}
.bulk-info-banner .info-ico {
  width: 18px; height: 18px;
  color: var(--colorInfo);
  flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
}
.bulk-info-banner .info-ico svg { width: 18px; height: 18px; }
.bulk-info-banner a {
  color: var(--colorLink);
  text-decoration: underline;
  font-weight: 500;
}
.bulk-zone {
  width: 100%;
  border: 1.5px dashed var(--colorBorder);
  border-radius: var(--borderRadiusM);
  background: var(--colorBgElevated);
  padding: 36px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  transition: all 0.18s;
  text-align: center;
}
.bulk-zone:hover {
  border-color: var(--colorPrimary);
  background: var(--colorPrimaryBg);
}
.bulk-zone .up-icon {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--colorBgCard);
  border: 1px solid var(--colorBorder);
  color: var(--colorPrimary);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 12px;
}
.bulk-zone .up-icon svg { width: 20px; height: 20px; }
.bulk-zone .t {
  font-size: var(--fontSize);
  font-weight: 600;
  color: var(--colorText);
}
.bulk-zone .d {
  font-size: var(--fontSizeSM);
  color: var(--colorTextSecondary);
}
.bulk-guidelines {
  margin: 4px 4px 0;
  padding: 0 0 0 18px;
  display: flex; flex-direction: column;
  gap: 6px;
}
.bulk-guidelines li {
  font-size: var(--fontSize);
  color: var(--colorTextSecondary);
  line-height: 1.55;
}
.bulk-guidelines li::marker { color: var(--colorTextTertiary); }

.compose-card {
  width: 100%;
  background: var(--colorBgCard);
  border: 1px solid var(--colorBorder);
  border-radius: 100px;
  box-shadow: var(--boxShadowSecondary);
  padding: 4px 4px 4px 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.2s;
}
.compose-card:focus-within {
  border-color: var(--colorPrimary);
  box-shadow: 0 0 0 4px rgba(42, 130, 123, 0.1), var(--boxShadowSecondary);
}
.compose-card textarea {
  flex: 1;
  border: none; outline: none;
  background: transparent;
  resize: none;
  font-family: var(--fontFamily);
  font-size: var(--fontSize);
  line-height: 1.5;
  padding: 10px 0;
  min-height: 24px;
  max-height: 120px;
  color: var(--colorText);
}
.compose-card textarea::placeholder { color: var(--colorTextTertiary); }
.compose-foot {
  font-size: var(--fontSizeSM);
  color: var(--colorTextTertiary);
  margin-top: 8px;
  text-align: center;
}
.compose-foot .hint kbd {
  background: var(--colorBgChip);
  border: 1px solid var(--colorBorder);
  border-radius: var(--borderRadiusXS);
  padding: 1px 6px;
  font-family: var(--fontFamily);
  font-size: 11px;
  font-weight: 600;
}
.compose-foot .hint {
  font-size: var(--fontSizeSM);
  color: var(--colorTextTertiary);
}
.compose-foot .hint kbd {
  background: var(--colorBgChip);
  border: 1px solid var(--colorBorder);
  border-radius: var(--borderRadiusXS);
  padding: 1px 6px;
  font-family: var(--fontFamily);
  font-size: 11px;
  font-weight: 600;
}

/* *Button* — Components file 8QDSamuGxoBEMZy1q5l4Ot
   Component set id: 784:2294 · 144 variants
   Spec: Default 32 · Large 40 · Small 24 · 0 12 padding · 8 radius · Bold 14 · 8 gap */
.btn {
  height: 32px;
  padding: 0 12px;
  border-radius: var(--borderRadiusM);
  font-family: var(--fontFamily);
  font-size: var(--fontSize);
  font-weight: 700;
  cursor: pointer;
  border: 1px solid transparent;
  display: inline-flex;
  align-items: center; gap: 8px;
  justify-content: center;
  transition: all 0.15s;
  white-space: nowrap;
}
.btn.lg { height: 40px; }
.btn.sm { height: 24px; padding: 0 8px; }
.btn.primary {
  background: var(--colorPrimary);
  color: var(--colorTextWhite);
  border-color: var(--colorPrimary);
}
.btn.primary:hover { background: var(--colorPrimaryHover); border-color: var(--colorPrimaryHover); }
.btn.primary:active { background: var(--colorPrimaryActive); border-color: var(--colorPrimaryActive); }
.btn.primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.secondary {
  background: var(--colorBgElevated);
  color: rgba(0,0,0,0.88);
  border-color: rgba(0,0,0,0.88);
}
.btn.secondary:hover { border-color: var(--colorPrimary); color: var(--colorPrimary); }
.btn.tertiary {
  background: transparent;
  color: var(--colorPrimary);
  border-color: transparent;
}
.btn.tertiary:hover { background: var(--colorPrimaryBg); color: var(--colorPrimaryHover); }
.btn svg { width: 16px; height: 16px; }

/* Examples — Chip component */
.examples {
  margin-top: 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: center;
}
.examples-label {
  font-size: var(--fontSizeSM);
  color: var(--colorTextSecondary);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.example-chips {
  display: flex; flex-wrap: wrap; gap: 8px;
  justify-content: center;
  max-width: 720px;
}
.chip {
  height: 36px;
  padding: 0 14px;
  background: var(--colorBgCard);
  border: 1px solid var(--colorBorder);
  border-radius: 100px;
  font-size: var(--fontSize);
  color: var(--colorText);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--fontFamily);
  transition: all 0.15s;
  text-align: left;
}
.chip:hover {
  background: var(--colorPrimaryBg);
  border-color: var(--colorPrimaryBorder);
  color: var(--colorPrimary);
}
.chip .gicon {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--gradientPrimary);
  color: white;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-left: -4px;
}
.chip .gicon svg { width: 11px; height: 11px; fill: currentColor; }

/* ============ PARSING STATE ============ */
.parsing {
  width: 100%;
  max-width: 560px;
  background: var(--colorBgCard);
  border: 1px solid var(--colorBorder);
  border-radius: var(--borderRadiusL);
  box-shadow: var(--boxShadowSecondary);
  padding: 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: rise 0.35s ease-out;
}
.parsing .ai-orb {
  width: 56px; height: 56px;
  border-radius: 50%;
  background: var(--gradientPrimary);
  color: white;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 20px;
  animation: orbPulse 1.6s ease-in-out infinite;
  position: relative;
}
.parsing .ai-orb svg { width: 24px; height: 24px; fill: currentColor; }
.parsing .ai-orb::after {
  content: '';
  position: absolute; inset: -8px;
  border-radius: 50%;
  border: 2px solid var(--colorPrimary);
  opacity: 0.3;
  animation: ring 1.6s ease-out infinite;
}
@keyframes orbPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}
@keyframes ring {
  0% { transform: scale(0.95); opacity: 0.4; }
  100% { transform: scale(1.3); opacity: 0; }
}

.parsing h2 {
  font-size: var(--fontSizeLG);
  font-weight: 600;
  margin-bottom: 20px;
}

.parse-steps {
  width: 100%;
  display: flex; flex-direction: column; gap: 8px;
}
.parse-step {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px;
  border-radius: var(--borderRadiusS);
  background: var(--colorBgElevated);
  font-size: var(--fontSize);
  color: var(--colorTextSecondary);
  opacity: 0.4;
  transition: all 0.3s;
}
.parse-step.done {
  opacity: 1;
  color: var(--colorText);
  background: var(--colorPrimaryBg);
}
.parse-step .check {
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--colorBorder);
  color: white;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.parse-step .check svg { width: 10px; height: 10px; }
.parse-step.done .check { background: var(--colorPrimary); }
.parse-step.active .check {
  background: var(--gradientPrimary);
  animation: orbPulse 1.2s ease-in-out infinite;
}

/* ============ REVIEW STATE ============ */
.review {
  width: 100%;
  max-width: 720px;
  animation: rise 0.35s ease-out;
}
.review-head {
  text-align: center;
  margin-bottom: 28px;
}
.review-head .badge-row {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 12px 6px 8px;
  background: var(--colorPrimaryBg);
  border: 1px solid var(--colorPrimaryBorder);
  border-radius: 100px;
  font-size: var(--fontSizeSM);
  color: var(--colorPrimary);
  font-weight: 600;
  margin-bottom: 12px;
}
.review-head .badge-row .gicon {
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--gradientPrimary);
  color: white;
  display: flex; align-items: center; justify-content: center;
}
.review-head .badge-row .gicon svg { width: 10px; height: 10px; fill: currentColor; }
.review-head h2 {
  font-size: 24px;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin-bottom: 6px;
}
.review-head p {
  font-size: var(--fontSize);
  color: var(--colorTextSecondary);
}

.field-grid {
  background: var(--colorBgCard);
  border: 1px solid var(--colorBorder);
  border-radius: var(--borderRadiusL);
  box-shadow: var(--boxShadow);
  overflow: hidden;
}
.field-row {
  display: flex;
  align-items: center;
  padding: 16px 20px;
  border-bottom: 1px solid var(--colorBorderSecondary);
  gap: 16px;
}
.field-row:last-of-type { border-bottom: none; }
.field-row .ficon {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--gradientPrimary);
  color: white;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.field-row .ficon svg { width: 16px; height: 16px; fill: currentColor; }
.field-row .field-text {
  flex: 1;
  min-width: 0;
}
.field-row .field-label {
  font-size: var(--fontSizeSM);
  color: var(--colorTextSecondary);
  margin-bottom: 2px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-weight: 600;
}
.field-row .field-val {
  font-size: var(--fontSize);
  color: var(--colorText);
  font-weight: 500;
  display: flex; align-items: center; gap: 8px;
}
.field-row .field-val .flag { font-size: 18px; }
.field-row.missing .field-val { color: var(--colorWarning); }
.field-row .edit-btn {
  height: 32px;
  padding: 0 12px;
  background: transparent;
  border: 1px solid var(--colorBorder);
  border-radius: var(--borderRadiusS);
  font-family: var(--fontFamily);
  font-size: var(--fontSizeSM);
  color: var(--colorTextSecondary);
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 4px;
  transition: all 0.15s;
}
.field-row .edit-btn:hover {
  border-color: var(--colorPrimary);
  color: var(--colorPrimary);
}
.field-row.missing .edit-btn {
  background: var(--colorPrimary);
  color: white;
  border-color: var(--colorPrimary);
}
.field-row.missing .edit-btn:hover {
  background: var(--colorPrimaryHover);
}

.tag-mini {
  display: inline-flex;
  padding: 2px 8px;
  background: var(--colorPrimaryBg);
  color: var(--colorPrimary);
  border: 1px solid var(--colorPrimaryBorder);
  border-radius: var(--borderRadiusXXS);
  font-size: var(--fontSizeSM);
  font-weight: 500;
}
.tag-mini.grey {
  background: var(--colorBgChip);
  color: var(--colorTextSecondary);
  border-color: var(--colorBorder);
}
.tag-mini.warn {
  background: var(--colorWarningBg);
  color: var(--colorWarning);
  border-color: var(--colorWarning);
}

.confidence-banner {
  margin-top: 16px;
  background: var(--colorPrimaryBg);
  border: 1px solid var(--colorPrimaryBorder);
  border-radius: var(--borderRadiusM);
  padding: 14px 16px;
  display: flex; gap: 12px;
}
.confidence-banner .gicon {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--gradientPrimary);
  color: white;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.confidence-banner .gicon svg { width: 14px; height: 14px; fill: currentColor; }
.confidence-banner strong { display: block; margin-bottom: 2px; }
.confidence-banner .desc { color: var(--colorTextSecondary); }

/* ============ SCENARIO TABS — demo switcher ============ */
.scenario-tabs {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 8px 16px;
  background: var(--colorBgElevated);
  border-bottom: 1px solid var(--colorBorderSecondary);
  overflow-x: auto;
  flex-shrink: 0;
}
.scenario-tabs::-webkit-scrollbar { display: none; }
.scenario-tabs .lbl {
  font-size: var(--fontSizeSM);
  color: var(--colorTextSecondary);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-right: 12px;
  white-space: nowrap;
}
.scenario-tab {
  display: inline-flex; align-items: center; gap: 6px;
  height: 28px;
  padding: 0 12px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--borderRadiusS);
  font-family: var(--fontFamily);
  font-size: var(--fontSizeSM);
  font-weight: 500;
  color: var(--colorTextSecondary);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
}
.scenario-tab:hover { background: var(--colorBgCard); color: var(--colorText); }
.scenario-tab.active {
  background: var(--colorBgCard);
  border-color: var(--colorBorder);
  color: var(--colorText);
  font-weight: 600;
}
.scenario-tab.active .material-icons { color: var(--colorPrimary); }
.scenario-tab .material-icons {
  font-size: 14px;
  color: var(--colorTextTertiary);
}

/* Inline AI block — shown inside the step view (conversational, not a separate screen) */
.ai-inline-block {
  width: 100%;
  max-width: 720px;
  margin: 0 auto 20px;
  display: flex;
  gap: 14px;
  align-items: flex-start;
  background: var(--colorErrorBg);
  border: 1px solid var(--colorError);
  border-radius: var(--borderRadiusL);
  padding: 16px 18px;
  text-align: left;
  animation: rise 0.3s ease-out;
}
.ai-inline-block.warn {
  background: var(--colorWarningBg);
  border-color: var(--colorWarning);
}
.ai-inline-block .ai-orb {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--colorBgCard);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  color: var(--colorError);
}
.ai-inline-block.warn .ai-orb { color: var(--colorWarning); }
.ai-inline-block .ai-orb .material-icons { font-size: 20px; }
.ai-inline-block .bubble { flex: 1; }
.ai-inline-block .bubble strong {
  font-size: var(--fontSize);
  font-weight: 600;
  color: var(--colorText);
  display: block;
  margin-bottom: 4px;
}
.ai-inline-block .bubble p {
  font-size: var(--fontSize);
  color: var(--colorTextSecondary);
  line-height: 1.55;
  margin-bottom: 12px;
}
.ai-inline-block .inline-actions {
  display: flex; flex-wrap: wrap; gap: 6px;
}

/* ============ Scenario screens (block / policy / recent / pending) ============ */
.scenario-screen {
  width: 100%;
  max-width: 620px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  animation: rise 0.3s ease-out;
}
.scenario-card {
  background: var(--colorBgCard);
  border: 1px solid var(--colorBorder);
  border-radius: var(--borderRadiusL);
  padding: 32px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  align-items: flex-start;
}
.scenario-card.block { border-color: var(--colorError); background: var(--colorErrorBg); }
.scenario-card.warning { border-color: var(--colorWarning); background: var(--colorWarningBg); }
.scenario-card.info { border-color: #D0F4FF; background: var(--colorInfoBg); }
.scenario-card .head-row {
  display: flex; gap: 14px; align-items: flex-start;
}
.scenario-card .ico-wrap {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--colorBgCard);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.scenario-card .ico-wrap .material-icons {
  font-size: 22px;
}
.scenario-card.block .ico-wrap .material-icons { color: var(--colorError); }
.scenario-card.warning .ico-wrap .material-icons { color: var(--colorWarning); }
.scenario-card.info .ico-wrap .material-icons { color: var(--colorInfo); }
.scenario-card h2 {
  font-size: var(--fontSizeLG);
  font-weight: 600;
  color: var(--colorText);
  margin-bottom: 4px;
}
.scenario-card p {
  font-size: var(--fontSize);
  color: var(--colorTextSecondary);
  line-height: 1.55;
}
.scenario-card .actions {
  display: flex; gap: 8px; flex-wrap: wrap;
  margin-top: 8px;
}

/* Recent trips card (returning user) */
.recent-trips-card {
  background: var(--colorBgCard);
  border: 1px solid var(--colorBorder);
  border-radius: var(--borderRadiusL);
  padding: 20px;
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
}
.recent-trips-card h3 {
  font-size: var(--fontSize);
  font-weight: 600;
  margin-bottom: 12px;
  display: flex; align-items: center; gap: 6px;
}
.recent-trips-card h3 .material-icons { font-size: 18px; color: var(--colorPrimary); }
.recent-trip-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px;
  border-radius: var(--borderRadiusM);
  background: var(--colorBgElevated);
  margin-bottom: 8px;
  cursor: pointer;
  transition: all 0.12s;
}
.recent-trip-row:hover {
  background: var(--colorPrimaryBg);
  transform: translateY(-1px);
}
.recent-trip-row .flag { font-size: 24px; flex-shrink: 0; }
.recent-trip-row .info { flex: 1; }
.recent-trip-row .info .name { font-weight: 600; font-size: var(--fontSize); }
.recent-trip-row .info .meta { font-size: var(--fontSizeSM); color: var(--colorTextSecondary); margin-top: 2px; }
.recent-trip-row .repeat-btn {
  font-size: var(--fontSizeSM);
  font-weight: 600;
  color: var(--colorPrimary);
  display: inline-flex; align-items: center; gap: 4px;
}
.recent-trip-row .repeat-btn .material-icons { font-size: 14px; }

/* Pending booking banner */
.booking-banner {
  background: linear-gradient(135deg, var(--colorPrimaryBg) 0%, #FFFFFF 100%);
  border: 1px solid var(--colorPrimaryBorder);
  border-radius: var(--borderRadiusL);
  padding: 20px;
  display: flex; gap: 16px; align-items: flex-start;
  width: 100%;
  max-width: 720px;
  margin: 0 auto 16px;
}
.booking-banner .icon-orb {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--gradientPrimary);
  color: white;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.booking-banner .icon-orb .material-icons { font-size: 22px; }
.booking-banner .body { flex: 1; }
.booking-banner .kicker {
  font-size: var(--fontSizeSM);
  color: var(--colorPrimary);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.booking-banner h3 {
  font-size: var(--fontSizeLG);
  font-weight: 600;
  margin: 2px 0 6px;
}
.booking-banner .desc {
  font-size: var(--fontSize);
  color: var(--colorTextSecondary);
}
.booking-banner .actions { display: flex; gap: 8px; margin-top: 12px; }

/* Policy accept screen */
.policy-card {
  background: var(--colorBgCard);
  border: 1px solid var(--colorBorder);
  border-radius: var(--borderRadiusL);
  padding: 32px;
  width: 100%;
  max-width: 620px;
  margin: 0 auto;
}
.policy-card h2 {
  font-size: 24px; font-weight: 600;
  margin-bottom: 8px;
}
.policy-card .sub {
  font-size: var(--fontSize);
  color: var(--colorTextSecondary);
  margin-bottom: 20px;
}
.policy-list {
  list-style: none;
  padding: 0; margin: 0 0 20px 0;
  display: flex; flex-direction: column; gap: 10px;
}
.policy-list li {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 12px 14px;
  background: var(--colorBgElevated);
  border-radius: var(--borderRadiusM);
  font-size: var(--fontSize);
}
.policy-list li .material-icons {
  font-size: 18px;
  color: var(--colorPrimary);
  flex-shrink: 0;
  margin-top: 1px;
}
.policy-accept {
  display: flex; align-items: center; gap: 10px;
  font-size: var(--fontSize);
  cursor: pointer;
  padding: 8px 0;
  margin-bottom: 16px;
}
.policy-accept input { width: 18px; height: 18px; accent-color: var(--colorPrimary); }

/* ============ CONVERSATIONAL CHAT ============ */
.chat-wrap {
  flex: 1;
  overflow-y: auto;
  padding: 24px 32px 16px;
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--colorBgCard);
}
.chat-stream {
  max-width: 720px;
  margin: 0 auto;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.msg-ai {
  display: flex; gap: 12px;
  animation: rise 0.3s ease-out;
  max-width: 88%;
}
.msg-ai .ava {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--gradientPrimary);
  color: white;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  align-self: flex-end;
}
.msg-ai .ava svg { width: 16px; height: 16px; fill: currentColor; }
.msg-ai .body {
  background: var(--colorBgElevated);
  padding: 14px 18px;
  border-radius: var(--borderRadiusL);
  border-bottom-left-radius: var(--borderRadiusXS);
  font-size: var(--fontSize);
  line-height: 1.55;
  color: var(--colorText);
}
.msg-ai .body strong { font-weight: 600; }
.msg-ai .body .hint { display: block; font-size: var(--fontSizeSM); color: var(--colorTextSecondary); margin-top: 6px; }

.msg-user {
  align-self: flex-end;
  max-width: 78%;
  background: var(--colorPrimary);
  color: var(--colorTextWhite);
  padding: 12px 16px;
  border-radius: var(--borderRadiusL);
  border-bottom-right-radius: var(--borderRadiusXS);
  font-size: var(--fontSize);
  font-weight: 500;
  animation: rise 0.3s ease-out;
}

.typing-bubble {
  display: flex; gap: 12px;
  animation: rise 0.25s ease-out;
}
.typing-bubble .ava {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--gradientPrimary);
  color: white;
  display: flex; align-items: center; justify-content: center;
}
.typing-bubble .ava svg { width: 16px; height: 16px; fill: currentColor; }
.typing-bubble .dots {
  display: inline-flex; gap: 4px;
  padding: 16px 18px;
  background: var(--colorBgElevated);
  border-radius: var(--borderRadiusL);
  border-bottom-left-radius: var(--borderRadiusXS);
  align-items: center;
}
.typing-bubble .dots span {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--colorTextTertiary);
  animation: bounce 1.2s infinite;
}
.typing-bubble .dots span:nth-child(2) { animation-delay: 0.15s; }
.typing-bubble .dots span:nth-child(3) { animation-delay: 0.3s; }
@keyframes bounce { 0%,80%,100% {opacity:.3; transform:translateY(0);} 40%{opacity:1; transform:translateY(-2px);} }

.composer-wrap-chat {
  border-top: 1px solid var(--colorBorderSecondary);
  background: var(--colorBgCard);
  padding: 14px 32px 18px;
  flex-shrink: 0;
}
.composer-inner-chat {
  max-width: 720px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 10px;
}
.chat-suggestions {
  display: flex; flex-wrap: wrap; gap: 6px;
  min-height: 32px;
}
.chip-suggest {
  height: 32px;
  padding: 0 12px;
  background: var(--colorBgCard);
  border: 1px solid var(--colorBorder);
  border-radius: var(--borderRadiusS);
  font-size: var(--fontSize);
  color: var(--colorText);
  cursor: pointer;
  display: inline-flex;
  align-items: center; gap: 6px;
  font-family: var(--fontFamily);
}
.chip-suggest:hover { background: var(--colorPrimaryBg); border-color: var(--colorPrimaryBorder); color: var(--colorPrimary); }
.chip-suggest .gicon {
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--gradientPrimary);
  color: white;
  display: flex; align-items: center; justify-content: center;
  margin-left: -2px;
}
.chip-suggest .gicon svg { width: 9px; height: 9px; fill: currentColor; }

.chat-composer {
  display: flex; align-items: flex-end; gap: 8px;
  background: var(--colorBgElevated);
  border: 1px solid var(--colorBorder);
  border-radius: var(--borderRadiusL);
  padding: 6px 6px 6px 16px;
  transition: all 0.15s;
}
.chat-composer:focus-within {
  border-color: var(--colorPrimary);
  background: var(--colorBgCard);
}
.chat-composer textarea {
  flex: 1; border: none; outline: none; background: transparent; resize: none;
  font-family: var(--fontFamily); font-size: var(--fontSize);
  color: var(--colorText); line-height: 1.5;
  padding: 8px 0; min-height: 24px; max-height: 120px;
}
.chat-send-btn {
  width: 36px; height: 36px;
  border: none; border-radius: var(--borderRadiusM);
  background: var(--colorPrimary); color: white;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.chat-send-btn:hover { background: var(--colorPrimaryHover); }
.chat-send-btn svg { width: 14px; height: 14px; }

/* Compose-step "for [someone]" pill — used in chat too */
.chat-context-pill {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--colorPrimaryBg);
  border: 1px solid var(--colorPrimaryBorder);
  border-radius: 100px;
  padding: 4px 12px 4px 6px;
  font-size: var(--fontSize);
  color: var(--colorPrimary);
  align-self: center;  /* center within the centered hero */

// Read initial mode from URL query param (?mode=bulk)

// Scenario controls the initial state + special screens shown across the flow.

let state = {

  view: 'who',

function parse(text) {
  const t = text.toLowerCase();
  const out = {};

  if (/\b(for me|for myself|myself|i('m| am)? going)\b/.test(t)) out.whoFor = 'me';
  else {
    // Match "for [Name]" — capital first letter
    const m = text.match(/for ([A-ZÀ-ÿ][a-zà-ÿ]+(?: [A-ZÀ-ÿ][a-zà-ÿ]+)?)/);
    if (m) {
      const name = m[1];
      const match = EXISTING.find(e => name.toLowerCase().includes(e.firstName.toLowerCase()));
      if (match) { out.whoFor = 'employee'; out.traveler = { ...match, isNew: false }; }
      else {
        const [fn, ...rest] = name.split(' ');
        out.whoFor = 'employee';
        out.traveler = { firstName: fn, lastName: rest.join(' ') || '', email: `${fn.toLowerCase()}@acme.com`, isNew: true };
      }
    }
  }

  // Try known city first (more specific) — captures city + sets country
  for (const c of COUNTRIES) {
    for (const city of c.cities || []) {
      if (t.includes(city.toLowerCase())) {
        out.destination = c;
        out.destinationCity = city;
        break;
      }
    }
    if (out.destination) break;
  }
  // Fall back to known country alias
  if (!out.destination) {
    for (const c of COUNTRIES) {
      if (c.aliases.some(a => t.includes(a))) { out.destination = c; break; }
    }
  }
  // Free-form: accept any "to <Location>" or "in <Location>" — works for any city/country
  if (!out.destination) {
    const m = text.match(/\b(?:to|in|going to|trip to|travel to|visiting)\s+([A-Z][A-Za-zÀ-ÿ]+(?:\s+[A-Z][A-Za-zÀ-ÿ]+)?)/);
    if (m) {
      const loc = m[1].trim();
      // Treat as city by default; flag as unknown country
      out.destination = { name: loc, flag: '🌍', cities: [loc], aliases: [loc.toLowerCase()], compliance: [], custom: true };
      out.destinationCity = loc;
    }
  }

  // dates: "May 22–28" or "22-28 May" or "next week"
  const monthRe = /(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+(\d{1,2})\s*(?:-|–|—|to|until)\s*(\d{1,2})/i;
  const monthRe2 = /(\d{1,2})\s*(?:-|–|—|to|until)\s*(\d{1,2})\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*/i;
  let m = text.match(monthRe);
  let m2 = !m && text.match(monthRe2);
  if (m || m2) {
    const month = (m ? m[1] : m2[3]).slice(0,3).toLowerCase();
    const start = parseInt(m ? m[2] : m2[1], 10);
    const end = parseInt(m ? m[3] : m2[2], 10);
    const months = { jan:'Jan', feb:'Feb', mar:'Mar', apr:'Apr', may:'May', jun:'Jun', jul:'Jul', aug:'Aug', sep:'Sep', oct:'Oct', nov:'Nov', dec:'Dec' };
    const monthAbbr = months[month];
    out.dates = { start: `${start}/05/2026`, end: `${end}/05/2026`, nights: end - start, label: `${start} ${monthAbbr} → ${end} ${monthAbbr} 2026` };
  }

  for (const p of PURPOSES) if (p.aliases.some(a => t.includes(a))) { out.purpose = p.label; break; }

  // Compliance hints: "she has an A1", "no A1", "client site"
  if (/\b(has|already have|existing) (an? )?(a1|coc)\b/i.test(t)) out.a1 = 'yes';
  else if (/\bno a1\b|\bissue (an? )?a1\b/i.test(t)) out.a1 = 'no';

  if (/\bclient site|client office|at client\b/i.test(t)) out.pwn = 'yes';
  else if (/\bnot at client|no client\b/i.test(t)) out.pwn = 'no';

  return out;
}

// Track the last field that got the typewriter so we don't replay it on every re-render
let lastTypedField = null;

function runTypewriter(el) {
  if (!el) return;
  const originalHTML = el.innerHTML;
  // Preserve any inline HTML (flags, tags) by capturing then replaying char-by-char on the text
  const finalText = el.textContent;
  el.innerHTML = '';
  el.classList.add('typing');
  el.classList.remove('typed');
  const chars = Array.from(finalText); // unicode-safe split for emoji/flags
  let i = 0;
  const speed = 28; // ms per char
  const tick = setInterval(() => {
    el.textContent = chars.slice(0, i + 1).join('');
    i++;
    if (i >= chars.length) {
      clearInterval(tick);
      // Restore the original HTML (so flags/tags re-render correctly) then start fade-to-black
      el.innerHTML = originalHTML;
      el.classList.remove('typing');
      el.classList.add('typed');
      // After fade animation completes, remove the class so subsequent renders don't loop
      setTimeout(() => el.classList.remove('typed'), 1500);
    }
  }, speed);
}

    if (state.whoFor === 'employee' && state.traveler) return `<div class="v">${state.traveler.firstName} ${state.traveler.lastName} ${state.traveler.isNew ? '<span class="ai-tag">New invite</span>' : ''}</div>`;
    return `<div class="v empty">Not yet detected</div>`;
  })();

  const compliance = (state.pwn && state.a1)
    ? `<div class="v">All clear <span class="ai-tag">✓</span></div>`
    : (state.pwn || state.a1)
      ? `<div class="v">In progress</div>`
      : `<div class="v empty">—</div>`;

  // Map the lastUpdatedField key to which sidebar section should pulse
  const sectionForField = {
    traveler: 'traveler',
    destination: 'destination', destinationCity: 'destination',
    dates: 'dates',
    purpose: 'purpose',
    pwn: 'compliance', pwnAddress: 'compliance', pwnCompany: 'compliance', pwnActivity: 'compliance',
    a1: 'compliance', coc: 'compliance',
  };
  const activeSection = sectionForField[state.lastUpdatedField] || null;
  const cls = (section) => activeSection === section ? ' pulsing' : '';

  sidebarEl.innerHTML = `
    <div>
      <div class="sh">AI flow</div>
      <div class="ai-stepper">
        ${phases.map((p, i) => `
          <div class="ai-step ${i < idx ? 'done' : i === idx ? 'active' : ''}">
            <div class="c"></div>
            <div class="body">
              <div class="label">${p.label}</div>
              <div class="meta">${p.meta}</div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>

    <div>
      <div class="sh">Trip summary <span style="font-weight: 400; text-transform: none; color: var(--colorTextTertiary); margin-left: 4px;">· click to edit</span></div>
      <div class="ai-sum-section">
        <div class="l">Requestor</div>
        <div class="v">${requestor.firstName} ${requestor.lastName} <span class="ai-tag grey">${requestor.role}</span></div>
      </div>
      <div class="ai-sum-section editable${cls('traveler')}" data-edit-field="traveler">
        <div class="l">Traveler</div>
        ${travelerHtml}
      </div>
      <div class="ai-sum-section editable${cls('destination')}" data-edit-field="destination">
        <div class="l">Destination</div>
        <div class="v ${state.destination ? '' : 'empty'}">${state.destination ? `<span class="flag">${state.destination.flag}</span> ${state.destinationCity ? state.destinationCity + ', ' : ''}${state.destination.name}` : '—'}</div>
      </div>
      <div class="ai-sum-section editable${cls('dates')}" data-edit-field="dates">
        <div class="l">Dates</div>
        <div class="v ${state.dates ? '' : 'empty'}">${state.dates ? state.dates.label : '—'}</div>
      </div>
      <div class="ai-sum-section editable${cls('purpose')}" data-edit-field="purpose">
        <div class="l">Purpose</div>
        <div class="v ${state.purpose ? '' : 'empty'}">${state.purpose || '—'}</div>
      </div>
      <div class="ai-sum-section editable${cls('compliance')}" data-edit-field="pwn">
        <div class="l">Compliance</div>
        ${compliance}
      </div>
    </div>
  `;

  // Wire click-to-edit on filled fields — clearing the field jumps the AI back to that question
  sidebarEl.querySelectorAll('.ai-sum-section.editable').forEach(el => {
    const field = el.dataset.editField;
    const isFilled = !el.querySelector('.v.empty');
    if (!isFilled) return; // only filled rows are clickable
    el.style.cursor = 'pointer';
    el.addEventListener('click', () => {
      if (field === 'traveler') state.traveler = null;
      else if (field === 'destination') { state.destination = null; state.destinationCity = null; }
      else if (field === 'dates') state.dates = null;
      else if (field === 'purpose') state.purpose = null;
      else if (field === 'pwn') { state.pwn = null; state.pwnAddress = null; state.pwnCompany = null; state.pwnActivity = null; state.a1 = null; state.coc = null; }
      state.view = 'step';
      render();
    });
  });

  // Trigger the typewriter effect only when lastUpdatedField changed (not on every re-render)
  if (state.lastUpdatedField && state.lastUpdatedField !== lastTypedField) {
    const pulsingValue = sidebarEl.querySelector('.ai-sum-section.pulsing .v');
    if (pulsingValue && pulsingValue.textContent.trim() && !pulsingValue.classList.contains('empty')) {
      runTypewriter(pulsingValue);
    }
    lastTypedField = state.lastUpdatedField;
  }
}

function render() {
  renderSidebar();
  // Bulk mode skips the "who" step (bulk file already has traveler per row)
  if (state.view === 'who' && state.mode === 'bulk') state.view = 'compose';
  // Scenario-specific intercepts
  if (state.view === 'scenarioScreen') { renderScenarioScreen(); return; }
  if (state.view === 'who') renderWho();
  else if (state.view === 'step') renderStep();
  else if (state.view === 'compose') renderCompose(); // bulk mode only
  else if (state.view === 'parsing') renderParsing();
  else if (state.view === 'review') renderReview();
  else if (state.view === 'submitted') renderSubmitted();
}

/* ============================================================
   Demo scenarios — toggled via the top tab strip
============================================================ */
function applyScenario(name) {
  // Reset
  Object.assign(state, {
    scenario: name,
    view: 'who',
    whoFor: null,
    traveler: null,
    destination: null, destinationCity: null,
    dates: null, purpose: null,
    pwn: null, pwnAddress: null, pwnCompany: null, pwnActivity: null,
    a1: null, coc: null,
    rawText: '', submitted: false,
    lastUpdatedField: null,
    mode: 'single',
  });
  lastTypedField = null;

  if (name === 'domestic') {
    // Pre-fill state so the user lands on the destination question, then any answer triggers a block
    state.whoFor = 'employee';
    state.traveler = { firstName: 'Sara', lastName: 'Müller', email: 'sara.muller@acme.com', dept: 'Engineering', country: '🇩🇪', isNew: false, payrollCountry: 'Germany' };
    state.view = 'step';
  } else if (name === 'unsupported') {
    state.whoFor = 'me';
    state.view = 'step';
  } else if (name === 'firstTime') {
    state.view = 'scenarioScreen';
  } else if (name === 'returning') {
    state.view = 'who'; // who-picker with recent trips section added
  } else if (name === 'pendingBooking') {
    state.view = 'scenarioScreen';
  } else {
    state.view = 'who';
  }
  render();
}

      state.destination = COUNTRIES.find(c => c.name === 'Sweden') || { name: 'Sweden', flag: '🇸🇪', cities: ['Stockholm'], aliases: ['sweden'], compliance: ['a1'] };

/* ============================================================
   Step-by-step conversational compose
   Same centered pill layout — one question at a time
   With chat history of previous Q&As shown above
============================================================ */
function renderStep() {
  const next = findNextQuestion();
  if (!next) {
    // All collected — go to review
    state.view = 'review';
    render();
    return;
  }
  state.currentQuestion = next.key;
  const ctxIcon = state.whoFor === 'me' ? ICONS.user : ICONS.team;
  const ctxText = state.whoFor === 'me' ? 'yourself' :
    (state.traveler ? `${state.traveler.firstName} ${state.traveler.lastName}` : 'an employee');

  // Build history of answered questions in order
  const orderedKeys = ['traveler','destination','destinationCity','dates','purpose','pwnAddress','pwnCompany','pwnActivity','a1','coc'];
  const answered = orderedKeys
    .filter(k => Q[k] && !Q[k].when() && getAnswerDisplay(k))
    .map(k => ({ key: k, q: Q[k], display: getAnswerDisplay(k) }));

  // Chat history removed — sidebar is now the single source of truth (clickable to edit)
  const historyHtml = '';

  // Conversational block — if AI flagged the previous destination as domestic / unsupported,
  // show the AI's response inline above the input instead of switching to a separate screen
  const blockHtml = (next.key === 'destination' && state.blockedReason) ? (() => {
    const reason = state.blockedReason;
    const badCountry = state.blockedDestination || 'that country';
    const trav = state.whoFor === 'me' ? 'your' : (state.traveler ? `${state.traveler.firstName}'s` : 'their');
    if (reason === 'domestic') {
      return `
        <div class="ai-inline-block">
          <span class="ai-orb"><span class="material-icons">block</span></span>
          <div class="bubble">
            <strong>${badCountry} is in ${trav} home country.</strong>
            <p>Your company hasn't turned on domestic trips for WorkFlex yet — try an international destination, or ask HR to enable it.</p>
            <div class="inline-actions">
              <button class="chip-suggest" data-block-action="hr"><span class="material-icons" style="font-size:14px">mail</span>Contact HR</button>
              <button class="chip-suggest" data-block-action="suggest"><span class="material-icons" style="font-size:14px">public</span>See supported countries</button>
            </div>
          </div>
        </div>
      `;
    }
    if (reason === 'unsupported') {
      return `
        <div class="ai-inline-block warn">
          <span class="ai-orb"><span class="material-icons">public_off</span></span>
          <div class="bubble">
            <strong>We don't support ${badCountry} yet.</strong>
            <p>WorkFlex doesn't have full compliance coverage for ${badCountry} — pick one of the supported countries below, or type a different city.</p>
            <div class="inline-actions">
              ${COUNTRIES.slice(0, 5).map(c => `<button class="chip-suggest" data-block-pick="${c.name}">${c.flag} ${c.name}</button>`).join('')}
            </div>
          </div>
        </div>
      `;
    }
    return '';
  })() : '';

  mainEl.innerHTML = `
    <div class="hero">
      <div class="hero-icon">${ICONS.sparkleLarge}</div>
      <h1>${next.title()}</h1>
      <p class="sub">${next.hint ? next.hint() : ''}</p>

      <button class="chat-context-pill" id="changeWho" style="margin-bottom: 20px;" type="button">
        <span class="ic">${ctxIcon}</span>
        <span>Creating for <strong>${ctxText}</strong></span>
        <span class="change">Change</span>
      </button>

      ${blockHtml}

      <div class="compose-card">
        <textarea id="stepInput" rows="1" placeholder="${next.placeholder || 'Type your answer…'}"></textarea>
        <button class="btn primary" id="stepSendBtn" style="height: 40px; padding: 0 16px; border-radius: 100px;">
          <span style="width:14px;height:14px;display:inline-flex">${ICONS.sparkle}</span>
          Continue
        </button>
      </div>
      ${next.key === 'destination' ? `<div class="autocomplete-dropdown" id="dropdownDest" style="display:none"></div>` : ''}
      ${next.key === 'traveler' ? `<div class="autocomplete-dropdown" id="dropdownEmp" style="display:none"></div>` : ''}
      ${next.key === 'purpose' ? `<div id="purposeSuggestion"></div><a class="purpose-browse" href="#" id="purposeBrowse">Browse all trip purposes →</a>` : ''}
      <div class="compose-foot">
        <span class="hint"><kbd>⌘</kbd> + <kbd>↵</kbd> to continue · WorkFlex AI can make mistakes — review before submitting</span>
      </div>

      ${historyHtml}
    </div>
  `;

  // Inline block actions (domestic / unsupported scenarios)
  document.querySelectorAll('[data-block-action]').forEach(b => {
    b.addEventListener('click', () => {
      const action = b.dataset.blockAction;
      if (action === 'hr') {
        alert('Sending message to HR… (prototype)');
      } else if (action === 'suggest') {
        // scroll/focus input — supported countries are visible in autocomplete
        document.getElementById('stepInput')?.focus();
      }
    });
  });
  document.querySelectorAll('[data-block-pick]').forEach(b => {
    b.addEventListener('click', () => {
      const country = COUNTRIES.find(c => c.name === b.dataset.blockPick);
      if (!country) return;
      state.destination = country;
      state.blockedReason = null;
      state.blockedDestination = null;
      state.lastUpdatedField = 'destination';
      render();
    });
  });

  // Edit-from-history: clicking a previous answer clears it so user can re-answer
  document.querySelectorAll('[data-edit]').forEach(b => {
    b.addEventListener('click', () => {
      const k = b.dataset.edit;
      if (k === 'traveler') state.traveler = null;
      else if (k === 'destination') { state.destination = null; state.destinationCity = null; }
      else if (k === 'destinationCity') state.destinationCity = null;
      else if (k === 'dates') state.dates = null;
      else if (k === 'purpose') state.purpose = null;
      else if (k === 'pwnAddress') { state.pwnAddress = null; state.pwnCompany = null; state.pwnActivity = null; state.pwn = null; }
      else if (k === 'pwnCompany') { state.pwnCompany = null; state.pwnActivity = null; }
      else if (k === 'pwnActivity') state.pwnActivity = null;
      else if (k === 'a1') state.a1 = null;
      else if (k === 'coc') state.coc = null;
      render();
    });
  });

  // Wire input
  const input = document.getElementById('stepInput');
  const sendBtn = document.getElementById('stepSendBtn');
  input.focus();
  const autoResize = () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 120) + 'px'; };
  input.addEventListener('input', autoResize);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitStep(); }
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') submitStep();
  });
  sendBtn.addEventListener('click', submitStep);

  // ============ Smart autocomplete (destination only) ============
  const dropdown = document.getElementById('dropdownDest');
  if (dropdown && next.key === 'destination') {
    const refreshSuggestions = () => {
      const q = input.value.toLowerCase().trim();
      if (q.length < 1) { dropdown.style.display = 'none'; return; }
      const matches = DESTINATION_SUGGESTIONS
        .filter(s => s.searchKey.includes(q))
        .slice(0, 6);
      if (matches.length === 0) { dropdown.style.display = 'none'; return; }
      dropdown.innerHTML = matches.map((m, i) => `
        <div class="autocomplete-item" data-i="${i}">
          <span class="flag">${m.country.flag}</span>
          <span class="text">
            <span class="city">${m.city}</span>
            <span class="country">${m.country.name}</span>
          </span>
          ${complianceShort(m.compliance) ? `<span class="compliance-pill">${complianceShort(m.compliance)}</span>` : ''}
        </div>
      `).join('');
      dropdown.style.display = 'block';
      dropdown.querySelectorAll('.autocomplete-item').forEach(item => {
        item.addEventListener('mousedown', e => e.preventDefault()); // keep input focus
        item.addEventListener('click', () => {
          const m = matches[parseInt(item.dataset.i, 10)];
          state.destination = m.country;
          state.destinationCity = m.city;
          state.lastUpdatedField = 'destination';
          renderSidebar();
          render();
        });
      });
    };
    input.addEventListener('input', refreshSuggestions);
    input.addEventListener('focus', refreshSuggestions);
    input.addEventListener('blur', () => setTimeout(() => { dropdown.style.display = 'none'; }, 200));
  }

  // ============ Smart autocomplete (traveler / employee) ============
  const empDD = document.getElementById('dropdownEmp');
  if (empDD && next.key === 'traveler') {
    const refreshEmp = () => {
      const q = input.value.toLowerCase().trim();
      const matches = EXISTING.filter(e => {
        const hay = `${e.firstName} ${e.lastName} ${e.email} ${e.dept || ''}`.toLowerCase();
        return !q || hay.includes(q);
      });
      // Show all when empty, top 6 when filtering
      const shown = q ? matches.slice(0, 6) : matches.slice(0, 5);
      const isAmbiguous = q && matches.length > 1 && matches.every(m => m.firstName.toLowerCase() === matches[0].firstName.toLowerCase());

      const header = isAmbiguous
        ? `<div style="padding: 10px 16px; font-size: var(--fontSizeSM); color: var(--colorTextSecondary); border-bottom: 1px solid var(--colorBorderSecondary); background: var(--colorWarningBg); color: var(--colorWarningText);">
            Found <strong>${matches.length}</strong> people named "<strong>${q}</strong>" — pick the right one
          </div>`
        : '';

      const hasQuery = q.length > 0;
      const noMatches = hasQuery && shown.length === 0;

      // Invite row — only when user is actively searching
      const inviteRow = hasQuery ? `
        <div class="autocomplete-item invite-row${noMatches ? ' invite-row-cta' : ''}" data-action="invite">
          <span class="invite-orb">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M7 4V0h2v4h4v2H9v4H7V6H3V4h4z"/></svg>
          </span>
          <span class="text">
            <span class="invite-title">Invite "${input.value.trim()}"</span>
            <span class="invite-sub">${noMatches ? 'No match found — add them to WorkFlex with this trip' : 'Add them to WorkFlex with this trip'}</span>
          </span>
          <span class="material-icons invite-arrow">chevron_right</span>
        </div>
      ` : '';

      const emptyHint = !hasQuery ? `
        <div class="emp-empty-hint">Recent teammates · type to search or invite someone new</div>
      ` : '';

      empDD.innerHTML = header + emptyHint + (noMatches ? inviteRow : '') + shown.map((e, i) => `
        <div class="autocomplete-item" data-i="${i}" style="padding: 10px 16px; gap: 12px;">
          <span class="emp-ava" style="width: 32px; height: 32px; border-radius: 50%; background: var(--colorPrimaryBg); color: var(--colorPrimary); border: 1px solid var(--colorPrimaryBorder); display: flex; align-items: center; justify-content: center; font-size: var(--fontSize); font-weight: 600; flex-shrink: 0;">${e.firstName[0]}${e.lastName[0]}</span>
          <span class="text" style="flex-direction: column; align-items: flex-start; gap: 2px;">
            <span class="city" style="display: flex; align-items: center; gap: 6px;">
              ${e.firstName} ${e.lastName}
              ${e.country ? `<span style="font-size: 14px;">${e.country}</span>` : ''}
            </span>
            <span class="country" style="font-size: var(--fontSizeSM);">${e.email}${e.dept ? ` · ${e.dept}` : ''}</span>
          </span>
        </div>
      `).join('') + (noMatches ? '' : inviteRow);

      empDD.style.display = 'block';
      empDD.querySelectorAll('.autocomplete-item').forEach(item => {
        item.addEventListener('mousedown', e => e.preventDefault());
        item.addEventListener('click', () => {
          if (item.dataset.action === 'invite') {
            empDD.style.display = 'none';
            openInviteEmployeeModal(input.value.trim(), (newEmp) => {
              state.traveler = newEmp;
              state.lastUpdatedField = 'traveler';
              renderSidebar();
              render();
            });
            return;
          }
          const emp = shown[parseInt(item.dataset.i, 10)];
          state.traveler = { ...emp, isNew: false };
          state.lastUpdatedField = 'traveler';
          renderSidebar();
          render();
        });
      });
    };
    input.addEventListener('input', refreshEmp);
    input.addEventListener('focus', refreshEmp);
    input.addEventListener('blur', () => setTimeout(() => { empDD.style.display = 'none'; }, 200));
  }

  // ============ Purpose suggestion card — WORKFLEX SUGGESTION style ============
  const purposeBox = document.getElementById('purposeSuggestion');
  const purposeBrowse = document.getElementById('purposeBrowse');
  if (purposeBox && next.key === 'purpose') {
    // Strong discriminators — keywords that strongly signal one purpose over its similar siblings
    const HANDS_ON_SIGNALS = ['audit','install','installation','setup','maintenance','service','repair','fix','hands-on','on-site','onsite','physical','technician'];
    const NO_HANDS_ON_SIGNALS = ['discussion','presentation','sync','review','pitch','demo','kickoff','introduction'];

    const scorePurposes = (text) => {
      const t = text.toLowerCase().trim();
      return PURPOSES.map(p => {
        let score = 0;
        if (t && p.aliases.some(a => a.includes(t) || t.includes(a))) score += 100;
        if (t && p.label.toLowerCase().includes(t)) score += 50;
        if (t) {
          const tokens = t.split(/\W+/).filter(Boolean);
          const aliasTokens = p.aliases.join(' ').toLowerCase().split(/\W+/);
          score += tokens.filter(w => aliasTokens.some(at => at.startsWith(w) || w.startsWith(at))).length * 10;
        }
        // Discriminator boost — push the right "with/no hands-on" variant to the top
        if (t) {
          if (p.label.includes('with hands-on') && HANDS_ON_SIGNALS.some(k => t.includes(k))) score += 200;
          if (p.label.includes('no hands-on') && NO_HANDS_ON_SIGNALS.some(k => t.includes(k))) score += 200;
        }
        if (!t) score = 1;
        return { p, score };
      }).filter(s => s.score > 0).sort((a, b) => b.score - a.score);
    };

    const acceptPurpose = (label) => {
      state.purpose = label;
      state.lastUpdatedField = 'purpose';
      renderSidebar();
      render();
    };

    const renderSuggestion = (showAll = false) => {
      const t = input.value.trim();
      if (!t && !showAll) { purposeBox.innerHTML = ''; return; }
      const scored = scorePurposes(t);
      if (scored.length === 0) { purposeBox.innerHTML = ''; return; }
      const best = scored[0].p;
      const alts = showAll ? PURPOSES.filter(p => p.label !== best.label) : scored.slice(1, 4).map(s => s.p);

      purposeBox.innerHTML = `
        <div class="purpose-card">
          <div class="head">
            <div class="left">
              <span class="check-orb"><svg viewBox="0 0 16 16"><path d="M3 8l3.5 3.5L13 5"/></svg></span>
              <div class="text-block">
                <div class="kicker">WorkFlex suggestion</div>
                <div class="title-text">${best.label}</div>
              </div>
            </div>
            <button class="select-action" id="selectPurpose">
              Select <span class="kbd">↵</span>
            </button>
          </div>
          ${alts.length ? `
            <div class="purpose-alts">
              <span class="lbl">Not this?</span>
              ${alts.map(a => `<button class="alt-chip" data-label="${a.label}">${a.label}</button>`).join('')}
            </div>
          ` : ''}
          <div class="purpose-foot">
            <span class="sparkle">${ICONS.sparkle}</span>
            <span>Does this look right? Select to continue.</span>
          </div>
        </div>
      `;
      document.getElementById('selectPurpose').addEventListener('click', () => acceptPurpose(best.label));
      purposeBox.querySelectorAll('.alt-chip').forEach(c => {
        c.addEventListener('mousedown', e => e.preventDefault());
        c.addEventListener('click', () => acceptPurpose(c.dataset.label));
      });
    };

    input.addEventListener('input', () => renderSuggestion(false));
    purposeBrowse.addEventListener('click', e => { e.preventDefault(); openPurposeBrowseModal(acceptPurpose); });

    // On Enter, if a suggestion is shown, select the best match instead of falling back to free text
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        const card = document.querySelector('.purpose-card .title-text');
        if (card && input.value.trim()) { e.preventDefault(); e.stopPropagation(); acceptPurpose(card.textContent); }
      }
    }, true);
  }

  // Change context
  const changeBtn = document.getElementById('changeWho');
  if (changeBtn) changeBtn.addEventListener('click', () => {
    state.whoFor = null;
    state.view = 'who';
    render();
  });
}

function submitStep() {
  const input = document.getElementById('stepInput');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  const q = Q[state.currentQuestion];
  if (!q) return;
  q.apply(text);
  state.lastUpdatedField = state.currentQuestion;

  // Clear any previous block once the user provides a fresh (non-blocked) destination
  if ((state.currentQuestion === 'destination' || state.currentQuestion === 'destinationCity') && state.destination) {
    state.blockedReason = null;
    state.blockedDestination = null;
  }
  // Scenario intercepts after destination is set — handled in-conversation via blockedReason flag
  if (state.currentQuestion === 'destination' || state.currentQuestion === 'destinationCity') {
    if (state.scenario === 'domestic' && state.destination) {
      const travelerCountry = state.traveler?.payrollCountry || 'Germany';
      if (state.destination.name === travelerCountry) {
        state.blockedReason = 'domestic';
        state.blockedDestination = state.destination.name;
        state.destination = null;
        state.destinationCity = null;
        state.lastUpdatedField = null;
        setTimeout(() => render(), 200);
        return;
      }
    }
    if (state.scenario === 'unsupported' && state.destination) {
      const known = COUNTRIES.some(c => c.name.toLowerCase() === state.destination.name.toLowerCase());
      if (!known || state.destination.custom) {
        state.blockedReason = 'unsupported';
        state.blockedDestination = state.destination.name;
        state.destination = null;
        state.destinationCity = null;
        state.lastUpdatedField = null;
        setTimeout(() => render(), 200);
        return;
      }
    }
  }

  // Advance to next question — single render keeps the sidebar DOM stable so the typewriter can run
  setTimeout(() => render(), 200);
}

              <svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>

    document.getElementById('chatSend').addEventListener('click', handleAnswer);

      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    });
    const changeBtn = document.getElementById('changeWho');
    if (changeBtn) changeBtn.addEventListener('click', () => {
      state.whoFor = null;
      state.view = 'who';
      state.chatStarted = false;
      render();
    });

    // Greet + ask first question
    state.chatStarted = true;
    setTimeout(async () => {
      const intro = state.whoFor === 'me'
        ? `Hi <strong>${requestor.firstName}</strong> 👋 Let me help you plan your trip. I'll ask a few quick questions.`

/* Invite new employee — modal with first name / last name / email */
function openInviteEmployeeModal(prefill, onInvited) {
  const existing = document.getElementById('inviteEmpOverlay');
  if (existing) existing.remove();

  // Try to parse "First Last" from the prefill
  const parts = (prefill || '').trim().split(/\s+/);
  const pFirst = parts[0] || '';
  const pLast = parts.slice(1).join(' ');

  const overlay = document.createElement('div');
  overlay.id = 'inviteEmpOverlay';
  overlay.style.cssText = `position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:200; display:flex; align-items:center; justify-content:center; padding:24px;`;
  overlay.innerHTML = `
    <div class="invite-modal">
      <div class="invite-modal-head">
        <div>
          <h2>Invite a new employee</h2>
          <div class="invite-modal-sub">They'll be added to WorkFlex along with this trip</div>
        </div>
        <button class="invite-modal-close" id="inviteEmpClose" aria-label="Close">
          <span class="material-icons">close</span>
        </button>
      </div>
      <div class="invite-modal-body">
        <div class="invite-field">
          <label>First name</label>
          <input id="invFirst" type="text" placeholder="e.g. Sara" value="${pFirst.replace(/"/g, '&quot;')}" autocomplete="off" />
        </div>
        <div class="invite-field">
          <label>Last name</label>
          <input id="invLast" type="text" placeholder="e.g. Müller" value="${pLast.replace(/"/g, '&quot;')}" autocomplete="off" />
        </div>
        <div class="invite-field">
          <label>Work email</label>
          <input id="invEmail" type="email" placeholder="name@company.com" autocomplete="off" />
        </div>
      </div>
      <div class="invite-modal-foot">
        <button class="invite-btn-secondary" id="inviteEmpCancel">Cancel</button>
        <button class="invite-btn-primary" id="inviteEmpSubmit" disabled>Invite &amp; continue</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const close = () => overlay.remove();
  const first = document.getElementById('invFirst');
  const last = document.getElementById('invLast');
  const email = document.getElementById('invEmail');
  const submit = document.getElementById('inviteEmpSubmit');

  const refresh = () => {
    submit.disabled = !(first.value.trim() && last.value.trim() && /.+@.+\..+/.test(email.value));
  };
  [first, last, email].forEach(i => i.addEventListener('input', refresh));
  refresh();

  // Auto-suggest an email pattern once both names are typed (only if user hasn't typed one)
  let emailTouched = false;
  email.addEventListener('input', () => { emailTouched = true; });
  const suggestEmail = () => {
    if (emailTouched) return;
    const fn = first.value.trim().toLowerCase();
    const ln = last.value.trim().toLowerCase();
    if (fn && ln) email.value = `${fn}.${ln}@acme.com`;
    else if (fn) email.value = `${fn}@acme.com`;
    refresh();
  };
  first.addEventListener('blur', suggestEmail);
  last.addEventListener('blur', suggestEmail);

  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  document.getElementById('inviteEmpClose').addEventListener('click', close);
  document.getElementById('inviteEmpCancel').addEventListener('click', close);
  document.addEventListener('keydown', function escClose(e) {
    if (e.key === 'Escape') { close(); document.removeEventListener('keydown', escClose); }
  });

  submit.addEventListener('click', () => {
    if (submit.disabled) return;
    const newEmp = {
      firstName: first.value.trim(),
      lastName: last.value.trim(),
      email: email.value.trim(),
      dept: 'New employee',
      country: '',
      isNew: true,
    };
    close();
    if (typeof onInvited === 'function') onInvited(newEmp);
  });

  // Focus the first empty field
  setTimeout(() => {
    if (!first.value) first.focus();
    else if (!last.value) last.focus();
    else email.focus();
  }, 0);
}
